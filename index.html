<script>const SEED={employees:[],plans:[],history:[],audit:[],recruitment:[],snapshots:[],settings:{retirementAge:60}};
const KEY='production-hr-single-html-v1';const today=()=>new Date().toISOString().slice(0,10);const year=()=>new Date().getFullYear();const $=s=>document.querySelector(s);const fmt=n=>Number(n||0).toLocaleString('ko-KR');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.floor(Date.now()*1000+Math.random()*1000);const occupied=e=>e.status!=='퇴사';const keyOf=x=>[x.corporation||'',x.headquarters||'',x.department||''].join('␟');
let db=structuredClone(SEED),view='dashboard',search='',filters={},planYear=year(),historyEmployee='';for(const k of ['employees','plans','history','audit'])db[k]??=[]; db.plans.forEach(p=>p.year=Number(p.year));
function save(){db.lastSaved=new Date().toLocaleString('ko-KR');$('#saveBadge').textContent='공유 저장 확인 중';$('#saveBadge').className='pill warn';return true}
function commit(action,detail){db.audit.unshift({id:uid(),date:new Date().toLocaleString('ko-KR'),action,detail});db.audit=db.audit.slice(0,2000);save();render()}
function plansFor(y){return db.plans.filter(p=>Number(p.year)===Number(y))}function unitCount(p){return db.employees.filter(e=>occupied(e)&&e.corporation===p.corporation&&e.headquarters===p.headquarters&&e.department===p.department).length}function planSummary(){let a=plansFor(planYear);return {target:a.reduce((s,p)=>s+Number(p.target||0),0),actual:a.reduce((s,p)=>s+unitCount(p),0),short:a.reduce((s,p)=>s+Math.max(0,Number(p.target||0)-unitCount(p)),0),extra:a.reduce((s,p)=>s+Math.max(0,unitCount(p)-Number(p.target||0)),0)}}
function card(label,num,note,cl=''){return `<div class="card"><div class="label">${label}</div><div class="num ${cl}">${fmt(num)}</div><div class="note">${note}</div></div>`}function summaryCards(){const active=db.employees.filter(occupied),ret=db.employees.length-active.length,ps=planSummary();return `<div class="cards">${card('현재 운영 인원',active.length,'퇴사 제외 · 파견·대기·휴직 포함')}${card('사업계획 정원',ps.target,planYear+'년 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족분의 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과분의 합계','warning')}${card('퇴사 누계',ret,'등록된 전체 퇴사 인원')}</div>`}
function select(name,opts,val='',empty='전체'){return `<select id="${name}">${empty!==null?`<option value="">${empty}</option>`:''}${opts.map(x=>`<option value="${esc(x)}" ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function unique(field){return [...new Set(db.employees.map(e=>e[field]||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}function options(field,val=''){return `<datalist id="dl-${field}">${unique(field).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`}function heading(s){return `<div class="summaryline"><strong>${s}</strong></div>`}
const names={photoAdmin:['직원 사진 관리','사진 일괄 등록과 미등록 직원 현황을 확인합니다.'],dashboard:['대시보드','전체 인원과 사업계획 대비 TO를 즉시 확인합니다.'],employees:['생산직 인원관리','인원 추가·수정·퇴사 처리 시 정원 현황이 함께 갱신됩니다.'],plans:['사업계획 정원 · TO','연도·법인·본부·부서별 정원을 지정하고 충원 현황을 관리합니다.'],organization:['부서별 · 성별','생산직 운영 인원 구성 및 부서 현황을 조회합니다.'],history:['개인별 연혁','직원별 입사·이동·승급·퇴사 등을 누적 관리합니다.'],audit:['변경 기록','인원 및 사업계획 변경 내역을 확인합니다.'],backup:['저장 · 백업','현재 내용은 이 브라우저에 저장됩니다. 정기적인 백업을 권장합니다.']};

function organizationView(){let map=new Map();db.employees.filter(occupied).forEach(e=>{let k=keyOf(e);if(!map.has(k))map.set(k,{...e,total:0,male:0,female:0});let o=map.get(k);o.total++;if(e.gender==='남')o.male++;if(e.gender==='여')o.female++});return `<section class="panel"><h2>부서별 · 성별 운영 인원</h2><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부</th><th>부서</th><th class="right">총인원</th><th class="right">남</th><th class="right">여</th><th>구성</th></tr></thead><tbody>${[...map.values()].sort((a,b)=>b.total-a.total).map(v=>`<tr><td>${esc(v.corporation)}</td><td>${esc(v.headquarters)}</td><td>${esc(v.department)}</td><td class="right"><b>${v.total}</b></td><td class="right">${v.male}</td><td class="right">${v.female}</td><td style="width:18%"><div class="bar"><i style="width:${100*v.male/v.total}%"></i></div></td></tr>`).join('')}</tbody></table></div></section>`}

function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalWrap').classList.add('open')}function closeModal(){$('#modalWrap').classList.remove('open')}function field(label,id,value='',type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function get(id){return $('#'+id)?.value.trim()||''}
function hrEmployeeIdArg(id){return JSON.stringify(id).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function employeeBirthDate(employee){
 const e=employee||{};
 const direct=[e.birth_date,e.birthdate,e.date_of_birth,e.dob,e.birthDate,e['생년월일']];
 for(const item of direct){
  const str=String(item??'').trim();
  const match=str.match(/^(\d{4})[-./]?(\d{2})[-./]?(\d{2})$/);
  if(match){const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]);
   const dt=new Date(Date.UTC(y,m-1,d));
   if(y>=1900&&y<=new Date().getFullYear()&&dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d)return `${match[1]}-${match[2]}-${match[3]}`;
  }
 }
 const sources=[e.rrn,e.resident_no,e.resident_number,e.resident_registration_number,e.residentRegistrationNumber,e.jumin,e.jumin_no,e.ssn,e['주민등록번호'],e['주민번호']];
 for(const raw of sources){
  const value=String(raw??'').replace(/[^0-9]/g,'');
  if(value.length<7)continue;
  const prefix=value.slice(0,6),code=value[6];
  const century=({'1':1900,'2':1900,'5':1900,'6':1900,'3':2000,'4':2000,'7':2000,'8':2000,'9':1800,'0':1800})[code];
  if(century==null)continue;
  const yy=Number(prefix.slice(0,2)),m=Number(prefix.slice(2,4)),d=Number(prefix.slice(4,6)),y=century+yy;
  const dt=new Date(Date.UTC(y,m-1,d));
  if(y>new Date().getFullYear()||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)continue;
  return `${y}-${prefix.slice(2,4)}-${prefix.slice(4,6)}`;
 }
 return '—';
}
function legacyOpenEmployee(id=null,encoded=''){let e=db.employees.find(x=>x.id===id)||{};if(encoded){let [corporation,headquarters,department]=decodeURIComponent(encoded).split('␟');e={...e,corporation,headquarters,department}}modal(id?'인원 수정':'신규 생산직 등록',`<div class="formgrid">${field('사번 *','eNo',e.employee_no,'text','required')}${field('성명 *','eName',e.name,'text','required')}${field('법인 *','eCorp',e.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','eHQ',e.headquarters,'text','list="dl-headquarters"')}${field('부서 *','eDept',e.department,'text','list="dl-department"')}${field('직위','ePosition',e.position)}${field('직급','eGrade',e.grade)}<label>성별${select('eGender',['남','여'],e.gender,'선택')}</label>${field('생년월일','eBirth',employeeBirthDate(e)==='—'?'':employeeBirthDate(e),'date')}${field('연령','eAge',e.age||'','number','min="0" max="110"')}${field('입사일','eHire',e.hire_date||today(),'date')}<label>현재 상태${select('eStatus',['재직','휴직','파견','대기','산재','육아휴직','퇴사'],e.status||'재직',null)}</label>${field('학력','eEducation',e.education||'')}${options('corporation')}${options('headquarters')}${options('department')}</div><div class="hint" style="margin-top:15px">부서명이 정원 계획과 완전히 동일해야 해당 TO에 반영됩니다. 상태를 '퇴사'로 변경하면 정원 대비 현재 인원에서 즉시 제외됩니다.</div><div class="modalactions">${id?`<button class="btn danger" onclick="deleteEmployee(${hrEmployeeIdArg(id)})">완전 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveEmployee(${id==null?'null':hrEmployeeIdArg(id)})">저장</button></div>`)}
function legacySaveEmployee(id){let no=get('eNo'),name=get('eName'),corp=get('eCorp'),hq=get('eHQ'),dept=get('eDept');if(!no||!name||!corp||!hq||!dept){alert('사번, 성명, 법인, 본부, 부서를 입력하세요.');return}if(db.employees.some(e=>e.employee_no===no&&e.id!==id)){alert('중복된 사번입니다.');return}let obj={employee_no:no,name,corporation:corp,headquarters:hq,department:dept,position:get('ePosition'),grade:get('eGrade'),gender:get('eGender'),age:get('eAge')?Number(get('eAge')):null,hire_date:get('eHire'),status:get('eStatus'),education:get('eEducation'),field_leader_role:get('eLeader')||'미지정',birth_date:document.getElementById('eBirth')?get('eBirth'):((id?db.employees.find(x=>x.id===id):null)?.birth_date||'')};if(id){let old=db.employees.find(e=>e.id===id);if(!old)return;let prev={...old};Object.assign(old,obj);if(prev.status!==obj.status){if(obj.status==='퇴사')old.exit_date=get('eExitDate')||old.exit_date||today();else if(prev.status==='퇴사')old.exit_date='';if(obj.status==='휴직')old.leave_date=get('eLeaveDate')||old.leave_date||today();else if(prev.status==='휴직')old.leave_date='';}if(prev.status!==obj.status)db.history.unshift({employee_id:id,event_date:obj.status==='퇴사'?(get('eExitDate')||today()):obj.status==='휴직'?(get('eLeaveDate')||today()):today(),event_type:obj.status==='퇴사'?'퇴사':'상태변경',title:obj.status,description:'상태 변경: '+prev.status+' → '+obj.status,department:dept,grade:obj.grade});if(keyOf(prev)!==keyOf(obj))db.history.unshift({employee_id:id,event_date:today(),event_type:'발령',title:'소속 변경',description:prev.department+' → '+dept,department:dept,grade:obj.grade});commit('인원 수정',no+' '+name); }else{let newid=uid();db.employees.push({id:newid,...obj,...(obj.status==='퇴사'?{exit_date:get('eExitDate')||today()}:{}),...(obj.status==='휴직'?{leave_date:get('eLeaveDate')||today()}:{})});db.history.unshift({employee_id:newid,event_date:obj.hire_date||today(),event_type:'입사',title:'입사',description:'인원 신규 등록',department:dept,grade:obj.grade});commit('인원 추가',no+' '+name+' / '+dept)}closeModal()}

function savePlan(id){let yearValue=Number(get('pYear')),corporation=get('pCorp'),headquarters=get('pHQ'),department=get('pDept'),val=get('pTarget'),target=Number(val);if(!yearValue||!corporation||!headquarters||!department||val===''||!Number.isInteger(target)||target<0){alert('계획 정보를 정확히 입력해 주세요.');return}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yearValue&&p.corporation===corporation&&p.headquarters===headquarters&&p.department===department)){alert('해당 연도·조직의 계획이 이미 존재합니다. 기존 항목을 수정하세요.');return}let o={year:yearValue,corporation,headquarters,department,target};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yearValue;closeModal();commit(id?'정원 수정':'정원 추가',yearValue+' / '+department+' / '+target+'명')}

async function restoreJSON(ev){let f=ev.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.employees)||!Array.isArray(o.plans)||!Array.isArray(o.history)){throw Error('올바른 백업 파일이 아닙니다')}if(!confirm('현재 저장된 내용을 모두 백업 파일로 교체하시겠습니까?'))return;db={employees:o.employees,plans:o.plans,history:o.history,audit:Array.isArray(o.audit)?o.audit:[]};if(!save())return;render();alert('백업을 복원했습니다.')}catch(e){alert('복원 실패: '+e.message)}finally{ev.target.value=''}}

function plansView(){const a=plansFor(planYear),ps=monthSummary();return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('선택월 계획 정원',ps.target,planYear+'년 '+planMonth+'월')}${card('현재 운영 인원',ps.actual,'정원 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과 합계','warning')}</div><section class="panel"><div class="toolbar"><button class="btn primary" onclick="openPlan()">+ 사업계획 등록</button><button class="btn" onclick="fillPlanFromCurrent()">현재 인원 기준 초안</button><button class="btn" onclick="setView('executive')">경영진 보고</button></div><div class="notice">연간 기본 정원을 입력하고 월별로 조정할 수 있습니다. 월별 미입력 정원은 연간 기본 정원을 적용합니다. 과거 월 인원 실적이 아닌 <b>현재 재직 인원</b>과 비교합니다.</div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th class="right">선택월 계획</th><th class="right">현재 운영</th><th class="right">부족</th><th class="right">초과</th><th>충족률</th><th>관리</th></tr></thead><tbody>${a.sort((x,y)=>x.corporation.localeCompare(y.corporation,'ko')||x.department.localeCompare(y.department,'ko')).map(p=>{let t=monthTarget(p),n=unitCount(p),sh=Math.max(0,t-n),ex=Math.max(0,n-t);return `<tr><td>${esc(p.corporation)}</td><td>${esc(p.headquarters)}</td><td><b>${esc(p.department)}</b></td><td class="right">${fmt(t)}</td><td class="right">${fmt(n)}</td><td class="right negative">${sh||'-'}</td><td class="right warning">${ex||'-'}</td><td>${t?Math.round(n/t*100)+'%':n?'계획 없음':'-'}</td><td><button class="btn tiny" onclick="openPlan(${p.id})">월별 수정</button> <button class="btn tiny primary" onclick="openRecruitment(null,'${encodeURIComponent(keyOf(p))}')">채용 요청</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">해당 연도 정원이 없습니다.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>월별 사업계획 정원 추이</h2><div class="tablewrap"><table><thead><tr><th>월</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}</tr></thead><tbody><tr><td><b>총 계획</b></td>${Array.from({length:12},(_,i function openPlan(id=null){let p=db.plans.find(x=>x.id===id)||{year:planYear,target:0};modal(id?'월별 사업계획 수정':'월별 사업계획 등록',`<div class="formgrid">${field('사업계획 연도 *','pYear',p.year,'number','min="2000" max="2100"')}${field('법인 *','pCorp',p.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','pHQ',p.headquarters,'text','list="dl-headquarters"')}${field('부서 *','pDept',p.department,'text','list="dl-department"')}${field('연간 기본 정원 *','pTarget',p.target??0,'number','min="0" step="1"')}${options('corporation')}${options('headquarters')}${options('department')}</div><h3 style="margin-top:24px">1~12월 계획 인원</h3><div class="month-grid">${Array.from({length:12},(_,i)=>`<label>${i+1}월<input id="pm${i}" type="number" min="0" step="1" placeholder="기본 정원" value="${p.months?.[i]??''}"></label>`).join('')}</div><p class="hint">빈칸은 기본 정원이 자동 적용됩니다. 0을 입력하면 해당 월 계획 인원은 0명입니다.</p><div class="modalactions">${id?`<button class="btn danger" onclick="deletePlan(${id})">계획 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="savePlan(${id||'null'})">저장</button></div>`)}
function savePlan(id){let yr=Number(get('pYear')),corp=get('pCorp'),hq=get('pHQ'),dept=get('pDept'),v=get('pTarget'),t=Number(v);if(!Number.isInteger(yr)||yr<2000||yr>2100||!corp||!hq||!dept||v===''||!Number.isInteger(t)||t<0){alert('연도·조직·기본 정원을 확인하세요.');return}const months=[];for(let i=0;i<12;i++){const x=get('pm'+i);if(x!==''&&(!Number.isInteger(Number(x))||Number(x)<0)){alert(i+1+'월 계획을 확인하세요.');return}months.push(x===''?null:Number(x))}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yr&&keyOf(p)===keyOf({corporation:corp,headquarters:hq,department:dept}))){alert('동일 연도·조직의 계획이 있습니다.');return}const o={year:yr,corporation:corp,headquarters:hq,department:dept,target:t,months};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yr;closeModal();commit('월별 정원 '+(id?'수정':'등록'),yr+' / '+dept)}

<script>/* Field leader register and organization analytics */

function openEmployeeMassEdit(){
 const selected=db.employees.filter(e=>empSelected.has(String(e.id)));
 if(!selected.length)return alert('변경할 직원을 먼저 체크해 주세요.');
 const countByCorp={};selected.forEach(e=>countByCorp[e.corporation]=(countByCorp[e.corporation]||0)+1);
 const fields=Object.entries(massAllowed).map(([key,label])=>{const opts={status:['재직','휴직','파견','대기','산재','육아휴직','퇴사'],union_status:['가입','미가입','미확인'],field_leader_role:extraChoices('field_leader_role'),gender:['남','여'],salary_type:['월급','시급'],employment_type:['정규직','계약직','미확인']}[key];return `<label>${esc(label)}${opts?select('mass_'+key,opts,'','변경 안 함'):`<input id="mass_${key}" placeholder="변경 안 함" list="mass-list-${key}"><datalist id="mass-list-${key}">${extraChoices(key).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`}</label>`}).join('');
 modal('선택 인원 일괄 수정',`<div class="notice"><b>선택 인원 ${selected.length}명</b> · ${Object.entries(countByCorp).map(([a,b])=>`${esc(a)} ${b}명`).join(' / ')}<br>변경할 항목만 선택하세요. 비워 둔 항목은 변경되지 않습니다. 퇴사 처리 시 현재 TO가 자동 갱신됩니다.</div><div class="formgrid">${fields}</div><div class="hint">가입 여부는 확인된 정보만 변경하세요. 한 번에 변경한 결과는 공동 DB에 저장 요청되며, 변경 기록에 남습니다.</div><div class="modalactions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="applyEmployeeMassEdit()">${selected.length}명 일괄 변경</button></div>`);
}
window.applyEmployeeMassEdit=function(){
 const selected=db.employees.filter(e=>empSelected.has(String(e.id))),changes=Object.keys(massAllowed).map(k=>[k,cleanVal(document.getElementById('mass_'+k)?.value)]).filter(([,v])=>v!=='');
 if(!selected.length)return alert('선택 인원이 없습니다.');if(!changes.length)return alert('변경할 항목을 입력하거나 선택하세요.');
 const diffs=selected.map(e=>({e,props:changes.filter(([k,v])=>cleanVal(e[k]||((k==='union_status')?'미확인':k==='field_leader_role'?'미지정':''))!==v)})).filter(x=>x.props.length);
 if(!diffs.length)return alert('실제로 변경할 내용이 없습니다.');
 const caption=changes.map(([k,v])=>`${massAllowed[k]} → ${v}`).join(' / ');
 if(!confirm(`${diffs.length}명의 정보를 일괄 변경합니다.\n${caption}\n\n되돌리려면 별도 수정이 필요합니다. 계속할까요?`))return;
 const now=today();
 for(const {e,props} of diffs){const detail=props.map(([k,v])=>`${massAllowed[k]}: ${cleanVal(e[k])||'-'} → ${v}`);for(const [k,v] of props)e[k]=v;if(props.some(([k])=>k==='status')){if(e.status==='퇴사')e.exit_date=now;else e.exit_date='';}if(props.some(([k])=>k==='position'||k==='grade'||k==='status'||k==='field_leader_role'))db.history.unshift({employee_id:e.id,event_date:now,event_type:'일괄변경',title:'인사정보 일괄 변경',description:detail.join(' / '),department:e.department,grade:e.grade});}
 empSelected.clear();closeModal();commit('인사정보 일괄 수정',`${diffs.length}명 / ${caption}`);alert(`${diffs.length}명 변경사항을 공동 DB에 저장 요청했습니다. 상단 저장 완료 표시를 확인하세요.`);
};

// Monthly historical dashboard: historical totals come ONLY from immutable saved monthly snapshots.
const priorDashboardByMonth=dashboard;
function monthEndLabel(y,m){return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`}
function historicalDashboard(s){
 const plans=plansFor(planYear);
 const units=s.units||{};
 const byCorp={};
 for(const [key,count] of Object.entries(units)){
   const corp=key.split('␟')[0]||'미지정';byCorp[corp]=(byCorp[corp]||0)+Number(count||0);
 }
 const metrics=plans.map(p=>({p,n:Number(units[keyOf(p)]||0),target:monthTarget(p,planMonth)}));
 const total=Number(s.total ?? Object.values(byCorp).reduce((a,b)=>a+b,0));
 const target=metrics.reduce((v,x)=>v+x.target,0),short=metrics.reduce((v,x)=>v+Math.max(0,x.target-x.n),0),extra=metrics.reduce((v,x)=>v+Math.max(0,x.n-x.target),0);
 const months=yearPicker();
 const info=`<div class="notice"><b>${monthEndLabel(planYear,planMonth)} 저장 인원 기준</b> · 기록시각 ${esc(s.captured||'월말 자동기록')} · 재직·휴직 포함 · 과거 직원별 명부나 현장관리자 직책을 소급 계산하지 않습니다.</div>`;
 const orgrows=metrics.sort((a,b)=>Math.max(0,b.target-b.n)-Math.max(0,a.target-a.n)).map(({p,n,target})=>`<tr><td>${esc(p.corporation)} · ${esc(orgLabel(p.headquarters))}<br><b>${esc(p.department)}</b></td><td class="right">${fmt(target)}</td><td class="right">${fmt(n)}</td><td class="right ${target>n?'negative':target<n?'warning':'positive'}">${target>n?'-'+(target-n):target<n?'+'+(n-target):'일치'}</td></tr>`).join('');
 const max=Math.max(1,...Object.values(byCorp));
 return months+info+`<div class="cards">${card('선택월 말 운영 인원',total,'월말 저장 기록')}${card('사업계획 정원',target,'선택 연·월의 계획')}${card('부족 TO',short,'월말 기록과 계획 비교','negative')}${card('초과 TO',extra,'월말 기록과 계획 비교','warning')}</div><div class="section"><section class="panel"><h2>선택월 말 조직별 정원 비교</h2><div class="tablewrap"><table><thead><tr><th>법인 / 본부 / 부서</th><th class="right">계획</th><th class="right">월말 인원</th><th class="right">부족 / 초과</th></tr></thead><tbody>${orgrows||'<tr><td colspan="4">해당 월 계획 없음</td></tr>'}</tbody></table></div></section><section class="panel"><h2>선택월 말 법인별 인원</h2>${Object.entries(byCorp).sort((a,b)=>CORPS.indexOf(a[0])-CORPS.indexOf(b[0])).map(([corp,n])=>`<div style="margin:17px 0"><div class="summaryline" style="justify-content:space-between;margin-bottom:7px"><b>${esc(corp)}</b><b>${fmt(n)}명</b></div><div class="bar"><i style="width:${100*n/max}%"></i></div></div>`).join('')||'<p class="muted">등록된 인원이 없습니다.</p>'}</section></div>`;
}
dashboard=function(){
 const s=snapshotMonth(planYear,planMonth);
 if(s)return historicalDashboard(s);
 const now=new Date(),isCurrent=(now.getFullYear()===Number(planYear)&&now.getMonth()+1===Number(planMonth));
 if(!isCurrent)return yearPicker()+`<section class="panel"><h2>${planYear}년 ${planMonth}월 월말 기록 없음</h2><div class="notice">해당 월의 월말 실적이 아직 저장되지 않았습니다. <b>현재 인원을 과거 월말 수치로 대신 표시하지 않습니다.</b> 자동 기록은 Supabase 예약 SQL 설정 후 매월 말일 23:59(한국시간)에 실행됩니다.</div><button class="btn" onclick="setView('forecast')">월별 실적 확인 →</button></section>`;
 return priorDashboardByMonth().replace('<div class="notice"><b>TO 산정 기준</b>', '<div class="notice"><b>당월 잠정 현황 · 월말 확정 전</b> · 월말 저장이 실행되면 선택월은 확정 기록으로 자동 전환됩니다.</div><div class="notice"><b>TO 산정 기준</b>');
};

names.exits=['퇴사자 명단','퇴사일·근속기간을 확인하고 기존 기록을 보존하여 관리합니다.'];
const originalEmployeeMatches=employeeMatches;
// This filter excludes former workers even if an older status filter still requests them.
employeeMatches=function(e){return e.status!=='퇴사'&&originalEmployeeMatches(e)};
const originalEmployeeView=employeesView;
employeesView=function(){let html=originalEmployeeView();return html.replace('전체 '+fmt(db.employees.length)+'명','현재 인원 '+fmt(db.employees.filter(occupied).length)+'명').replace('전체 상태','현재 상태').replace(/<option value="퇴사"[^>]*>퇴사<\/option>/g,'')};
function exitDate(e){
 if(e.exit_date&&/^\d{4}-\d{2}-\d{2}$/.test(String(e.exit_date)))return e.exit_date;
 const ev=db.history.filter(h=>String(h.employee_id)===String(e.id)&&(h.event_type==='퇴사'||h.title==='퇴사')).map(h=>String(h.event_date||'').slice(0,10)).filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v)).sort();
 return ev.length?ev[ev.length-1]:'';
}
function durationOf(e){const start=String(e.hire_date||''),end=exitDate(e);if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!end)return '확인 필요';let [a,b,c]=start.split('-').map(Number),[y,m,d]=end.split('-').map(Number);if(end<start)return '확인 필요';let years=y-a,months=m-b;if(d<c)months--;if(months<0){years--;months+=12}return `${years}년 ${months}개월`}
let exitSearch='',exitCorp='';
function exitsView(){const all=db.employees.filter(e=>e.status==='퇴사').sort((a,b)=>dateFirstEmployeeSort(a,b,'exit'));const listed=all.filter(e=>(!exitCorp||e.corporation===exitCorp)&&(!exitSearch||[e.name,e.employee_no,e.department].some(v=>String(v||'').toLocaleLowerCase('ko').includes(exitSearch.toLocaleLowerCase('ko')))));
 return `<section class="panel"><div class="toolbar"><input id="exitSearch" placeholder="퇴사자 성명·사번·부서 검색" value="${esc(exitSearch)}" style="min-width:240px">${select('exitCorp',CORPS,exitCorp,'전체 법인')}<button class="btn" onclick="exitSearch='';exitCorp='';render()">필터 초기화</button></div><div class="summaryline"><b>퇴사자 ${fmt(all.length)}명</b><span class="muted">검색 결과 ${fmt(listed.length)}명 · 기존 데이터 삭제 없음</span></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>이름</th><th>법인</th><th>부서</th><th>직위</th><th>직급</th><th>입사일</th><th>퇴사일</th><th>퇴사사유</th><th>근속기간</th><th>관리</th></tr></thead><tbody>${listed.map(e=>`<tr><td>${esc(e.employee_no)}</td><td>${esc(e.name)}</td><td>${esc(e.corporation)}</td><td>${esc(e.department)}</td><td>${esc(e.position)}</td><td>${esc(e.grade)}</td><td>${esc(e.hire_date)}</td><td>${esc(exitDate(e)||'미기록')}</td><td>${esc(e.exit_reason||'미기록')}</td><td>${esc(durationOf(e))}</td><td><button type="button" class="btn tiny" data-employee-edit="${esc(String(e.id))}">수정</button> <button class="btn tiny" onclick="openPersonal(${hrEmployeeIdArg(e.id)})">연혁</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">퇴사자가 없습니다.</td></tr>'}</tbody></table></div></section>`;
}
// Keep exit dates accurate for direct termination, employee editing, and mass editing.
const oldRetire=retire;
retire=function(id){const e=db.employees.find(x=>String(x.id)===String(id));oldRetire(id);if(e&&e.status==='퇴사'&&!exitDate(e)) {e.exit_date=today();save()} };
const oldSaveEmployeeExit=saveEmployee;
saveEmployee=function(id){const e=db.employees.find(x=>String(x.id)===String(id)),before=e?.status;oldSaveEmployeeExit(id);if(e&&e.status!==before){if(e.status==='퇴사'){e.exit_date=get('eExitDate')||e.exit_date||today()}else if(before==='퇴사'){e.exit_date=''}save()}};
const oldMassExit=window.applyEmployeeMassEdit;
window.applyEmployeeMassEdit=function(){const choice=document.getElementById('mass_status')?.value;const selected=[...empSelected];const before=new Map(selected.map(id=>[id,db.employees.find(e=>String(e.id)===id)?.status]));oldMassExit();if(choice==='퇴사'||choice==='재직'||choice==='휴직'){let n=0;for(const id of selected){const e=db.employees.find(x=>String(x.id)===id);if(e&&before.get(id)!==e.status){if(e.status==='퇴사')e.exit_date=today();else if(before.get(id)==='퇴사')e.exit_date='';n++}}if(n)save()}};

// Current-calendar-month hires: use registered hire dates, never invent historical employee details.
function currentMonthHires(){
 const month=today().slice(0,7);
 return db.employees.filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(String(e.hire_date||''))&&String(e.hire_date).slice(0,7)===month)
   .sort((a,b)=>dateFirstEmployeeSort(a,b,'hire'));
}

 };
 const priorSaveEmployee=saveEmployee;

  e.employment_type=newType;

 let result=0;

 else if(empSort==='headquarters')result=rank(a.headquarters,HQ_RANK)-rank(b.headquarters,HQ_RANK)||orgCompare(a,b);
 else if(empSort==='age')result=Number(displayAge(a)||0)-Number(displayAge(b)||0);
 else result=natural(a[empSort],b[empSort]);
 return (empDirection==='desc'?-1:1)*result||orgCompare(a,b);
};

// Keep the same Supabase JSON employee objects; only add optional fields.
const oldOpen=openEmployee;
openEmployee=function(id=null,encoded=''){
 oldOpen(id,encoded);
 const grid=document.querySelector('#modalBody .formgrid');if(!grid)return;
 const person=id?db.employees.find(e=>String(e.id)===String(id)):null;
 const wrap=document.createElement('div');wrap.style.cssText='grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px';
 const salary=person?.salary_type||'';wrap.innerHTML=`<label>급여 형태 <select id="eSalaryType"><option value="">미지정</option><option value="월급" ${salary==='월급'?'selected':''}>월급</option><option value="시급" ${salary==='시급'?'selected':''}>시급</option></select></label><label id="hrExitReasonWrap" style="display:none">퇴사사유 <input type="text" id="eExitReason" maxlength="250" placeholder="퇴사사유 입력" value="${esc(person?.exit_reason||'')}"></label>`;
 grid.appendChild(wrap);
 // Keep the exit reason directly next to the exit date in the same date row.
 const dateRow=document.getElementById('employmentStatusDates');
 const reasonField=document.getElementById('hrExitReasonWrap');
 if(dateRow&&reasonField){
  dateRow.appendChild(reasonField);
  dateRow.style.gridTemplateColumns='minmax(170px,220px) minmax(210px,1fr)';
  dateRow.style.alignItems='start';
  const exitDateLabel=document.getElementById('exitDateLabel');
  if(exitDateLabel){exitDateLabel.style.display='flex';exitDateLabel.style.flexDirection='column';exitDateLabel.style.alignItems='stretch';exitDateLabel.style.gap='7px';}
  reasonField.style.display='flex';reasonField.style.flexDirection='column';reasonField.style.gap='7px';
  reasonField.style.minWidth='0';
  const reasonInput=document.getElementById('eExitReason');
  if(reasonInput){reasonInput.style.width='100%';reasonInput.style.maxWidth='100%';}
 }
 const status=document.getElementById('eStatus');
 const update=()=>{
  const isExit=status?.value==='퇴사';
  const isLeave=status?.value==='휴직';
  const exitLabel=document.getElementById('exitDateLabel');
  const leaveLabel=document.getElementById('leaveDateLabel');
  const reasonLabel=document.getElementById('hrExitReasonWrap');
  const row=document.getElementById('employmentStatusDates');
  if(exitLabel)exitLabel.style.display=isExit?'flex':'none';
  if(leaveLabel)leaveLabel.style.display=isLeave?'flex':'none';
  if(reasonLabel)reasonLabel.style.display=isExit?'flex':'none';
  if(row)row.style.display=(isExit||isLeave)?'grid':'none';
 };
 status?.addEventListener('change',update);update();
 for(const id of ['eExitDate','eLeaveDate']){const node=document.getElementById(id);if(node){node.style.width='170px';node.style.maxWidth='100%';const label=node.closest('label');if(label){label.style.maxWidth='220px';label.style.width='auto';}}}
};
const oldSave=saveEmployee;
saveEmployee=function(id){
 const salary=document.getElementById('eSalaryType')?.value||'';const reason=document.getElementById('eExitReason')?.value.trim()||'';
 const existing=id?db.employees.find(e=>String(e.id)===String(id)):null;
 const priorSize=db.employees.length;
 oldSave(id);
 const target=id?db.employees.find(e=>String(e.id)===String(id)):(db.employees.length>priorSize?db.employees.at(-1):null);
 if(!target)return;
 let change=false;
 if(target.salary_type!==salary){target.salary_type=salary;change=true;}
 if(target.status==='퇴사'&&target.exit_reason!==reason){target.exit_reason=reason;change=true;}
 if(change){save();render();}
};
document.addEventListener('change',ev=>{
 if(ev.target.id==='hrOrgCorp'){orgCorp=ev.target.value;render();}
});

})();
</script>
<script>
/* Mentoring & OJT extension. All data is stored in the existing shared JSON document. */
(function(){
 const priorRender=render;
 const safe=v=>esc(String(v??''));
 const idArg=v=>JSON.stringify(String(v)).replace(/"/g,'&quot;');
 const todayLocal=()=>{const x=new Date();return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};
 const getEmployee=id=>(db.employees||[]).find(e=>String(e.id)===String(id));
 const read=id=>document.getElementById(id)?.value||'';
 const stages=[['day3','3일차'],['week1','1주일차'],['month1','1개월차']];
 const nav=document.querySelector('.navs');
 const anchor=nav.querySelector('[data-view="conversion"]')||nav.querySelector('[data-view="employees"]');
 const btn=document.createElement('button');btn.className='nav';btn.dataset.view='ojt';btn.textContent='▤ OJT 계획 및 이수';anchor.insertAdjacentElement('afterend',btn);btn.addEventListener('click',()=>setView('ojt'));
 names.ojt=['OJT 계획 및 이수','부서별 교육계획 및 직원별 이수 완료 여부'];
 const interviewNav=document.createElement('button');
 interviewNav.className='nav';interviewNav.dataset.view='interviews';interviewNav.textContent='▤ 면담기록';
 anchor.insertAdjacentElement('afterend',interviewNav);
 interviewNav.addEventListener('click',()=>setView('interviews'));
 names.interviews=['면담기록','정규직 전환 대상자의 면담기록을 퇴사·전환 이후에도 누적 조회합니다.'];
 let interviewQuery='',interviewCorp='';
 function hasInterview(e){const m=e.mentoring||{};return Boolean(String(e.mentor_name||'').trim()||String(e.mentor_department||'').trim()||String(m.other||'').trim()||stages.some(([k])=>{const a=m[k]||{};return Boolean(a.date||a.by||a.note)}))}
 function interviewView(){
  const list=(db.employees||[]).filter(hasInterview).filter(e=>(!interviewCorp||e.corporation===interviewCorp)&&(!interviewQuery||[e.name,e.employee_no,e.department,e.mentor_name].some(x=>String(x||'').toLocaleLowerCase('ko').includes(interviewQuery.toLocaleLowerCase('ko'))))).sort((a,b)=>{const order=['진합','제이앤드에프','지노스','진우정공'];const n=x=>{const i=order.indexOf(x);return i<0?99:i};return n(a.corporation)-n(b.corporation)||String(a.name||'').localeCompare(String(b.name||''),'ko')});
  const total=(db.employees||[]).filter(hasInterview).length;
  return `<section class="panel"><div class="toolbar"><input id="interviewQuery" placeholder="성명·사번·부서·멘토 검색" value="${safe(interviewQuery)}" style="min-width:230px">${select('interviewCorp',['진합','제이앤드에프','지노스','진우정공'],interviewCorp,'전체 법인')}<button class="btn" onclick="window.resetInterviewFilters()">초기화</button><button class="btn" onclick="downloadExcel('OJT계획이수')">면담·OJT Excel</button></div><div class="summaryline"><b>면담기록 누계 ${fmt(total)}명</b><span class="muted">조회 결과 ${fmt(list.length)}명 · 정규직 전환 및 퇴사 후에도 보존</span></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>부서</th><th>현재 상태</th><th>고용형태</th><th>멘토</th><th>3일차</th><th>1주일차</th><th>1개월차</th><th>기록 확인</th></tr></thead><tbody>${list.map(e=>`<tr><td>${safe(e.employee_no)}</td><td>${safe(e.name)}</td><td>${safe(e.corporation)}</td><td>${safe(e.department)}</td><td>${safe(e.status)}</td><td>${safe(e.employment_type||'미확인')}</td><td>${safe(e.mentor_name||'미지정')}</td>${stages.map(([k])=>`<td>${safe(e.mentoring?.[k]?.date||'미작성')}</td>`).join('')}<td><button class="btn tiny" onclick="window.openInterview(${idArg(e.id)})">열람·수정</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">저장된 면담기록이 없습니다.</td></tr>'}</tbody></table></div></section>`
 }
 window.resetInterviewFilters=function(){interviewQuery='';interviewCorp='';render()};
 document.addEventListener('input',ev=>{if(ev.target.id==='interviewQuery'){interviewQuery=ev.target.value;scheduleSearchRender('interviewQuery');}});
 document.addEventListener('compositionend',ev=>{if(ev.target.id==='interviewQuery'){interviewQuery=ev.target.value;clearTimeout(window.__interviewSearchTimer);window.__interviewSearchTimer=setTimeout(()=>{if(view==='interviews')render()},300)}});
 document.addEventListener('change',ev=>{if(ev.target.id==='interviewCorp'){interviewCorp=ev.target.value;render()}});

 let ojtCorp='전체',ojtDept='전체',ojtEmployee='';
 function orgs(){const pool=[...(db.employees||[]),...(db.plans||[]),...(db.recruitment||[])];for(const r of db.reference_master||[])if(r.type==='department'&&r.active!==false&&r.corporation&&r.headquarters)pool.push({corporation:r.corporation,headquarters:r.headquarters,department:r.value});return [...new Map(pool.filter(x=>x.corporation&&x.department).map(e=>[e.corporation+'|'+(e.headquarters||'')+'|'+e.department,{corporation:e.corporation,headquarters:e.headquarters||'',department:e.department}])).values()].sort((a,b)=>a.corporation.localeCompare(b.corporation,'ko')||a.department.localeCompare(b.department,'ko'))}
 const planList=()=>db.ojt_plans||(db.ojt_plans=[]);
 const outcomeList=()=>db.ojt_outcomes||(db.ojt_outcomes=[]);
 function openInterview(id){const e=getEmployee(id);if(!e)return;const rec=e.mentoring||{};const fields=stages.map(([k,label])=>`<div class="panel" style="margin:10px 0;padding:12px"><b>${label} 면담</b><div class="formgrid" style="margin-top:8px"><label>면담일<input type="date" id="it_${k}_date" value="${safe(rec[k]?.date)}"></label><label>면담 담당<input id="it_${k}_by" value="${safe(rec[k]?.by)}" placeholder="면담 담당자"></label></div><label style="display:block;margin-top:8px">면담 내용<textarea id="it_${k}_note" rows="3" placeholder="면담 내용">${safe(rec[k]?.note)}</textarea></label></div>`).join('');modal(e.name+' · 면담기록지',`<div class="notice">사번 ${safe(e.employee_no)} · ${safe(e.department)} · 입사일 ${safe(e.hire_date)}<br>정규직 전환 후에도 기존 면담기록은 보존됩니다.</div><div class="formgrid"><label>멘토 성명<input id="it_mentor" value="${safe(e.mentor_name)}" placeholder="멘토 이름"></label><label>멘토 부서 / 비고<input id="it_mentor_dept" value="${safe(e.mentor_department)}" placeholder="선택 입력"></label></div>${fields}<label style="display:block">그 외 특이사항<textarea id="it_other" rows="3" placeholder="특이사항">${safe(rec.other)}</textarea></label><div class="modalactions"><button class="btn" onclick="closeModal()">닫기</button><button class="btn primary" onclick="saveInterview(${idArg(id)})">기록 저장</button></div>`)}
 window.openInterview=openInterview;
 window.saveInterview=function(id){const e=getEmployee(id);if(!e)return;e.mentor_name=read('it_mentor').trim();e.mentor_department=read('it_mentor_dept').trim();const record={other:read('it_other')};stages.forEach(([k])=>record[k]={date:read('it_'+k+'_date'),by:read('it_'+k+'_by').trim(),note:read('it_'+k+'_note').trim()});e.mentoring=record;closeModal();commit('면담기록 수정',`${e.employee_no} ${e.name} · 멘토/면담 기록`)};
 function ojtView(){const items=planList();const options=orgs();const corps=[...new Set(options.map(o=>o.corporation))];const deps=[...new Set(options.filter(o=>ojtCorp==='전체'||o.corporation===ojtCorp).map(o=>o.department))];if(ojtDept!=='전체'&&!deps.includes(ojtDept))ojtDept='전체';const filtered=items.filter(o=>(ojtCorp==='전체'||o.corporation===ojtCorp)&&(ojtDept==='전체'||o.department===ojtDept)).slice().sort((a,b)=>String(a.corporation).localeCompare(String(b.corporation),'ko')||String(a.department).localeCompare(String(b.department),'ko')||String(a.schedule||'').localeCompare(String(b.schedule||'')));const emps=(db.employees||[]).filter(e=>e.status!=='퇴사'&&(ojtCorp==='전체'||e.corporation===ojtCorp)&&(ojtDept==='전체'||e.department===ojtDept));const selected=getEmployee(ojtEmployee);const eligible=selected&&emps.some(e=>String(e.id)===String(selected.id));const employeeOptions=emps.map(e=>`<option value="${safe(e.id)}" ${String(e.id)===String(ojtEmployee)?'selected':''}>${safe(e.name)} (${safe(e.employee_no)})</option>`).join('');const rates=eligible?filtered.map(p=>{const o=outcomeList().find(x=>String(x.plan_id)===String(p.id)&&String(x.employee_id)===String(ojtEmployee));return {p,o}}):[];const completed=rates.filter(x=>x.o?.completed).length;
 const rows=filtered.map((p,i)=>`<tr><td>${safe(p.corporation)}</td><td>${safe(p.department)}</td><td>${safe(p.schedule)}</td><td>${safe(p.hours)}</td><td>${safe(p.subject)}</td><td>${safe(p.content)}</td><td>${safe(p.goal)}</td><td>${safe(p.method)}</td><td>${safe(p.instructor)}</td><td>${safe(p.actual_instructor||'')}</td><td>${eligible?`<label style="display:inline-flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" ${rates[i].o?.completed?'checked':''} onchange="setOjtDone(${idArg(p.id)},this.checked)" aria-label="이수 완료">${rates[i].o?.completed?'완료':'미완료'}</label>`:'직원 선택 필요'}</td><td><button class="btn tiny" onclick="editOjtPlan(${idArg(p.id)})">수정</button> <button class="btn tiny" onclick="removeOjtPlan(${idArg(p.id)})">삭제</button></td></tr>`).join('');
 return `<section class="panel"><div class="report-head"><h2>부서별 OJT 교육계획 및 이수 현황</h2><div><button class="btn" onclick="downloadExcel('OJT계획이수')">Excel</button> <button class="btn primary" onclick="editOjtPlan()">계획 행 추가</button></div></div><div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><label>법인<select id="ojtCorp" onchange="setOjtFilter('corp',this.value)"><option value="전체">전체</option>${corps.map(x=>`<option ${ojtCorp===x?'selected':''}>${safe(x)}</option>`).join('')}</select></label><label>부서<select id="ojtDept" onchange="setOjtFilter('dept',this.value)"><option value="전체">전체</option>${deps.map(x=>`<option ${ojtDept===x?'selected':''}>${safe(x)}</option>`).join('')}</select></label><label>이수 확인 대상 직원<select id="ojtEmployee" onchange="setOjtFilter('employee',this.value)"><option value="">직원 선택 (계획만 보기)</option>${employeeOptions}</select></label></div><div class="notice">교육계획은 부서별로 공유하며, 이수 여부는 <b>직원별 완료·미완료</b>로 저장됩니다. 먼저 대상 직원을 선택하세요.</div>${eligible?`<p><b>${safe(selected.name)}</b> · 이수 ${completed} / ${filtered.length}건</p>`:''}<div class="tablewrap"><table><thead><tr><th>법인</th><th>부서</th><th>일정</th><th>시간</th><th>교육항목</th><th>세부 교육내용</th><th>교육목표</th><th>교육 방법</th><th>담당</th><th>실제 교육담당자</th><th>이수 여부 (완료/미완료)</th><th>관리 (계획 수정·삭제)</th></tr></thead><tbody>${rows||'<tr><td colspan="12" class="empty">등록된 OJT 계획이 없습니다.</td></tr>'}</tbody></table></div></section>`}
 window.setOjtFilter=function(kind,v){if(kind==='corp'){ojtCorp=v;ojtDept='전체';ojtEmployee=''}else if(kind==='dept'){ojtDept=v;ojtEmployee=''}else ojtEmployee=v;render()};
 window.editOjtPlan=function(id){
  const p=planList().find(x=>String(x.id)===String(id))||{};
  const opts=orgs().map(o=>{const val=[o.corporation,o.headquarters,o.department].join('|');return `<option value="${safe(val)}" ${p.corporation===o.corporation&&p.department===o.department&&p.headquarters===o.headquarters?'selected':''}>${safe(o.corporation)} / ${safe(o.headquarters)} / ${safe(o.department)}</option>`}).join('');
  modal(id?'OJT 계획 수정':'OJT 계획 추가',`<div class="ojt-plan-form"><label class="ojt-field ojt-org">대상 조직<select id="op_org"><option value="">조직 선택</option>${opts}</select></label><div class="ojt-basic-grid"><label class="ojt-field">일정<input id="op_schedule" value="${safe(p.schedule)}" placeholder="예: 입사 1일차 / 2026-11-02"></label><label class="ojt-field">시간<input id="op_hours" value="${safe(p.hours)}" placeholder="예: 2시간"></label><label class="ojt-field">교육항목<input id="op_subject" value="${safe(p.subject)}" placeholder="교육항목 입력"></label><label class="ojt-field">교육 방법<input id="op_method" value="${safe(p.method)}" placeholder="예: 이론·실습"></label><label class="ojt-field">담당<input id="op_instructor" value="${safe(p.instructor)}" placeholder="교육 담당자"></label><label class="ojt-field">실제 교육담당자<input id="op_actual_instructor" value="${safe(p.actual_instructor)}" placeholder="실제 교육담당자 입력"></label></div><label class="ojt-field">세부 교육내용<textarea id="op_content" rows="4" placeholder="세부 교육내용을 입력하세요">${safe(p.content)}</textarea></label><label class="ojt-field">교육목표<textarea id="op_goal" rows="3" placeholder="교육목표를 입력하세요">${safe(p.goal)}</textarea></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveOjtPlan(${idArg(id||'')})">저장</button></div>`);
 };
 window.saveOjtPlan=function(id){
  try{
   const org=read('op_org').split('|');
   if(org.length!==3||!org[0].trim()||!org[2].trim()||!read('op_subject').trim()){alert('대상 조직과 교육항목을 입력하세요.');return}
   const data={corporation:org[0],headquarters:org[1],department:org[2],schedule:read('op_schedule').trim(),hours:read('op_hours').trim(),subject:read('op_subject').trim(),content:read('op_content').trim(),goal:read('op_goal').trim(),method:read('op_method').trim(),instructor:read('op_instructor').trim(),actual_instructor:read('op_actual_instructor').trim()};
   const p=planList().find(x=>String(x.id)===String(id));
   if(typeof session!=='undefined'&&!session){alert('로그인 후 저장할 수 있습니다.');return}
   if(p)Object.assign(p,data);else planList().push({id:uid(),...data});
   closeModal();commit('OJT 계획 '+(p?'수정':'등록'),data.department+' · '+data.subject);
  }catch(err){console.error('OJT 계획 저장 오류',err);alert('OJT 저장 처리 중 오류가 발생했습니다: '+err.message)}
 };
 window.removeOjtPlan=function(id){const p=planList().find(x=>String(x.id)===String(id));if(!p||!confirm('OJT 계획과 해당 항목의 직원별 이수기록을 모두 삭제하시겠습니까?'))return;db.ojt_plans=planList().filter(x=>String(x.id)!==String(id));db.ojt_outcomes=outcomeList().filter(x=>String(x.plan_id)!==String(id));commit('OJT 계획 삭제',p.department+' · '+p.subject)};
 window.setOjtDone=function(id,checked){if(!ojtEmployee){alert('대상 직원을 선택하세요.');return}let o=outcomeList().find(x=>String(x.plan_id)===String(id)&&String(x.employee_id)===String(ojtEmployee));if(!o){o={id:uid(),plan_id:id,employee_id:ojtEmployee,note:''};outcomeList().push(o)}o.completed=checked;o.completed_date=checked?todayLocal():'';commit('OJT 이수 변경',getEmployee(ojtEmployee)?.name+' / '+id+' / '+(checked?'완료':'미이수'))};
 window.editOjtNote=function(id){if(!ojtEmployee)return;const o=outcomeList().find(x=>String(x.plan_id)===String(id)&&String(x.employee_id)===String(ojtEmployee));modal('직원별 OJT 특이사항',`<label>특이사항<textarea id="on_note" rows="5">${safe(o?.note)}</textarea></label><div class="modalactions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveOjtNote(${idArg(id)})">저장</button></div>`)};
 window.saveOjtNote=function(id){let o=outcomeList().find(x=>String(x.plan_id)===String(id)&&String(x.employee_id)===String(ojtEmployee));if(!o){o={id:uid(),plan_id:id,employee_id:ojtEmployee,completed:false};outcomeList().push(o)}o.note=read('on_note').trim();closeModal();commit('OJT 특이사항 수정',getEmployee(ojtEmployee)?.name+' / '+id)};

<script>
/* Parental leave period is separate from general leave and exit dates. */
(function(){
 const previousOpen=openEmployee;

   previousOpen(id,encoded);
   const status=document.getElementById('eStatus');
   const dateRow=document.getElementById('employmentStatusDates');

   if(!parental){
     parental=document.createElement('div');
     parental.id='parentalLeavePeriod';
     parental.style.cssText='grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;min-width:0';
     parental.innerHTML='<label style="display:flex;flex-direction:column;gap:6px;min-width:0"><span><span style="color:#c2410c">* </span>육아휴직 시작일</span><input type="date" id="eParentalStart" style="width:100%;min-width:0;box-sizing:border-box" /></label><label style="display:flex;flex-direction:column;gap:6px;min-width:0"><span><span style="color:#c2410c">* </span>육아휴직 종료일</span><input type="date" id="eParentalEnd" style="width:100%;min-width:0;box-sizing:border-box" /></label>';
     dateRow.insertAdjacentElement('afterend',parental);
   }
   const person=id?(db.employees||[]).find(x=>String(x.id)===String(id)):null;
   document.getElementById('eParentalStart').value=person?.parental_leave_start_date||'';
   document.getElementById('eParentalEnd').value=person?.parental_leave_end_date||'';
   function showPeriod(){
     const isParental=status.value==='육아휴직';
     parental.style.display=isParental?'grid':'none';
     if(isParental)dateRow.style.display='none';
   }
   status.addEventListener('change',showPeriod);
   showPeriod();
 };
 const previousSave=saveEmployee;
 saveEmployee=function(id){
   const st=document.getElementById('eStatus')?.value;
   if(st!=='육아휴직')return previousSave(id);
   const start=document.getElementById('eParentalStart')?.value||'';
   const end=document.getElementById('eParentalEnd')?.value||'';
   if(!start||!end){alert('육아휴직 시작일과 종료일을 모두 선택해 주세요.');return;}
   if(start>end){alert('육아휴직 종료일은 시작일 이후여야 합니다.');return;}
   const beforeCount=(db.employees||[]).length;
   const old=id?(db.employees||[]).find(x=>String(x.id)===String(id)):null;
   const oldStart=old?.parental_leave_start_date||'';
   const oldEnd=old?.parental_leave_end_date||'';

   target.parental_leave_start_date=start;
   target.parental_leave_end_date=end;

     if(Array.isArray(db.history))db.history.unshift({employee_id:target.id,event_date:start,event_type:'상태변경',title:'육아휴직 기간 '+(oldStart||oldEnd?'변경':'등록'),description:start+' ~ '+end,department:target.department,grade:target.grade});
     save();render();
   }
 };
})();

<script>

(function(){

 const extra = [{corporation:'지노스',headquarters:'표면처리사업부',department:'(표면)연구개발팀'},

 const corpOrder=['진합','제이앤드에프','지노스','진우정공'];
 const hqOrder=['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'];
 const sortBy=(values,order)=>[...new Set(values.filter(Boolean))].sort((a,b)=>{
   const ia=order.indexOf(a),ib=order.indexOf(b);
   return (ia<0?999:ia)-(ib<0?999:ib)||String(a).localeCompare(String(b),'ko');
 });
 function orgRows(){
   const rows=[...(db.employees||[]),...(db.plans||[]),...(db.recruitment||[]),...extra];

   return rows.filter(r=>r&&r.corporation&&r.headquarters&&r.department);
 }
 function listCorps(){return sortBy([...orgRows().map(x=>x.corporation),...(window.__hrMasterCandidates?.('corporation')||[])],corpOrder)}

 function listDept(c,h){return sortBy([...orgRows().filter(x=>x.corporation===c&&x.headquarters===h).map(x=>x.department),...(window.__hrMasterCandidates?.('department',c,h)||[])],[])}
 function populate(el,choices,value,placeholder){
   el.replaceChildren();
   const opt=document.createElement('option');opt.value='';opt.textContent=placeholder;el.append(opt);
   for(const choice of choices){const item=document.createElement('option');item.value=choice;item.textContent=choice;el.append(item)}

 }
 function linked(c,h,d,settings={}){
   if(!c||!h||!d)return;
   const original={c:c.value,h:h.value,d:d.value};
   for(const el of [c,h,d]){
     // datalist free text is replaced with exact organization selectors in recruitment only.
     if(settings.convert && el.tagName==='INPUT'){
       const replacement=document.createElement('select');replacement.id=el.id;
       replacement.className=el.className;

       el.replaceWith(replacement);
       if(el===c)c=replacement;else if(el===h)h=replacement;else d=replacement;
     }
   }
   const corp=()=>c.value;
   const head=()=>h.value;
   function updateHQ(reset){populate(h,listHq(corp()),reset?'':original.h,'본부/실 선택');updateDept(reset)}

   populate(c,listCorps(),original.c,'법인 선택');
   updateHQ(false);
   c.addEventListener('change',()=>{original.h='';original.d='';updateHQ(true)});
   h.addEventListener('change',()=>{original.d='';updateDept(true)});
   return {valid:()=>!!corp()&&listHq(corp()).includes(head())&&listDept(corp(),head()).includes(d.value)};
 }

 }
 const originalSave=window.saveRecruitment;
 if(typeof originalSave==='function'){

     }
     return originalSave(...args);
   };
 }
 // Other linked filters should follow the same corporation -> organizational hierarchy.
 // Existing employee and bulk transfer filters already scope their options by corporation.
 window.__hrOrgOptions={corporations:listCorps,headquarters:listHq,departments:listDept};
})();
</script>

<script>

(function(){
 const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''));

 function overduePanel(){const items=overdue();if(!items.length)return '';return `<section class="panel" style="border:2px solid #d97706"><h2>자동 퇴사 미반영 · ${items.length}명</h2><p class="hint">퇴사 예정일이 지났지만 직원 상태가 아직 변경되지 않았습니다. 서버 예약 작업을 확인하세요. 아래 버튼으로 해당 직원의 퇴사 상태를 확정할 수 있습니다.</p><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>부서</th><th>퇴사 예정일</th><th>처리</th></tr></thead><tbody>${items.map(e=>`<tr><td>${esc(e.employee_no)}</td><td>${esc(e.name)}</td><td>${esc(e.department)}</td><td>${esc(e.scheduled_exit_date)}</td><td><button type="button" class="btn tiny primary" data-exit-reconcile="${esc(String(e.id))}">퇴사 확정</button></td></tr>`).join('')}</tbody></table></div></section>`;}

 }
 render=function(){prevRender();if(view==='exits'&&window.__hrCloudConnected?.()){const root=document.getElementById('content');if(root){root.insertAdjacentHTML('afterbegin',overduePanel()+pendingPanel());}}};
 function selector(){
  const people=(db.employees||[]).filter(e=>e.status!=='퇴사').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  modal('퇴사 예정자 등록',`<div class="formgrid"><label class="wide">대상 직원 검색 (성명 또는 사번)<input type="search" id="scheduledEmployeeSearch" autocomplete="off" placeholder="성명 또는 사번을 입력하세요" aria-controls="scheduledEmployeeResults"></label><input type="hidden" id="scheduledEmployee" value=""><div class="wide" id="scheduledEmployeeSelected" style="color:#475569;font-size:13px">선택된 직원이 없습니다.</div><div class="wide" id="scheduledEmployeeResults" role="listbox" style="max-height:250px;overflow-y:auto;border:1px solid #cbd5e1;border-radius:9px;padding:4px"></div></div><p class="hint">검색 결과에서 직원을 선택하세요. 이후 정보 수정 화면에서 퇴사 예정일을 입력할 수 있습니다.</p><div class="modalactions"><button type="button" class="btn" id="scheduledCreateNew">신규 직원 먼저 등록</button><button type="button" class="btn" onclick="closeModal()">취소</button><button type="button" class="btn primary" id="scheduledNext">다음</button></div>`);

  function showResults(){

   const found=people.filter(e=>String(e.name||'').toLocaleLowerCase('ko').includes(query)||String(e.employee_no||'').toLowerCase().includes(query)).slice(0,20);
   result.replaceChildren();
   for(const e of found){
    const btn=document.createElement('button');btn.type='button';btn.setAttribute('role','option');
    btn.style.cssText='display:block;width:100%;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid #e2e8f0;background:transparent;cursor:pointer;color:#0f172a';
    btn.textContent=caption(e);btn.addEventListener('click',()=>{hidden.value=String(e.id);selected.textContent='선택 직원: '+caption(e);search.value=String(e.name||'');result.replaceChildren();});result.appendChild(btn);
   }
   if(!found.length){const msg=document.createElement('div');msg.textContent='검색 결과가 없습니다.';msg.style.padding='10px';result.appendChild(msg);}
  }
  search.addEventListener('input',()=>{hidden.value='';selected.textContent='선택된 직원이 없습니다.';if(!search.isComposing)showResults();});
  search.addEventListener('compositionend',showResults);
  search.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();const first=result.querySelector('button');if(first)first.click();}});
  showResults();search.focus();
  document.getElementById('scheduledNext').onclick=()=>{const id=hidden.value;if(!id){alert('검색 결과에서 퇴사 예정 직원을 선택하세요.');search.focus();return;}scheduleEditor(id)};
  document.getElementById('scheduledCreateNew').onclick=()=>{closeModal();openEmployee();alert('신규 직원 저장 후 퇴사자 명단에서 [퇴사 예정 등록]을 다시 선택해 주세요.');};
 }
 function scheduleEditor(id){const e=(db.employees||[]).find(x=>String(x.id)===String(id));if(!e)return alert('직원을 찾지 못했습니다.');openEmployee(e.id);const content=document.querySelector('#modalBody .formgrid');if(!content)return;const section=document.createElement('div');section.style.cssText='grid-column:1/-1;border:1px solid #cbd5e1;border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px';section.innerHTML=`<label>퇴사 예정일 *<input id="scheduledExitDate" type="date" value="${esc(e.scheduled_exit_date||'')}" min="${localDay()}" required></label><label>퇴사사유<input id="scheduledExitReason" type="text" value="${esc(e.scheduled_exit_reason||e.exit_reason||'')}" placeholder="퇴사사유 입력"></label><div class="hint" style="grid-column:1/-1">퇴사 예정일 당일에는 재직 상태를 유지하고, 다음 날 자동으로 퇴사 처리합니다.</div>`;content.appendChild(section);
  const st=document.getElementById('eStatus');if(st){st.value=e.status;st.disabled=true;}
  window.__scheduledEditingId=String(e.id);
 }
 const prevSave=saveEmployee;
 saveEmployee=function(id){const scheduled=document.getElementById('scheduledExitDate');if(!scheduled)return prevSave(id);
  const date=scheduled.value,reason=document.getElementById('scheduledExitReason')?.value.trim()||'';
  if(!validDate(date)||date<localDay()){alert('오늘 이후의 퇴사 예정일을 입력하세요.');scheduled.focus();return;}
  const e=(db.employees||[]).find(x=>String(x.id)===String(id));if(!e)return alert('기존 직원을 선택해 주세요.');
  const n=document.getElementById('eNo')?.value.trim();if(!n||!document.getElementById('eName')?.value.trim()){alert('사번과 성명을 확인하세요.');return;}
  // Save schedule along with normal employee fields, using the current shared DB data structure.
  const oldDate=e.scheduled_exit_date||'';const oldReason=e.scheduled_exit_reason||'';
  e.scheduled_exit_date=date;e.scheduled_exit_reason=reason;
  const event=db.history||[];
  if(oldDate!==date||oldReason!==reason)event.unshift({employee_id:e.id,event_date:localDay(),event_type:'퇴사예정',title:'퇴사 예정 '+(oldDate?'변경':'등록'),description:`${date} / ${reason||'사유 미입력'}`,department:e.department,grade:e.grade});
  const oldModal=document.getElementById('modalWrap')?.classList.contains('open');
  prevSave(id);
  // Earlier employee-save layers may produce their own asynchronous shared saves.
  // Make the scheduled values explicit in a final synced revision.
  if(oldModal&&!document.getElementById('modalWrap')?.classList.contains('open')){save();render();}
 };
 document.addEventListener('click',ev=>{const reconcile=ev.target.closest('[data-exit-reconcile]');if(reconcile){if(!window.__hrCloudConnected?.()){alert('공동 데이터에 로그인한 후 처리해 주세요.');return;}const e=(db.employees||[]).find(x=>String(x.id)===reconcile.dataset.exitReconcile);if(!e||e.status==='퇴사'||!validDate(e.scheduled_exit_date)||e.scheduled_exit_date>=localDay())return;const day=e.scheduled_exit_date;if(!confirm(`${e.name}님의 퇴사일 ${day}을(를) 확인하고 퇴사 상태로 확정하시겠습니까?`))return;e.exit_date=day;e.exit_reason=e.scheduled_exit_reason||e.exit_reason||'';e.status='퇴사';db.history??=[];db.history.unshift({employee_id:e.id,event_date:day,event_type:'퇴사',title:'퇴사',description:e.exit_reason||'퇴사 예정 자동처리 미반영 복구',department:e.department,grade:e.grade});commit('기한 경과 퇴사 확정',`${e.employee_no||''} / ${day}`);return;}const add=ev.target.closest('#newExitSchedule');if(add){selector();return;}
  const edit=ev.target.closest('[data-schedule-edit]');if(edit){scheduleEditor(edit.dataset.scheduleEdit);return;}
  const cancel=ev.target.closest('[data-schedule-cancel]');if(cancel){const e=(db.employees||[]).find(x=>String(x.id)===cancel.dataset.scheduleCancel);if(!e)return;if(!confirm(`${e.name}님의 퇴사 예정 등록을 취소하시겠습니까?`))return;delete e.scheduled_exit_date;delete e.scheduled_exit_reason;commit('퇴사 예정 취소',e.employee_no+' '+e.name);}
 });

<script>
/* Shared reference information. Stored inside hr_shared_state.data.reference_master. */
(function(){
'use strict';
const TYPES={corporation:'법인',headquarters:'본부 / 실',department:'부서 / 팀',position:'직위',grade:'직급',education:'학력',field_leader_role:'현장관리자 구분',salary_type:'급여 형태',employment_type:'고용형태'};
const BASE={corporation:['진합','제이앤드에프','지노스','진우정공'],headquarters:['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'],position:[],grade:[],education:[],field_leader_role:['미지정','그룹장','파트장','라인장'],salary_type:['월급','시급'],employment_type:['정규직','계약직']};
const coll=()=>[...(db.employees||[]),...(db.plans||[]),...(db.recruitment||[])];
const key=r=>[r.type,r.value,r.corporation||'',r.headquarters||''].join('\u001f');
const record=(type,value,corporation='',headquarters='',active=true)=>({type,value,corporation,headquarters,active});
function derived(){const out=[];for(const [type,vals] of Object.entries(BASE)){for(const v of vals)out.push(record(type,v));}for(const x of coll()){
 for(const type of Object.keys(TYPES)){const v=String(x[type]||'').trim();if(!v)continue;out.push(record(type,v,type==='headquarters'||type==='department'?x.corporation||'':'',type==='department'?x.headquarters||'':''));}
}return out;}
function rows(){const actual=Array.isArray(db.reference_master)?db.reference_master:[];const combined=new Map();for(const x of derived())if(!combined.has(key(x)))combined.set(key(x),x);for(const x of actual){const k=key(x);combined.set(k,x);}return [...combined.values()].filter(x=>x.deleted!==true);}
function master(){if(!Array.isArray(db.reference_master))db.reference_master=[];return db.reference_master;}
function candidates(type,corporation='',headquarters=''){const list=rows().filter(x=>x.type===type&&x.active!==false&&(!corporation||!['headquarters','department'].includes(type)||!x.corporation||x.corporation===corporation)&&(!headquarters||type!=='department'||!x.headquarters||x.headquarters===headquarters)).map(x=>x.value);return [...new Set(list)].sort((a,b)=>a.localeCompare(b,'ko'));}
function effectiveReferenceValue(x,type,bucket){const raw=String(x[type]??'').trim();if(raw)return raw;return bucket==='employees'&&type==='field_leader_role'?'미지정':raw;}
function usageMatches(r,x,bucket=''){return effectiveReferenceValue(x,r.type,bucket)===r.value&&(!r.corporation||x.corporation===r.corporation)&&(!r.headquarters||x.headquarters===r.headquarters);}
function usageDetails(r){return ['employees','plans','recruitment'].flatMap(bucket=>(db[bucket]||[]).filter(x=>usageMatches(r,x,bucket)).map(x=>({bucket,item:x})));}
function actualUses(r){return usageDetails(r).length;}
function showMasterUsage(r){
 const details=usageDetails(r),groups=[['employees','직원 인사정보'],['plans','정원관리'],['recruitment','채용진행관리']];
 const cells=(...values)=>values.map(v=>`<td>${esc(String(v??'-'))}</td>`).join('');
 const sections=groups.map(([bucket,label])=>{
  const found=details.filter(d=>d.bucket===bucket).map(d=>d.item);
  if(!found.length)return '';
  const heading=bucket==='employees'?'<th>사번</th><th>성명</th><th>소속</th><th>상태</th>':bucket==='plans'?'<th>연도</th><th>법인</th><th>본부 / 부서</th><th>계획</th>':'<th>접수일</th><th>대상자</th><th>소속</th><th>진행 단계</th>';
  const lines=found.map(x=>{
   if(bucket==='employees')return `<tr>${cells(x.employee_no,x.name,[x.corporation,x.headquarters,x.department].filter(Boolean).join(' / '),x.status)}</tr>`;
   if(bucket==='plans')return `<tr>${cells(x.year,x.corporation,[x.headquarters,x.department].filter(Boolean).join(' / '),x.target??'-')}</tr>`;
   return `<tr>${cells(x.date,x.name||'미정',[x.corporation,x.headquarters,x.department].filter(Boolean).join(' / '),x.stage)}</tr>`;
  }).join('');
  return `<section style="margin-top:18px"><h3 style="margin:0 0 8px">${label} · ${found.length}건</h3><div class="tablewrap" style="max-height:300px;overflow:auto"><table><thead><tr>${heading}</tr></thead><tbody>${lines}</tbody></table></div></section>`;
 }).join('');
 modal('기준정보 사용 내역',`<div class="notice"><b>${esc(TYPES[r.type])}: ${esc(r.value)}</b><div class="hint">법인: ${esc(r.corporation||'전체')} / 본부: ${esc(r.headquarters||'전체')}</div>현재 직원·정원·채용 자료 합계 <b>${details.length}건</b>에서 사용 중입니다. 과거 월말 확정 기록과 과거 변경 기록은 사용 건수에 포함하지 않습니다.</div>${sections||'<div class="empty" style="padding:28px 0">현재 사용 중인 자료가 없습니다.</div>'}<div class="modalactions"><button class="btn primary" id="masterUsageClose">닫기</button></div>`);
 document.getElementById('masterUsageClose').onclick=closeModal;
}
// A reference rename is an organizational label correction, not a personnel transfer.
// Preserve historical monthly snapshots and dated individual personnel events.
function renameReferences(before,after){
 const counts={employees:0,plans:0,recruitment:0,reference_master:0};
 const sameScope=x=> (!before.corporation||x.corporation===before.corporation)&&(!before.headquarters||x.headquarters===before.headquarters);
 for(const bucket of ['employees','plans','recruitment'])for(const x of (db[bucket]||[])){
   if(!usageMatches(before,x,bucket)||!sameScope(x))continue;
   x[before.type]=after.value;counts[bucket]++;
 }
 // Cascade parent names to dependent reference entries, in matching company scope.
 for(const x of master()){
   if(x.deleted===true)continue;
   if(before.type==='corporation'&&['headquarters','department'].includes(x.type)&&x.corporation===before.value){x.corporation=after.value;counts.reference_master++;}
   if(before.type==='headquarters'&&x.type==='department'&&x.headquarters===before.value&&(!before.corporation||x.corporation===before.corporation)){x.headquarters=after.value;counts.reference_master++;}
 }
 return counts;
}

let filterType='department',filterText='';

function editor(source=null){const type=source?.type||filterType;const corp=source?.corporation||'',hq=source?.headquarters||'';modal(source?'기준정보 수정':'기준정보 추가',`<div class="formgrid"><label>관리 항목<select id="miType" ${source?'disabled':''}>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>명칭 *<input id="miName" value="${esc(source?.value||'')}" maxlength="100" placeholder="명칭 입력"></label><label id="miCorpLabel">소속 법인<select id="miCorp"><option value="">전체 / 미지정</option>${candidates('corporation').map(x=>`<option ${x===corp?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label id="miHqLabel">소속 본부 / 실<select id="miHQ"><option value="">전체 / 미지정</option>${candidates('headquarters',corp).map(x=>`<option ${x===hq?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="hint" style="margin-top:12px">부서/팀은 법인과 본부/실을 선택하는 것이 좋습니다. 동일 명칭의 조직이 여러 법인에 있을 경우 구별할 수 있습니다.</div><div class="modalactions"><button class="btn" id="miCancel">취소</button><button class="btn primary" id="miSave">저장</button></div>`);
 const typeEl=document.getElementById('miType'),corpEl=document.getElementById('miCorp'),hqEl=document.getElementById('miHQ');function adjust(){const t=typeEl.value;document.getElementById('miCorpLabel').style.display=['department','headquarters'].includes(t)?'flex':'none';document.getElementById('miHqLabel').style.display=t==='department'?'flex':'none';}typeEl.onchange=adjust;corpEl.onchange=()=>{const vals=candidates('headquarters',corpEl.value);hqEl.innerHTML='<option value="">전체 / 미지정</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join('');};adjust();

 closeModal();commit('기준정보 수정',`${TYPES[t]} / ${source.value} → ${v} (직원 ${counts.employees}건, 정원 ${counts.plans}건, 채용 ${counts.recruitment}건)`);
 if(changed)alert(`기준정보 명칭 변경을 요청했습니다.\n직원 ${counts.employees}명 / 정원 ${counts.plans}건 / 채용 ${counts.recruitment}건이 현재 화면 자료에 반영되었습니다.\n\n상단 [공동 DB 저장 완료] 표시를 확인한 뒤 [공유 데이터 다시 불러오기]로 서버 반영 여부를 검증하세요.`);
 }else{master().push(next);closeModal();commit('기준정보 추가',`${TYPES[t]} / ${v}`);}};
}

 ));
 if(dependents.length){alert(`이 항목을 참조하는 하위 기준정보가 ${dependents.length}개 있어 삭제할 수 없습니다. 하위 항목을 먼저 정리하세요.`);return;}
 if(!confirm(`[${TYPES[r.type]}] ${r.value} 항목을 삭제하시겠습니까?\n삭제 후에도 기존 직원 및 과거 이력은 유지됩니다.`))return;
 // Tombstone: prevents entries derived from defaults or old records from reappearing.
 const arr=master(),deleted={...r,deleted:true,active:false},k=key(r);
 // Consolidate duplicates: a later active copy must never resurrect a deleted item.
 for(let i=arr.length-1;i>=0;i--)if(key(arr[i])===k)arr.splice(i,1);
 arr.push(deleted);
 commit('기준정보 삭제',`${TYPES[r.type]} / ${r.value}`);return;
 }const toggle=e.target.closest('[data-master-toggle]');if(toggle){if(!window.__hrCloudConnected?.()){alert('공유 데이터 로그인 후 변경하세요.');return;}const r=visible()[Number(toggle.dataset.masterToggle)];if(!r)return;const use=actualUses(r);if(r.active!==false&&use>0&&!confirm(`현재 ${use}건에서 사용 중입니다. 기존 자료는 유지하고 신규 입력 후보에서만 제외할까요?`))return;const arr=master(),item=arr.find(x=>key(x)===key(r));if(item)item.active=r.active===false;else arr.push({...r,active:false});commit('기준정보 상태변경',`${TYPES[r.type]} / ${r.value}`);}});

<script>
/* DOB bulk import: validate and preview before committing to shared data. */
(function(){
 const previous=employeesView;
 let staged=[];
 const normalizeNo=v=>String(v??'').trim().replace(/\.0$/,'');
 const normalizeName=v=>String(v??'').replace(/\s/g,'').trim();
 const message=(txt,kind='')=>{
  const el=document.getElementById('dobBulkStatus');
  if(el){el.textContent=txt;el.style.color=kind==='error'?'#a32626':'#40516a';}
 };
 employeesView=function(){
  const html=previous();
  const bar=`<section class="panel" style="padding:14px 20px;margin-bottom:12px"><div class="toolbar" style="margin:0;gap:10px;flex-wrap:wrap"><button class="btn" type="button" id="dobBulkButton" onclick="window.hrDobPick()">생년월일 일괄 반영</button><input type="file" id="dobBulkFile" accept=".tsv,.txt,text/tab-separated-values,text/plain" style="display:none" onchange="window.hrDobSelect(this)"><button type="button" class="btn primary" id="dobBulkApply" onclick="window.hrDobApply()" style="display:none">검증 결과 반영</button><span class="hint">사번·성명이 모두 일치하는 직원만 변경 · 주민등록번호 전체를 가져오지 않음</span></div><div id="dobBulkStatus" role="status" aria-live="polite" style="padding-top:8px;white-space:pre-line;font-size:13px">TSV 파일을 선택하면 일치 건수와 오류 여부를 이곳에 표시합니다.</div></section>`;
  return bar+html;
 };
 window.hrDobPick=()=>{
  staged=[];
  const input=document.getElementById('dobBulkFile');
  const apply=document.getElementById('dobBulkApply');if(apply)apply.style.display='none';
  if(!input){alert('가져오기 화면을 찾지 못했습니다. 새로고침 후 다시 시도하세요.');return;}
  message('파일 선택창을 여는 중입니다. TSV 파일을 선택하세요.');input.value='';input.click();
 };
 const readText=async file=>{
  if(typeof file.text==='function')return file.text();
  return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('파일 읽기 실패'));r.readAsText(file,'UTF-8');});
 };
 window.hrDobSelect=async input=>{
  staged=[];
  const apply=document.getElementById('dobBulkApply');if(apply)apply.style.display='none';
  const file=input?.files?.[0];if(!file){message('파일 선택이 취소되었습니다.');return;}
  message(`선택한 파일: ${file.name}\n파일을 읽고 사번·성명 일치 여부를 검사 중입니다.`);
  try{
   if(!Array.isArray(db.employees))throw Error('직원 목록을 불러오지 못했습니다. 공유 데이터 연결을 확인하세요.');
   const content=(await readText(file)).replace(/^\uFEFF/,'');
   const lines=content.split(/\r?\n/).filter(l=>l.trim());
   const hdr=(lines.shift()||'').split('\t').map(x=>x.trim());
   if(hdr[0]!=='사번'||hdr[1]!=='성명'||hdr[2]!=='생년월일')throw Error('TSV 파일의 첫 줄은 사번, 성명, 생년월일 순서여야 합니다. 엑셀(xlsx)이 아닌 제공된 TSV 파일을 선택하세요.');
   const lookup=new Map();
   for(const person of db.employees){const key=normalizeNo(person.employee_no)+'|'+normalizeName(person.name);if(!lookup.has(key))lookup.set(key,[]);lookup.get(key).push(person);}
   const seen=new Set(),counts={changed:0,identical:0,unmatched:0,ambiguous:0,invalid:0};
   for(const line of lines){
    const [no,name,dateRaw]=line.split('\t');const date=String(dateRaw||'').trim();const key=normalizeNo(no)+'|'+normalizeName(name);
    if(seen.has(key)){counts.ambiguous++;continue;}seen.add(key);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){counts.invalid++;continue;}
    const d=new Date(date+'T00:00:00Z');if(isNaN(+d)||d.toISOString().slice(0,10)!==date){counts.invalid++;continue;}
    const found=lookup.get(key)||[];
    if(!found.length){counts.unmatched++;continue;}
    if(found.length!==1){counts.ambiguous++;continue;}
    if(found[0].birth_date===date){counts.identical++;continue;}
    staged.push({id:found[0].id,employee_no:found[0].employee_no,name:found[0].name,date});counts.changed++;
   }
   const result=`파일: ${file.name} (${lines.length}건)\n반영 대상 ${counts.changed}명 · 이미 동일 ${counts.identical}명 · 명단에 없음 ${counts.unmatched}명 · 중복 ${counts.ambiguous}명 · 날짜 오류 ${counts.invalid}명`;
   message(result+(staged.length?'\n검증 결과 반영 버튼을 누르면 공동 DB에 저장을 요청합니다.':'\n변경할 직원이 없습니다.'));
   if(staged.length&&apply)apply.style.display='inline-block';
  }catch(err){staged=[];message('파일 검증 오류: '+(err?.message||String(err)),'error');alert('생년월일 파일을 읽지 못했습니다.\n'+(err?.message||String(err)));}
  finally{if(input)input.value='';}
 };
 window.hrDobApply=()=>{

<script>
/* 생년월일 기반 만 나이 자동 계산 (기존 연령은 생년월일이 없는 직원에게만 사용) */
(function(){
 function calcAge(birth){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(birth||'')))return null;
  const [y,m,d]=birth.split('-').map(Number);
  const dob=new Date(y,m-1,d);
  if(dob.getFullYear()!==y||dob.getMonth()!==m-1||dob.getDate()!==d)return null;
  const now=new Date();
  let age=now.getFullYear()-y;
  if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d))age--;
  return age>=0&&age<=125?age:null;
 }
 const previousDisplayAge=displayAge;
 displayAge=function(employee){
  const age=calcAge(employeeBirthDate(employee));
  return age===null?previousDisplayAge(employee):age;
 };
 function syncAge(){
  const birth=document.getElementById('eBirth');
  const age=document.getElementById('eAge');
  if(!birth||!age)return;
  const computed=calcAge(birth.value);
  if(computed!==null){age.value=String(computed);age.readOnly=true;age.title='생년월일을 기준으로 자동 계산된 만 나이';}
  else{age.readOnly=false;age.title='생년월일이 없는 경우 직접 입력할 수 있습니다.';}
 }
 const previousOpenEmployee=openEmployee;
 openEmployee=function(...args){
  const result=previousOpenEmployee(...args);
  syncAge();
  const hint=document.querySelector('#modalBody .hint');
  if(hint)hint.innerHTML=hint.innerHTML.replace(/연령은 입력한 해를 기준으로 매년 1월 1일 \+1세 표시됩니다\. 생일 기준 만 나이는 아닙니다\./g,'생년월일이 있으면 오늘 날짜 기준 만 나이를 자동 계산합니다.');
  return result;
 };
 document.addEventListener('input',function(event){if(event.target&&event.target.id==='eBirth')syncAge();});
 document.addEventListener('change',function(event){if(event.target&&event.target.id==='eBirth')syncAge();});
 const previousSaveEmployee=saveEmployee;
 saveEmployee=function(...args){syncAge();return previousSaveEmployee(...args);};
})();
</script>
<script>
/* 휴직 및 산재 기간: 기존 육아휴직·퇴사 처리와 별개로 관리 */
(function(){
 'use strict';
 const priorOpen=openEmployee;
 openEmployee=function(id=null,encoded=''){
  const result=priorOpen(id,encoded);
  const status=document.getElementById('eStatus');

  dates.innerHTML=`<label id="hrLeaveEndWrap" style="display:none;flex-direction:column;gap:6px;min-width:0">휴직 종료일 <span style="font-size:12px;color:#c2410c">*</span><input type="date" id="eLeaveEnd" style="width:100%;min-width:0;box-sizing:border-box"></label><label id="hrAccidentStartWrap" style="display:none;flex-direction:column;gap:6px;min-width:0">산재 시작일 <span style="font-size:12px;color:#c2410c">*</span><input type="date" id="eAccidentStart" style="width:100%;min-width:0;box-sizing:border-box"></label><label id="hrAccidentEndWrap" style="display:none;flex-direction:column;gap:6px;min-width:0">산재 종료일 <span style="font-size:12px;color:#c2410c">*</span><input type="date" id="eAccidentEnd" style="width:100%;min-width:0;box-sizing:border-box"></label>`;
  row.insertAdjacentElement('afterend',dates);
  // Keep the general leave start and end dates side-by-side in the same grid.
  const leaveEndWrap=document.getElementById('hrLeaveEndWrap');
  if(leaveLabel && leaveEndWrap){
   leaveLabel.insertAdjacentElement('afterend',leaveEndWrap);
   row.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
   for(const field of [leaveLabel,leaveEndWrap]){
    field.style.minWidth='0';field.style.width='100%';field.style.maxWidth='none';
    field.style.display='flex';field.style.flexDirection='column';field.style.gap='7px';
    const input=field.querySelector('input');
    if(input){input.style.width='100%';input.style.maxWidth='100%';input.style.boxSizing='border-box';}
   }
  }
  document.getElementById('eLeaveEnd').value=emp?.leave_end_date||'';
  document.getElementById('eAccidentStart').value=emp?.industrial_accident_start_date||'';
  document.getElementById('eAccidentEnd').value=emp?.industrial_accident_end_date||'';
  if(leaveStart && emp?.leave_start_date && !leaveStart.value)leaveStart.value=emp.leave_start_date;
  function refresh(){
   const st=status.value;
   dates.style.display=st==='산재'?'grid':'none';
   for(const [label,on] of [['hrLeaveEndWrap',st==='휴직'],['hrAccidentStartWrap',st==='산재'],['hrAccidentEndWrap',st==='산재']]){
    const el=document.getElementById(label);if(el)el.style.display=on?'flex':'none';
   }
   if(st==='산재')row.style.display='none';
   if(st==='휴직'){
    row.style.display='grid';
    if(leaveLabel)leaveLabel.style.display='flex';
   }
  }
  status.addEventListener('change',refresh);
  refresh();
  return result;
 };
 const priorSave=saveEmployee;
 saveEmployee=function(id){
  const st=document.getElementById('eStatus')?.value;
  if(st!=='휴직'&&st!=='산재')return priorSave(id);
  const start=st==='휴직'?(document.getElementById('eLeaveDate')?.value||''):(document.getElementById('eAccidentStart')?.value||'');
  const end=st==='휴직'?(document.getElementById('eLeaveEnd')?.value||''):(document.getElementById('eAccidentEnd')?.value||'');
  const title=st==='휴직'?'휴직':'산재';
  if(!start||!end){alert(title+' 시작일과 종료일을 모두 선택해 주세요.');document.getElementById(!start?(st==='휴직'?'eLeaveDate':'eAccidentStart'):(st==='휴직'?'eLeaveEnd':'eAccidentEnd'))?.focus();return;}
  if(end<start){alert(title+' 종료일은 시작일과 같거나 이후여야 합니다.');document.getElementById(st==='휴직'?'eLeaveEnd':'eAccidentEnd')?.focus();return;}
  const count=(db.employees||[]).length;
  const original=id==null?null:(db.employees||[]).find(e=>String(e.id)===String(id));
  const oldStart=original?(st==='휴직'?(original.leave_start_date||original.leave_date||''):(original.industrial_accident_start_date||'')):'';
  const oldEnd=original?(st==='휴직'?(original.leave_end_date||''):(original.industrial_accident_end_date||'')):'';
  const result=priorSave(id);
  const target=id==null?((db.employees||[]).length>count?db.employees.at(-1):null):(db.employees||[]).find(e=>String(e.id)===String(id));
  if(!target||target.status!==st)return result;
  const startKey=st==='휴직'?'leave_start_date':'industrial_accident_start_date';
  const endKey=st==='휴직'?'leave_end_date':'industrial_accident_end_date';
  const changed=target[startKey]!==start||target[endKey]!==end;
  target[startKey]=start;target[endKey]=end;
  if(st==='휴직')target.leave_date=start;
  if(changed){
   if(Array.isArray(db.history)&&(oldStart!==start||oldEnd!==end))db.history.unshift({employee_id:target.id,event_date:start,event_type:'상태변경',title:title+' 기간 '+(oldStart||oldEnd?'수정':'등록'),description:start+' ~ '+end,department:target.department,grade:target.grade});
   save();render();
  }
  return result;
 };
})();
</script>

<script>
/* 직원 이름 클릭: 기존 수정 함수와 완전히 분리된 읽기 전용 조회 */
(function(){
 'use strict';
 function safe(v){return typeof esc==='function'?esc(v==null||v===''?'—':String(v)):String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function tenure(start,ref){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(start||'')))return '입사일 미등록';
  const [y,m,d]=start.split('-').map(Number);
  const first=new Date(y,m-1,d);
  if(first.getFullYear()!==y||first.getMonth()!==m-1||first.getDate()!==d)return '입사일 확인 필요';
  const end=ref||new Date();
  if(first>end)return '입사 예정';
  let months=(end.getFullYear()-y)*12+(end.getMonth()+1-m);
  if(end.getDate()<d)months--;
  months=Math.max(0,months);
  return Math.floor(months/12)+'년 '+months%12+'개월';
 }
 function openDetail(id){

  ];

   '<div class="hr-detail-grid">'+items.map(([label,value])=>'<div class="hr-detail-cell"><small>'+safe(label)+'</small><span>'+safe(value)+'</span></div>').join('')+'</div>'+

   '<p class="hint" style="margin-top:16px">조회 전용 화면입니다. 정보 수정은 명부 오른쪽의 ‘수정’ 버튼을 이용하세요. 주민등록번호는 표시하지 않습니다.</p>'+

 const order=new Map(requested.map((r,i)=>[key(r),i]));
 // Keep the original section-02 position when a department is renamed through
 // reference management. Identity is stored with the active reference entry.
 window.__hrExecOriginalOrderKey=parts=>order.has(key(parts))?key(parts):null;
 const savedOrderIdentity=parts=>{
  const currentKey=key(parts);
  const refs=Array.isArray(db.reference_master)?db.reference_master:[];
  const matched=refs.find(r=>r.type==='department'&&r.deleted!==true&&
   key([r.corporation,r.headquarters,r.value])===currentKey);
  return matched&&typeof matched.executive_order_identity==='string'&&order.has(matched.executive_order_identity)
   ?order.get(matched.executive_order_identity):undefined;
 };
 const corporations=['진합','제이앤드에프','지노스','진우정공'].map(clean);
 const asParts=v=>{
  if(Array.isArray(v))return v;
  const tokens=String(v??'').split(/\s+\/\s+/);
  return [tokens[0]||'',tokens.slice(1,-1).join(' / '),tokens[tokens.length-1]||''];
 };
 const rank=r=>{
  const exact=order.get(key(r));
  if(exact!==undefined)return exact;
  const inherited=savedOrderIdentity(r);
  if(inherited!==undefined)return inherited;
  const corp=corporations.indexOf(clean(r[0]));
  // Unlisted units remain visible, appended after the 25 fixed rows.
  return 25+(corp===-1?corporations.length:corp)*10000;
 };
 window.__hrExecOrgCompare=(left,right)=>{

 };
 window.__hrExecOrgOrderCount=requested.length;
})();

<script>
/* Executive report v2: a summary-only report linked from dashboard. No shared database migration. */
(function(){
 'use strict';
 const nav=document.querySelector('.navs [data-view="executive"]');
 if(nav)nav.remove();
 const previousDashboard=dashboard;

   const action='<div class="panel no-print" style="margin-bottom:16px"><div class="exec-report-actions"><div><b>경영진 보고서</b><div class="hint">인력 요약 · 공정별 정/현원 · 입퇴사 · 향후 계획 · 현장관리자 · 노동조합</div></div><button type="button" class="btn primary" id="openExecutiveFromDashboard">경영진 보고서 보기</button></div></div>';

 };

   const button=ev.target.closest('#openExecutiveFromDashboard');

 });
 names.executive=['경영진 보고서','생산직 인력 운영 핵심 현황을 6개 항목으로 요약합니다.'];
 const safe=x=>esc(String(x??''));
 const n=x=>{const v=typeof x==='number'?x:Number(String(x??'').replace(/,/g,'').trim());return Number.isFinite(v)?v:0};
 const val=x=>Number.isFinite(x)?fmt(x):'—';
