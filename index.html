 const dateOf=x=>String(x||'').slice(0,10);
 const mkey=(y,m)=>String(y)+'-'+String(m).padStart(2,'0');
 const safe=x=>esc(String(x??''));
 const ORDER_CORPS=['진합','제이앤드에프','지노스','진우정공'];
 const ORDER_HQ=['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'];
 const orderIndex=(list,v)=>{const n=list.indexOf(String(v||'').trim());return n<0?list.length:n};
 const koCmp=(a,b)=>String(a||'').localeCompare(String(b||''),'ko',{numeric:true});
 const orgsort=(a,b)=>orderIndex(ORDER_CORPS,a.corporation)-orderIndex(ORDER_CORPS,b.corporation)||orderIndex(ORDER_HQ,a.headquarters)-orderIndex(ORDER_HQ,b.headquarters)||koCmp(a.department,b.department)||koCmp(a.name,b.name)||koCmp(a.employee_no,b.employee_no);
 const monthlyExitDate=e=>{const d=dateOf(e.exit_date);if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;const history=(db.history||[]).filter(h=>String(h.employee_id)===String(e.id)&&(h.event_type==='퇴사'||h.title==='퇴사')).map(h=>dateOf(h.event_date)).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();return history.at(-1)||'';};
 const dateSort=(field)=>(a,b)=>dateOf(a[field]).localeCompare(dateOf(b[field]))||orgsort(a,b)||String(a.name||'').localeCompare(String(b.name||''),'ko');
 const rowsNow=()=>db.employees||[];
 function monthlySnapshot(){return (db.snapshots||[]).find(s=>Number(s.year)===Number(reportYear)&&Number(s.month)===Number(reportMonth))}
 function reportsToolbar(title){const years=[...new Set([new Date().getFullYear(),...((db.snapshots||[]).map(x=>Number(x.year))),...rowsNow().flatMap(e=>[Number(String(e.hire_date||'').slice(0,4)),Number(String(monthlyExitDate(e)||'').slice(0,4))])].filter(x=>x>=1990&&x<=2100))].sort((a,b)=>b-a);
  return `<div class="toolbar"><b>${safe(title)}</b><label>기준연도 <select id="monthReportYear">${years.map(y=>`<option value="${y}" ${y===reportYear?'selected':''}>${y}년</option>`).join('')}</select></label><label>기준월 <select id="monthReportMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===reportMonth?'selected':''}>${i+1}월</option>`).join('')}</select></label>${view==='hires'?`<label>조회 <select id="monthReportMode"><option value="month" ${monthMode==='month'?'selected':''}>기준월 입사</option><option value="all" ${monthMode==='all'?'selected':''}>등록된 입사자 전체</option></select></label>`:''}</div>`;
 }
 function banner(s){return `<div class="notice">${s?.employee_details?`<b>${safe(mkey(reportYear,reportMonth))} 월말 확정 자료</b> · ${safe(s.captured||'')} 저장`:s?`<b>기존 월말 기록</b> · 총인원/조직 인원만 저장되어 개인별 명단 및 가입현황은 재구성할 수 없습니다.`:`<b>월말 상세기록 미등록</b> · ${safe(mkey(reportYear,reportMonth))} 기준 확정 자료가 없습니다.`} 현재월은 확정 전 실시간 참고 조회를 제공합니다.</div>`}
 function ctx(){const s=monthlySnapshot(),now=mkey(new Date().getFullYear(),new Date().getMonth()+1)===mkey(reportYear,reportMonth);
  return {s,now,records:s?.employee_details|| (now?rowsNow():null),office:s?.office_union_count??(now?(db.office_union_members||[]).length:0)};
 }
 function noData(label){return `<section class="panel"><p class="empty">${safe(label)}: 해당 월의 상세 기록이 없습니다. 과거 인원을 현재 자료로 대신 표시하지 않습니다.</p></section>`}
 function monthPeople(kind){const c=ctx(),field=kind==='hires'?'hire_date':'exit_date';const source=monthMode==='all'&&kind==='hires'?rowsNow():c.records;
  const list=source?source.filter(e=>kind==='hires'?!!dateOf(e.hire_date):e.status==='퇴사').filter(e=>monthMode==='all'&&kind==='hires'||dateOf(kind==='hires'?e.hire_date:(e.exit_date||(!c.s?monthlyExitDate(e):''))).startsWith(mkey(reportYear,reportMonth))).sort(dateSort(field)):null;
  const hdr=kind==='hires'?['사번','성명','법인','본부/실','부서','직위','입사일','현재상태']:['사번','성명','법인','본부/실','부서','입사일','퇴사일','퇴사사유'];
  const row=e=>kind==='hires'?[e.employee_no,e.name,e.corporation,e.headquarters,e.department,e.position,e.hire_date,e.status]:[e.employee_no,e.name,e.corporation,e.headquarters,e.department,e.hire_date,e.exit_date||(!c.s?monthlyExitDate(e):''),e.exit_reason];
  return reportsToolbar(kind==='hires'?'입사자 명단':'퇴사자 명단')+banner(c.s)+(!list?noData('입·퇴사 명단'):`<section class="panel"><h2>${kind==='hires'?'입사자':'퇴사자'} ${list.length}명</h2><div class="tablewrap"><table><thead><tr>${hdr.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${list.map(e=>`<tr>${row(e).map(x=>`<td>${safe(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${hdr.length}" class="empty">해당하는 직원이 없습니다.</td></tr>`}</tbody></table></div></section>`);
 }
 function monthlyOrg(){const c=ctx();if(!c.records)return reportsToolbar('부서별 · 성별')+banner(c.s)+noData('조직별 성별');const map=new Map();
  c.records.filter(e=>e.status!=='퇴사').forEach(e=>{const k=[e.corporation,e.headquarters,e.department].join('|');const o=map.get(k)||{corporation:e.corporation,headquarters:e.headquarters,department:e.department,total:0,male:0,female:0};o.total++;if(e.gender==='남')o.male++;if(e.gender==='여')o.female++;map.set(k,o)});
  const corp=window.__monthlyCorp||'';const vals=[...map.values()].filter(x=>!corp||x.corporation===corp).sort(orgsort);
  return reportsToolbar('부서별 · 성별')+banner(c.s)+`<section class="panel"><div class="toolbar"><label>법인 <select id="monthlyCorp"><option value="">전체 법인</option>${['진합','제이앤드에프','지노스','진우정공'].map(v=>`<option ${corp===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th>총인원</th><th>남</th><th>여</th></tr></thead><tbody>${vals.map(x=>`<tr>${[x.corporation,x.headquarters,x.department,x.total,x.male,x.female].map(v=>`<td>${safe(v)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">해당 인원 없음</td></tr>'}</tbody></table></div></section>`;
 }
 function monthlyUnion(){const c=ctx();if(!c.records)return reportsToolbar('노조 명부')+banner(c.s)+noData('노조 현황');const active=c.records.filter(e=>e.status!=='퇴사'),members=active.filter(e=>e.union_status==='가입');const office=c.office;
  const build=(field,title)=>{const keys=[...new Set(active.map(e=>e[field]||'미지정'))].sort((a,b)=>field==='corporation'?['진합','제이앤드에프','지노스','진우정공'].indexOf(a)-['진합','제이앤드에프','지노스','진우정공'].indexOf(b):String(a).localeCompare(String(b),'ko'));return `<section class="panel"><h2>${title}</h2><div class="tablewrap"><table><thead><tr><th>구분</th><th>대상 근로자</th><th>가입 조합원</th><th>가입률</th></tr></thead><tbody>${keys.map(k=>{const all=active.filter(e=>(e[field]||'미지정')===k),joined=all.filter(e=>e.union_status==='가입').length;return `<tr><td>${safe(k)}</td><td>${all.length}</td><td>${joined}</td><td>${all.length?(100*joined/all.length).toFixed(1)+'%':'-'}</td></tr>`}).join('')}</tbody></table></div></section>`};
  const roster=members.slice().sort(orgsort);
  const officeMembers=c.now?(db.office_union_members||[]):(Array.isArray(c.s?.office_union_members)?c.s.office_union_members:[]);
  const memberTable=`<section class="panel"><h2>생산직 조합원 명단 · ${roster.length}명</h2><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부/실</th><th>부서</th><th>직위</th><th>가입상태</th><th>관리</th></tr></thead><tbody>${roster.map(e=>`<tr><td>${safe(e.employee_no)}</td><td>${safe(e.name)}</td><td>${safe(e.corporation)}</td><td>${safe(e.headquarters)}</td><td>${safe(e.department)}</td><td>${safe(e.position)}</td><td>가입</td><td>${c.now?`<button class="btn tiny" data-union-edit="${safe(e.id)}">수정</button>`:'월말 기록'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">해당 월의 생산직 조합원이 없습니다.</td></tr>'}</tbody></table></div></section>`;
  const officeTable=officeMembers.length?`<section class="panel"><h2>사무직 조합원 명단 · ${officeMembers.length}명</h2><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>부서</th><th>직위</th><th>직급</th></tr></thead><tbody>${officeMembers.map(e=>`<tr><td>${safe(e.employee_no)}</td><td>${safe(e.name)}</td><td>${safe(e.department)}</td><td>${safe(e.position)}</td><td>${safe(e.grade)}</td></tr>`).join('')}</tbody></table></div></section>`:'';
  return reportsToolbar('노조 명부')+banner(c.s)+`<div class="cards">${card('대상 생산직',active.length,'퇴사 제외')}${card('생산직 가입',members.length,'월말 기록 기준')}${card('사무직 가입',office,'생산직 총인원 제외')}${card('전체 가입',members.length+office,'생산직+사무직')}</div>${build('corporation','법인별 가입 현황')}${build('position','직위별 가입 현황')}${memberTable}${officeTable}`;
 }
 const priorRender=render;
 render=function(){if(!window.__hrCloudConnected?.()){return priorRender()}if(view==='hires'||view==='exits'||view==='organization'||view==='union'){
  const name=names[view]||[view,''];$('#heading').textContent=name[0];$('#subheading').textContent=name[1];$('#content').innerHTML=view==='hires'?monthPeople('hires'):view==='exits'?monthPeople('exits'):view==='organization'?monthlyOrg():monthlyUnion();return;
 }return priorRender()};
 document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-union-edit]');if(!btn)return;const item=(db.employees||[]).find(e=>String(e.id)===btn.dataset.unionEdit);if(item)openEmployee(item.id);});
 document.addEventListener('change',ev=>{const id=ev.target.id;if(!['monthReportYear','monthReportMonth','monthReportMode','monthlyCorp'].includes(id))return;
  if(id==='monthReportYear')reportYear=Number(ev.target.value);if(id==='monthReportMonth')reportMonth=Number(ev.target.value);if(id==='monthReportMode')monthMode=ev.target.value;if(id==='monthlyCorp')window.__monthlyCorp=ev.target.value;render();
 });
})();
</script>
<script>
/* Scheduled departures: preserve employee records; do not double-register people. */
(function(){
 const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''));
 const localDay=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
 const pending=()=>((db.employees||[]).filter(e=>e.status!=='퇴사'&&validDate(e.scheduled_exit_date)&&e.scheduled_exit_date>=localDay())).sort((a,b)=>a.scheduled_exit_date.localeCompare(b.scheduled_exit_date)||String(a.name||'').localeCompare(String(b.name||''),'ko'));
 const prevRender=render;
 function pendingPanel(){
  const list=pending();
  return `<section class="panel"><div class="report-head" style="flex-wrap:wrap"><h2>퇴사 예정자 · ${list.length}명</h2><div class="toolbar"><button class="btn primary" id="newExitSchedule">+ 퇴사 예정 등록</button></div></div><p class="hint">기존 직원 선택 후 퇴사 예정일을 설정합니다. 예정일 당일까지는 현재 인원에 포함되고, 다음 날부터 퇴사자로 처리됩니다.</p><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부/실</th><th>부서</th><th>입사일</th><th>퇴사 예정일</th><th>퇴사사유</th><th>관리</th></tr></thead><tbody>${list.map(e=>`<tr><td>${esc(e.employee_no)}</td><td>${esc(e.name)}</td><td>${esc(e.corporation)}</td><td>${esc(e.headquarters)}</td><td>${esc(e.department)}</td><td>${esc(e.hire_date)}</td><td>${esc(e.scheduled_exit_date)}</td><td>${esc(e.scheduled_exit_reason||'')}</td><td><button type="button" class="btn tiny" data-schedule-edit="${esc(e.id)}">예정 수정</button> <button type="button" class="btn tiny" data-schedule-cancel="${esc(e.id)}">예정 취소</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">등록된 퇴사 예정자가 없습니다.</td></tr>'}</tbody></table></div></section>`;
 }
 render=function(){prevRender();if(view==='exits'&&window.__hrCloudConnected?.()){const root=document.getElementById('content');if(root){root.insertAdjacentHTML('afterbegin',pendingPanel());}}};
 function selector(){
  const people=(db.employees||[]).filter(e=>e.status!=='퇴사').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  modal('퇴사 예정자 등록',`<div class="formgrid"><label class="wide">대상 직원 검색 (성명 또는 사번)<input type="search" id="scheduledEmployeeSearch" autocomplete="off" placeholder="성명 또는 사번을 입력하세요" aria-controls="scheduledEmployeeResults"></label><input type="hidden" id="scheduledEmployee" value=""><div class="wide" id="scheduledEmployeeSelected" style="color:#475569;font-size:13px">선택된 직원이 없습니다.</div><div class="wide" id="scheduledEmployeeResults" role="listbox" style="max-height:250px;overflow-y:auto;border:1px solid #cbd5e1;border-radius:9px;padding:4px"></div></div><p class="hint">검색 결과에서 직원을 선택하세요. 이후 정보 수정 화면에서 퇴사 예정일을 입력할 수 있습니다.</p><div class="modalactions"><button type="button" class="btn" id="scheduledCreateNew">신규 직원 먼저 등록</button><button type="button" class="btn" onclick="closeModal()">취소</button><button type="button" class="btn primary" id="scheduledNext">다음</button></div>`);
  const search=document.getElementById('scheduledEmployeeSearch');
  const result=document.getElementById('scheduledEmployeeResults');
  const selected=document.getElementById('scheduledEmployeeSelected');
  const hidden=document.getElementById('scheduledEmployee');
  const caption=e=>`${e.name||''} (${e.employee_no||''}) · ${e.corporation||''} / ${e.department||''}`;
  function showResults(){
   const query=search.value.trim().toLocaleLowerCase('ko');
   const found=people.filter(e=>String(e.name||'').toLocaleLowerCase('ko').includes(query)||String(e.employee_no||'').toLowerCase().includes(query)).slice(0,20);
   result.replaceChildren();
   for(const e of found){
    const btn=document.createElement('button');btn.type='button';btn.setAttribute('role','option');
    btn.style.cssText='display:block;width:100%;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid #e2e8f0;background:transparent;cursor:pointer;color:#0f172a';
    btn.textContent=caption(e);btn.addEventListener('click',()=>{hidden.value=String(e.id);selected.textContent='선택 직원: '+caption(e);search.value=String(e.name||'');result.replaceChildren();});result.appendChild(btn);
   }
   if(!found.length){const msg=document.createElement('div');msg.textContent='검색 결과가 없습니다.';msg.style.padding='10px';result.appendChild(msg);}
  }
  search.addEventListener('input',()=>{hidden.value='';selected.textContent='선택된 직원이 없습니다.';if(!search.isComposing)showResults();});
  search.addEventListener('compositionend',showResults);
  search.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();const first=result.querySelector('button');if(first)first.click();}});
  showResults();search.focus();
  document.getElementById('scheduledNext').onclick=()=>{const id=hidden.value;if(!id){alert('검색 결과에서 퇴사 예정 직원을 선택하세요.');search.focus();return;}scheduleEditor(id)};
  document.getElementById('scheduledCreateNew').onclick=()=>{closeModal();openEmployee();alert('신규 직원 저장 후 퇴사자 명단에서 [퇴사 예정 등록]을 다시 선택해 주세요.');};
 }
 function scheduleEditor(id){const e=(db.employees||[]).find(x=>String(x.id)===String(id));if(!e)return alert('직원을 찾지 못했습니다.');openEmployee(e.id);const content=document.querySelector('#modalBody .formgrid');if(!content)return;const section=document.createElement('div');section.style.cssText='grid-column:1/-1;border:1px solid #cbd5e1;border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px';section.innerHTML=`<label>퇴사 예정일 *<input id="scheduledExitDate" type="date" value="${esc(e.scheduled_exit_date||'')}" min="${localDay()}" required></label><label>퇴사사유<input id="scheduledExitReason" type="text" value="${esc(e.scheduled_exit_reason||e.exit_reason||'')}" placeholder="퇴사사유 입력"></label><div class="hint" style="grid-column:1/-1">퇴사 예정일 당일에는 재직 상태를 유지하고, 다음 날 자동으로 퇴사 처리합니다.</div>`;content.appendChild(section);
  const st=document.getElementById('eStatus');if(st){st.value=e.status;st.disabled=true;}
  window.__scheduledEditingId=String(e.id);
 }
 const prevSave=saveEmployee;
 saveEmployee=function(id){const scheduled=document.getElementById('scheduledExitDate');if(!scheduled)return prevSave(id);
  const date=scheduled.value,reason=document.getElementById('scheduledExitReason')?.value.trim()||'';
  if(!validDate(date)||date<localDay()){alert('오늘 이후의 퇴사 예정일을 입력하세요.');scheduled.focus();return;}
  const e=(db.employees||[]).find(x=>String(x.id)===String(id));if(!e)return alert('기존 직원을 선택해 주세요.');
  const n=document.getElementById('eNo')?.value.trim();if(!n||!document.getElementById('eName')?.value.trim()){alert('사번과 성명을 확인하세요.');return;}
  // Save schedule along with normal employee fields, using the current shared DB data structure.
  const oldDate=e.scheduled_exit_date||'';const oldReason=e.scheduled_exit_reason||'';
  e.scheduled_exit_date=date;e.scheduled_exit_reason=reason;
  const event=db.history||[];
  if(oldDate!==date||oldReason!==reason)event.unshift({employee_id:e.id,event_date:localDay(),event_type:'퇴사예정',title:'퇴사 예정 '+(oldDate?'변경':'등록'),description:`${date} / ${reason||'사유 미입력'}`,department:e.department,grade:e.grade});
  const oldModal=document.getElementById('modalWrap')?.classList.contains('open');
  prevSave(id);
  // Earlier employee-save layers may produce their own asynchronous shared saves.
  // Make the scheduled values explicit in a final synced revision.
  if(oldModal&&!document.getElementById('modalWrap')?.classList.contains('open')){save();render();}
 };
 document.addEventListener('click',ev=>{const add=ev.target.closest('#newExitSchedule');if(add){selector();return;}
  const edit=ev.target.closest('[data-schedule-edit]');if(edit){scheduleEditor(edit.dataset.scheduleEdit);return;}
  const cancel=ev.target.closest('[data-schedule-cancel]');if(cancel){const e=(db.employees||[]).find(x=>String(x.id)===cancel.dataset.scheduleCancel);if(!e)return;if(!confirm(`${e.name}님의 퇴사 예정 등록을 취소하시겠습니까?`))return;delete e.scheduled_exit_date;delete e.scheduled_exit_reason;commit('퇴사 예정 취소',e.employee_no+' '+e.name);}
 });
})();
</script>
<script>
/* Shared reference information. Stored inside hr_shared_state.data.reference_master. */
(function(){
'use strict';
const TYPES={corporation:'법인',headquarters:'본부 / 실',department:'부서 / 팀',position:'직위',grade:'직급',education:'학력',field_leader_role:'현장관리자 구분',salary_type:'급여 형태',employment_type:'고용형태'};
const BASE={corporation:['진합','제이앤드에프','지노스','진우정공'],headquarters:['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'],position:[],grade:[],education:[],field_leader_role:['그룹장','파트장','라인장'],salary_type:['월급','시급'],employment_type:['정규직','계약직']};
const coll=()=>[...(db.employees||[]),...(db.plans||[]),...(db.recruitment||[])];
const key=r=>[r.type,r.value,r.corporation||'',r.headquarters||''].join('\u001f');
const record=(type,value,corporation='',headquarters='',active=true)=>({type,value,corporation,headquarters,active});
function derived(){const out=[];for(const [type,vals] of Object.entries(BASE)){for(const v of vals)out.push(record(type,v));}for(const x of coll()){
 for(const type of Object.keys(TYPES)){const v=String(x[type]||'').trim();if(!v)continue;out.push(record(type,v,type==='headquarters'||type==='department'?x.corporation||'':'',type==='department'?x.headquarters||'':''));}
}return out;}
function rows(){const actual=Array.isArray(db.reference_master)?db.reference_master:[];const explicit=new Map(actual.map(x=>[key(x),x]));const combined=new Map();for(const x of derived())if(!combined.has(key(x)))combined.set(key(x),x);for(const x of actual)combined.set(key(x),x);return [...combined.values()];}
function master(){if(!Array.isArray(db.reference_master))db.reference_master=[];return db.reference_master;}
function candidates(type,corporation='',headquarters=''){const list=rows().filter(x=>x.type===type&&x.active!==false&&(!corporation||!['headquarters','department'].includes(type)||!x.corporation||x.corporation===corporation)&&(!headquarters||type!=='department'||!x.headquarters||x.headquarters===headquarters)).map(x=>x.value);return [...new Set(list)].sort((a,b)=>a.localeCompare(b,'ko'));}
function actualUses(r){return coll().filter(x=>String(x[r.type]||'')===r.value&&(!r.corporation||x.corporation===r.corporation)&&(!r.headquarters||x.headquarters===r.headquarters)).length;}
let filterType='department',filterText='';
function viewMaster(){const data=rows().filter(x=>x.type===filterType&&(!filterText||[x.value,x.corporation,x.headquarters].some(y=>String(y||'').toLowerCase().includes(filterText.toLowerCase())))).sort((a,b)=>String(a.corporation).localeCompare(String(b.corporation),'ko')||String(a.headquarters).localeCompare(String(b.headquarters),'ko')||String(a.value).localeCompare(String(b.value),'ko'));
 return `<section class="panel"><div class="report-head" style="flex-wrap:wrap;gap:12px"><div><h2>기준정보 관리</h2><div class="hint">등록된 직원·사업계획·채용 자료의 항목도 함께 표시합니다. 신규 항목은 세 사용자에게 공동 적용됩니다.</div></div><button class="btn primary" id="masterAdd">+ 기준정보 추가</button></div><div class="toolbar" style="margin-top:18px"><label>관리 항목 <select id="masterType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${filterType===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label><input id="masterSearch" placeholder="명칭 또는 소속 검색" value="${esc(filterText)}" style="min-width:200px"><span class="pill">${data.length}개 항목</span></div><div class="notice">이미 사용 중인 항목은 기존 직원의 소속이나 이력을 자동 변경하지 않습니다. 명칭 변경이 필요하면 새 명칭을 추가하고 직원 정보를 별도로 발령 처리하세요. 사용 중지는 새 입력 후보에서 제외하는 기능입니다.</div><div class="tablewrap"><table><thead><tr><th>명칭</th><th>법인</th><th>본부 / 실</th><th>사용 건수</th><th>상태</th><th>관리</th></tr></thead><tbody>${data.map((r,i)=>`<tr><td><b>${esc(r.value)}</b></td><td>${esc(r.corporation||'-')}</td><td>${esc(r.headquarters||'-')}</td><td>${actualUses(r)}건</td><td>${r.active===false?'<span class="pill warn">사용 중지</span>':'<span class="pill good">사용</span>'}</td><td><button class="btn tiny" data-master-edit="${i}">수정</button> <button class="btn tiny" data-master-toggle="${i}">${r.active===false?'사용 재개':'사용 중지'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">등록된 항목이 없습니다.</td></tr>'}</tbody></table></div></section>`;}
function visible(){return rows().filter(x=>x.type===filterType&&(!filterText||[x.value,x.corporation,x.headquarters].some(y=>String(y||'').toLowerCase().includes(filterText.toLowerCase())))).sort((a,b)=>String(a.corporation).localeCompare(String(b.corporation),'ko')||String(a.headquarters).localeCompare(String(b.headquarters),'ko')||String(a.value).localeCompare(String(b.value),'ko'));}
function editor(source=null){const type=source?.type||filterType;const corp=source?.corporation||'',hq=source?.headquarters||'';modal(source?'기준정보 수정':'기준정보 추가',`<div class="formgrid"><label>관리 항목<select id="miType" ${source?'disabled':''}>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>명칭 *<input id="miName" value="${esc(source?.value||'')}" maxlength="100" placeholder="명칭 입력"></label><label id="miCorpLabel">소속 법인<select id="miCorp"><option value="">전체 / 미지정</option>${candidates('corporation').map(x=>`<option ${x===corp?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label id="miHqLabel">소속 본부 / 실<select id="miHQ"><option value="">전체 / 미지정</option>${candidates('headquarters',corp).map(x=>`<option ${x===hq?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="hint" style="margin-top:12px">부서/팀은 법인과 본부/실을 선택하는 것이 좋습니다. 동일 명칭의 조직이 여러 법인에 있을 경우 구별할 수 있습니다.</div><div class="modalactions"><button class="btn" id="miCancel">취소</button><button class="btn primary" id="miSave">저장</button></div>`);
 const typeEl=document.getElementById('miType'),corpEl=document.getElementById('miCorp'),hqEl=document.getElementById('miHQ');function adjust(){const t=typeEl.value;document.getElementById('miCorpLabel').style.display=['department','headquarters'].includes(t)?'flex':'none';document.getElementById('miHqLabel').style.display=t==='department'?'flex':'none';}typeEl.onchange=adjust;corpEl.onchange=()=>{const vals=candidates('headquarters',corpEl.value);hqEl.innerHTML='<option value="">전체 / 미지정</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join('');};adjust();
 document.getElementById('miCancel').onclick=closeModal;
 document.getElementById('miSave').onclick=()=>{if(!window.__hrCloudConnected?.()){alert('공유 데이터 로그인 후 기준정보를 저장하세요.');return;}const t=typeEl.value,v=document.getElementById('miName').value.trim(),c=['department','headquarters'].includes(t)?corpEl.value:'',h=t==='department'?hqEl.value:'';if(!v){alert('명칭을 입력하세요.');return;}if(t==='department'&&(!c||!h)){alert('부서를 추가할 법인과 본부/실을 선택하세요.');return;}if(t==='headquarters'&&!c){alert('본부/실을 추가할 법인을 선택하세요.');return;}const next=record(t,v,c,h,source?.active!==false);if(rows().some(x=>key(x)===key(next)&&(!source||key(x)!==key(source)))){alert('같은 기준정보가 이미 등록되어 있습니다.');return;}if(source){const old=master().find(x=>key(x)===key(source));if(old){Object.assign(old,next)}else master().push(next);}else master().push(next);closeModal();commit('기준정보 '+(source?'수정':'추가'),`${TYPES[t]} / ${v}`);};
}
const nav=document.querySelector('.navs'),anchor=nav?.querySelector('[data-view="employees"]');if(anchor){anchor.insertAdjacentHTML('afterend','<button class="nav" data-view="master">▤ 기준정보 관리</button>');nav.querySelector('[data-view="master"]').addEventListener('click',()=>setView('master'));}
names.master=['기준정보 관리','법인·본부·부서·직위·직급 등 인사 기준정보를 관리합니다.'];
const previousRender=render;render=function(){if(view==='master'){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view==='master'));$('#heading').textContent=names.master[0];$('#subheading').textContent=names.master[1];$('#content').innerHTML=viewMaster();return;}previousRender();};
document.addEventListener('change',e=>{if(e.target.id==='masterType'){filterType=e.target.value;filterText='';render();}});
document.addEventListener('input',e=>{if(e.target.id==='masterSearch'){filterText=e.target.value;const selection=e.target.selectionStart;render();const el=document.getElementById('masterSearch');el?.focus();el?.setSelectionRange(selection,selection);}});
document.addEventListener('click',e=>{if(view!=='master')return;const add=e.target.closest('#masterAdd');if(add){editor();return;}const edit=e.target.closest('[data-master-edit]');if(edit){editor(visible()[Number(edit.dataset.masterEdit)]);return;}const toggle=e.target.closest('[data-master-toggle]');if(toggle){if(!window.__hrCloudConnected?.()){alert('공유 데이터 로그인 후 변경하세요.');return;}const r=visible()[Number(toggle.dataset.masterToggle)];if(!r)return;const use=actualUses(r);if(r.active!==false&&use>0&&!confirm(`현재 ${use}건에서 사용 중입니다. 기존 자료는 유지하고 신규 입력 후보에서만 제외할까요?`))return;const arr=master(),item=arr.find(x=>key(x)===key(r));if(item)item.active=r.active===false;else arr.push({...r,active:false});commit('기준정보 상태변경',`${TYPES[r.type]} / ${r.value}`);}});
// Extend existing datalist inputs without replacing employee fields or historical values.
window.__hrMasterCandidates=candidates;
window.__hrMasterRows=rows;
const oldOptions=options;options=function(type){if(!(type in TYPES))return oldOptions(type);return `<datalist id="dl-${type}">${candidates(type).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`;};
const oldUnique=unique;unique=function(type){return type in TYPES?candidates(type):oldUnique(type);};
const oldOpenEmployee=openEmployee;openEmployee=function(...args){if(args[0]!=null){const item=db.employees.find(e=>String(e.id)===String(args[0]));if(item)args[0]=item.id;}oldOpenEmployee(...args);for(const [id,type] of [['ePosition','position'],['eGrade','grade'],['eEducation','education']]){const el=document.getElementById(id);if(!el)continue;el.setAttribute('list','dl-'+type);if(!document.getElementById('dl-'+type))document.getElementById('modalBody')?.insertAdjacentHTML('beforeend',options(type));} };
})();
</script>

<script>
/* DOB bulk import: validate and preview before committing to shared data. */
(function(){
 const previous=employeesView;
 let staged=[];
 const normalizeNo=v=>String(v??'').trim().replace(/\.0$/,'');
 const normalizeName=v=>String(v??'').replace(/\s/g,'').trim();
 const message=(txt,kind='')=>{
  const el=document.getElementById('dobBulkStatus');
  if(el){el.textContent=txt;el.style.color=kind==='error'?'#a32626':'#40516a';}
 };
 employeesView=function(){
  const html=previous();
  const bar=`<section class="panel" style="padding:14px 20px;margin-bottom:12px"><div class="toolbar" style="margin:0;gap:10px;flex-wrap:wrap"><button class="btn" type="button" id="dobBulkButton" onclick="window.hrDobPick()">생년월일 일괄 반영</button><input type="file" id="dobBulkFile" accept=".tsv,.txt,text/tab-separated-values,text/plain" style="display:none" onchange="window.hrDobSelect(this)"><button type="button" class="btn primary" id="dobBulkApply" onclick="window.hrDobApply()" style="display:none">검증 결과 반영</button><span class="hint">사번·성명이 모두 일치하는 직원만 변경 · 주민등록번호 전체를 가져오지 않음</span></div><div id="dobBulkStatus" role="status" aria-live="polite" style="padding-top:8px;white-space:pre-line;font-size:13px">TSV 파일을 선택하면 일치 건수와 오류 여부를 이곳에 표시합니다.</div></section>`;
  return bar+html;
 };
 window.hrDobPick=()=>{
  staged=[];
  const input=document.getElementById('dobBulkFile');
  const apply=document.getElementById('dobBulkApply');if(apply)apply.style.display='none';
  if(!input){alert('가져오기 화면을 찾지 못했습니다. 새로고침 후 다시 시도하세요.');return;}
  message('파일 선택창을 여는 중입니다. TSV 파일을 선택하세요.');input.value='';input.click();
 };
 const readText=async file=>{
  if(typeof file.text==='function')return file.text();
  return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('파일 읽기 실패'));r.readAsText(file,'UTF-8');});
 };
 window.hrDobSelect=async input=>{
  staged=[];
  const apply=document.getElementById('dobBulkApply');if(apply)apply.style.display='none';
  const file=input?.files?.[0];if(!file){message('파일 선택이 취소되었습니다.');return;}
  message(`선택한 파일: ${file.name}\n파일을 읽고 사번·성명 일치 여부를 검사 중입니다.`);
  try{
   if(!Array.isArray(db.employees))throw Error('직원 목록을 불러오지 못했습니다. 공유 데이터 연결을 확인하세요.');
   const content=(await readText(file)).replace(/^\uFEFF/,'');
   const lines=content.split(/\r?\n/).filter(l=>l.trim());
   const hdr=(lines.shift()||'').split('\t').map(x=>x.trim());
   if(hdr[0]!=='사번'||hdr[1]!=='성명'||hdr[2]!=='생년월일')throw Error('TSV 파일의 첫 줄은 사번, 성명, 생년월일 순서여야 합니다. 엑셀(xlsx)이 아닌 제공된 TSV 파일을 선택하세요.');
   const lookup=new Map();
   for(const person of db.employees){const key=normalizeNo(person.employee_no)+'|'+normalizeName(person.name);if(!lookup.has(key))lookup.set(key,[]);lookup.get(key).push(person);}
   const seen=new Set(),counts={changed:0,identical:0,unmatched:0,ambiguous:0,invalid:0};
   for(const line of lines){
    const [no,name,dateRaw]=line.split('\t');const date=String(dateRaw||'').trim();const key=normalizeNo(no)+'|'+normalizeName(name);
    if(seen.has(key)){counts.ambiguous++;continue;}seen.add(key);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){counts.invalid++;continue;}
    const d=new Date(date+'T00:00:00Z');if(isNaN(+d)||d.toISOString().slice(0,10)!==date){counts.invalid++;continue;}
    const found=lookup.get(key)||[];
    if(!found.length){counts.unmatched++;continue;}
    if(found.length!==1){counts.ambiguous++;continue;}
    if(found[0].birth_date===date){counts.identical++;continue;}
    staged.push({id:found[0].id,employee_no:found[0].employee_no,name:found[0].name,date});counts.changed++;
   }
   const result=`파일: ${file.name} (${lines.length}건)\n반영 대상 ${counts.changed}명 · 이미 동일 ${counts.identical}명 · 명단에 없음 ${counts.unmatched}명 · 중복 ${counts.ambiguous}명 · 날짜 오류 ${counts.invalid}명`;
   message(result+(staged.length?'\n검증 결과 반영 버튼을 누르면 공동 DB에 저장을 요청합니다.':'\n변경할 직원이 없습니다.'));
   if(staged.length&&apply)apply.style.display='inline-block';
  }catch(err){staged=[];message('파일 검증 오류: '+(err?.message||String(err)),'error');alert('생년월일 파일을 읽지 못했습니다.\n'+(err?.message||String(err)));}
  finally{if(input)input.value='';}
 };
 window.hrDobApply=()=>{
  if(!staged.length){message('반영할 내역이 없습니다. 파일을 다시 선택하세요.');return;}
  if(!window.__hrCloudConnected?.()){message('공동 데이터 연결 및 로그인이 필요합니다.','error');alert('공유 데이터 로그인 후 반영하세요.');return;}
  const byId=new Map(db.employees.map(e=>[String(e.id),e]));
  const changes=staged.map(x=>{const e=byId.get(String(x.id));return {person:e&&normalizeNo(e.employee_no)===normalizeNo(x.employee_no)&&normalizeName(e.name)===normalizeName(x.name)?e:null,date:x.date};});
  if(changes.some(x=>!x.person)){message('직원 명단이 변경되었습니다. 파일을 다시 불러와 검증하세요.','error');return;}
  if(!confirm(`${changes.length}명의 생년월일을 공동 DB에 반영하시겠습니까?\n\n사번과 성명을 다시 확인한 직원만 수정합니다.`))return;
  const apply=document.getElementById('dobBulkApply');if(apply){apply.disabled=true;apply.textContent='반영 처리 중…';}
  message(`${changes.length}명의 생년월일을 적용 중입니다. 잠시 후 공동 DB 저장 상태를 확인하세요.`);
  changes.forEach(({person,date})=>{person.birth_date=date;});
  const count=changes.length;staged=[];
  commit('생년월일 일괄 반영',`${count}명 · 사번/성명 이중 일치`);
  message(`${count}명의 생년월일을 화면에 반영했습니다. 공동 DB로 전송 중이며 상단 저장 상태를 확인하세요.`);
  const newApply=document.getElementById('dobBulkApply');if(newApply)newApply.style.display='none';
 };
})();
</script>

<script>
/* Employee editing: centralized event dispatch, independent of inline onclick argument quoting. */
(function(){
 document.addEventListener('click',function(event){
  const button=event.target.closest('button[data-employee-edit]');
  if(!button)return;
  event.preventDefault();
  event.stopPropagation();
  try{
   const id=button.getAttribute('data-employee-edit');
   const employee=(db.employees||[]).find(item=>String(item.id)===String(id));
   if(!employee){alert('선택한 직원을 찾을 수 없습니다. 목록을 새로고침해 주세요.');return;}
   openEmployee(employee.id);
   if(!document.querySelector('#modalWrap.open #eNo')){
    throw new Error('직원 수정창이 열리지 않았습니다.');
   }
  }catch(error){
   console.error('[직원 수정 버튼]',error);
   alert('직원 수정창 오류: '+(error&&error.message?error.message:String(error)));
  }
 },true);
})();
</script>
</body></html>
