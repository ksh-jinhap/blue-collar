3px;color:var(--muted)}.card .num{font-size:32px;font-weight:800;margin:11px 0 6px;letter-spacing:-1px}.card .note{font-size:12px;color:var(--muted)}.panel{padding:21px;margin-bottom:17px}.panel h2{font-size:18px;margin:0 0 15px}.section{display:grid;grid-template-columns:1.2fr .8fr;gap:17px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 15px}.field,input,select,textarea{font:inherit}input,select,textarea{min-width:0;padding:10px 11px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e293b}input:focus,select:focus,textarea:focus{outline:2px solid #a5c3ff;border-color:#2563eb}.toolbar input{width:220px}.toolbar select{max-width:190px}.tablewrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;min-width:630px;text-align:left}th{background:#f7f9fc;color:#65758b;font-size:12px;font-weight:800;white-space:nowrap}td,th{padding:12px 11px;border-bottom:1px solid #edf0f5}td{font-size:13px}tr:last-child td{border-bottom:0}tr:hover td{background:#f9fbfe}.right{text-align:right}.bar{height:9px;background:#e9eef7;border-radius:20px;overflow:hidden;min-width:75px}.bar i{display:block;background:#4580e9;height:100%;border-radius:20px}.muted{color:var(--muted)}.positive{color:var(--good);font-weight:800}.negative{color:var(--bad);font-weight:800}.warning{color:#ba6a07;font-weight:800}.empty{padding:25px;color:var(--muted);text-align:center}.hint{font-size:12px;color:var(--muted);line-height:1.65}.notice{background:#eff6ff;padding:12px 15px;border:1px solid #cfe0ff;border-radius:10px;color:#234b7f;line-height:1.7;margin:12px 0}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.formgrid label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#586982;font-weight:700}.formgrid label.wide{grid-column:span 3}.modalwrap{position:fixed;inset:0;background:#12203ba8;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modalwrap.open{display:flex}.modal{background:white;border-radius:16px;padding:25px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #07182c50}.modal h2{margin:0 0 18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.small{font-size:12px}.timeline{border-left:2px solid #dce8fb;margin:20px 0 20px 9px;padding-left:19px}.event{position:relative;margin-bottom:21px}.event:before{content:"";width:10px;height:10px;border-radius:50%;background:#3576e8;position:absolute;left:-25px;top:3px}.event .date{font-size:12px;color:var(--muted)}.event b{display:block;margin:5px 0}.summaryline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.kpirow{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.kpirow strong{font-size:20px}.hidden{display:none!important}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.section{grid-template-columns:1fr}.main{padding:24px}}@media(max-width:720px){.shell{display:block}.sidebar{width:100%;height:auto;position:static;padding:14px}.brand{font-size:16px}.subtitle,.sidefoot{display:none}.navs{display:flex;overflow:auto}.nav{white-space:nowrap;padding:9px 10px;font-size:12px}.main{padding:18px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid label.wide{grid-column:span 1}.toolbar input{width:100%}}

/* Scrollable navigation and data grids (presentation only). */
@media screen {
  .sidebar{display:flex;flex-direction:column;overflow:hidden}
  .sidebar .navs{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
  #content .tablewrap{max-height:min(68vh,720px);overflow:auto;position:relative;overscroll-behavior:contain;scrollbar-width:thin}
  #content .tablewrap thead th{position:sticky;top:0;z-index:5;background:#f1f5f9;box-shadow:0 1px 0 #dce4ed}
  #content .tablewrap.hr-fixed-scroll{max-height:min(72vh,850px)}
  @media(max-width:720px){.sidebar{display:block;overflow:visible}.sidebar .navs{display:flex;overflow-x:auto;overflow-y:hidden;max-height:none}}
}
@media print {
  #content .tablewrap,#content .tablewrap.hr-fixed-scroll{max-height:none!important;overflow:visible!important}
  #content .tablewrap thead th{position:static!important;box-shadow:none!important}
}

/* Scroll usability patch: nested grids hand wheel scrolling back to the page. */
@media screen {
  html { overflow-y:auto; scroll-behavior:auto; }
  body { overflow-x:hidden; overflow-y:visible; }
  .shell { min-height:100vh; height:auto; overflow:visible; }
  .main { min-width:0; overflow:visible; }
  .sidebar { overscroll-behavior-y:auto; }
  .sidebar .navs { overscroll-behavior-y:auto; -webkit-overflow-scrolling:touch; }
  #content .tablewrap,
  #content .tablewrap.hr-fixed-scroll {
    overflow-x:auto;
    overflow-y:auto;
    overscroll-behavior:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  #content .tablewrap thead th,
  #content .tablewrap.hr-fixed-scroll thead th {
    position:sticky;
    top:0;
    z-index:5;

  }
  .modalwrap { overscroll-behavior:auto; }
  .modal { overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:auto; -webkit-overflow-scrolling:touch; }
  @media(max-width:720px) {

}
@media print {

</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">생산직 인사관리</div><div class="subtitle">WORKFORCE · TO CONTROL</div><div class="navs"><button class="nav active" data-view="dashboard">▣ 대시보드</button><button class="nav" data-view="employees">♙ 생산직 인원관리</button><button class="nav" data-view="plans">▤ 사업계획 정원 · TO</button><button class="nav" data-view="recruitment">▦ 채용 진행관리</button><button class="nav" data-view="executive">▣ 경영진 보고서</button><button class="nav" data-view="organization">◫ 부서별 · 성별</button><button class="nav" data-view="history">◷ 개인별 연혁</button><button class="nav" data-view="audit">≡ 변경 기록</button><button class="nav" data-view="backup">⇩ 저장 · 백업</button></div></aside><main class="main"><div class="top"><div><h1 id="heading">대시보드</h1><div class="desc" id="subheading">생산직 인력 운영 현황을 한눈에 확인하세요.</div></div><div class="actions"><span class="pill" id="saveBadge">저장 상태 확인 중</span><button class="btn primary" id="saveNow">현재 내용 저장</button></div></div><div id="content"></div></main></div><div class="modalwrap" id="modalWrap"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>const SEED={employees:[],plans:[],history:[],audit:[],recruitment:[],snapshots:[],settings:{retirementAge:60}};
const KEY='production-hr-single-html-v1';const today=()=>new Date().toISOString().slice(0,10);const year=()=>new Date().getFullYear();const $=s=>document.querySelector(s);const fmt=n=>Number(n||0).toLocaleString('ko-KR');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.floor(Date.now()*1000+Math.random()*1000);const occupied=e=>e.status!=='퇴사';const keyOf=x=>[x.corporation||'',x.headquarters||'',x.department||''].join('␟');
let db=structuredClone(SEED),view='dashboard',search='',filters={},planYear=year(),historyEmployee='';for(const k of ['employees','plans','history','audit'])db[k]??=[]; db.plans.forEach(p=>p.year=Number(p.year));
function save(){db.lastSaved=new Date().toLocaleString('ko-KR');$('#saveBadge').textContent='공유 저장 확인 중';$('#saveBadge').className='pill warn';return true}
function commit(action,detail){db.audit.unshift({id:uid(),date:new Date().toLocaleString('ko-KR'),action,detail});db.audit=db.audit.slice(0,2000);save();render()}
function plansFor(y){return db.plans.filter(p=>Number(p.year)===Number(y))}function unitCount(p){return db.employees.filter(e=>occupied(e)&&e.corporation===p.corporation&&e.headquarters===p.headquarters&&e.department===p.department).length}function planSummary(){let a=plansFor(planYear);return {target:a.reduce((s,p)=>s+Number(p.target||0),0),actual:a.reduce((s,p)=>s+unitCount(p),0),short:a.reduce((s,p)=>s+Math.max(0,Number(p.target||0)-unitCount(p)),0),extra:a.reduce((s,p)=>s+Math.max(0,unitCount(p)-Number(p.target||0)),0)}}
function card(label,num,note,cl=''){return `<div class="card"><div class="label">${label}</div><div class="num ${cl}">${fmt(num)}</div><div class="note">${note}</div></div>`}function summaryCards(){const active=db.employees.filter(occupied),ret=db.employees.length-active.length,ps=planSummary();return `<div class="cards">${card('현재 운영 인원',active.length,'퇴사 제외 · 파견·대기·휴직 포함')}${card('사업계획 정원',ps.target,planYear+'년 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족분의 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과분의 합계','warning')}${card('퇴사 누계',ret,'등록된 전체 퇴사 인원')}</div>`}
function select(name,opts,val='',empty='전체'){return `<select id="${name}">${empty!==null?`<option value="">${empty}</option>`:''}${opts.map(x=>`<option value="${esc(x)}" ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function unique(field){return [...new Set(db.employees.map(e=>e[field]||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}function options(field,val=''){return `<datalist id="dl-${field}">${unique(field).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`}function heading(s){return `<div class="summaryline"><strong>${s}</strong></div>`}
const names={dashboard:['대시보드','전체 인원과 사업계획 대비 TO를 즉시 확인합니다.'],employees:['생산직 인원관리','인원 추가·수정·퇴사 처리 시 정원 현황이 함께 갱신됩니다.'],plans:['사업계획 정원 · TO','연도·법인·본부·부서별 정원을 지정하고 충원 현황을 관리합니다.'],organization:['부서별 · 성별','생산직 운영 인원 구성 및 부서 현황을 조회합니다.'],history:['개인별 연혁','직원별 입사·이동·승급·퇴사 등을 누적 관리합니다.'],audit:['변경 기록','인원 및 사업계획 변경 내역을 확인합니다.'],backup:['저장 · 백업','현재 내용은 이 브라우저에 저장됩니다. 정기적인 백업을 권장합니다.']};
function setView(v){view=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render()}
function render(){const [h,d]=names[view];$('#heading').textContent=h;$('#subheading').textContent=d;$('#saveBadge').textContent=db.lastSaved?'저장됨 · '+db.lastSaved:'초기 명단 · 아직 변경 없음';$('#content').innerHTML=({dashboard:dashboard,employees:employeesView,plans:plansView,organization:organizationView,history:historyView,audit:auditView,backup:backupView}[view])()}
function legacyYearPicker(){return `<div class="toolbar"><label>사업계획 연도</label><input id="planYear" type="number" min="2000" max="2100" value="${planYear}" style="width:115px"><span class="hint">연도별 정원은 별도로 관리됩니다.</span></div>`}
function dashboard(){let a=plansFor(planYear).map(p=>({...p,actual:unitCount(p)})).sort((a,b)=>(b.actual-monthTarget(b))-(a.actual-monthTarget(a))||String(a.corporation).localeCompare(String(b.corporation),'ko')||String(a.department).localeCompare(String(b.department),'ko'));let corps={};db.employees.filter(occupied).forEach(e=>{let k=e.corporation||'미지정';corps[k]=(corps[k]||0)+1});const max=Math.max(1,...Object.values(corps));return yearPicker()+summaryCards()+`<div class="notice"><b>TO 산정 기준</b> · 현재 운영 인원은 퇴사자를 제외한 재직·휴직·파견·대기·산재·육아휴직 인원을 포함합니다. 부족 TO는 <b>부서별 max(사업계획 정원 − 운영 인원, 0)</b>을 합산합니다. 계획 미등록 부서는 부족 TO에 포함되지 않습니다.</div><div class="section"><section class="panel"><h2>초과 TO 우선 확인</h2><div class="hint">초과 인원이 많은 팀부터 표시 · 전체 팀 스크롤 조회</div>${a.length?`<div class="tablewrap" style="max-height:500px;overflow:auto"><table><thead><tr><th>법인 / 본부 / 부서</th><th class="right">계획</th><th class="right">현재</th><th class="right">부족 / 초과</th><th>충원</th></tr></thead><tbody>${a.map(p=>`<tr><td>${esc(p.corporation)} · ${esc(p.headquarters)}<br><b>${esc(p.department)}</b></td><td class="right">${fmt(monthTarget(p))}</td><td class="right">${fmt(p.actual)}</td><td class="right ${monthTarget(p)>p.actual?'negative':monthTarget(p)<p.actual?'warning':'positive'}">${monthTarget(p)>p.actual?'-'+(monthTarget(p)-p.actual):monthTarget(p)<p.actual?'+'+(p.actual-monthTarget(p)):'일치'}</td><td><button class="btn tiny primary" onclick="openEmployee(null,'${encodeURIComponent(keyOf(p))}')">인원 등록</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">아직 ${planYear}년 사업계획 인원이 없습니다.<br><br><button class="btn primary" onclick="setView('plans')">사업계획 정원 입력하기</button></div>`}</section><section class="panel"><h2>법인별 운영 인원</h2>${Object.entries(corps).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="margin:17px 0"><div class="summaryline" style="justify-content:space-between;margin-bottom:7px"><b>${esc(n)}</b><b>${fmt(v)}명</b></div><div class="bar"><i style="width:${100*v/max}%"></i></div></div>`).join('')}<div class="hint">※ 최초 데이터에는 사업계획 정원이 없으므로 직접 입력해야 합니다.</div></section></div>`}
function employeesView(){let list=db.employees.filter(e=>(!search||[e.name,e.employee_no,e.corporation,e.headquarters,e.department].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())))&&(!filters.corporation||e.corporation===filters.corporation)&&(!filters.department||e.department===filters.department)&&(!filters.status||e.status===filters.status));return `<div class="panel"><div class="toolbar"><input id="employeeSearch" placeholder="성명, 사번, 부서 검색" value="${esc(search)}">${select('fCorp',unique('corporation'),filters.corporation)}${select('fDept',unique('department'),filters.department)}${select('fStatus',['재직','휴직','파견','대기','산재','육아휴직','퇴사'],filters.status)}<button class="btn" onclick="resetFilters()">초기화</button><button class="btn primary" onclick="openEmployee()">+ 신규 인원 등록</button></div><div class="summaryline"><span class="muted">조회 결과 <b>${fmt(list.length)}</b>명 · 전체 ${fmt(db.employees.length)}명</span></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부 / 부서</th><th>직급</th><th>성별</th><th>연령</th><th>입사일</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.slice(0,300).map(e=>`<tr><td>${esc(e.employee_no)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.corporation)}</td><td>${esc(e.headquarters)}<br>${esc(e.department)}</td><td>${esc(e.grade)}</td><td>${esc(e.gender)}</td><td>${displayAge(e)}</td><td>${esc(e.hire_date)}</td><td><span class="pill ${e.status==='퇴사'?'warn':'good'}">${esc(e.status)}</span></td><td><button type="button" class="btn tiny" data-employee-edit="${esc(String(e.id))}">수정</button> <button class="btn tiny" onclick="openPersonal(${hrEmployeeIdArg(e.id)})">연혁</button> ${e.status!=='퇴사'?`<button class="btn tiny danger" onclick="retire(${e.id})">퇴사</button>`:''}</td></tr>`).join('')}</tbody></table></div>${list.length>300?`<div class="hint">조회 결과 중 300명만 표시됩니다. 검색·필터로 좁혀주세요.</div>`:''}</div>`}
function plansView(){let a=plansFor(planYear),ps=planSummary();return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('사업계획 정원',ps.target,'등록 조직 합계')}${card('현재 운영 인원',ps.actual,'등록 조직에 속한 인원')}${card('부족 TO',ps.short,'충원 필요 인원','negative')}${card('초과 TO',ps.extra,'계획 초과 인원','warning')}</div><section class="panel"><div class="toolbar"><button class="btn primary" onclick="openPlan()">+ 사업계획 정원 등록</button><button class="btn" onclick="fillPlanFromCurrent()">현 인원 기준 정원 초안 생성</button></div><div class="hint">같은 연도·법인·본부·부서는 1개의 계획만 등록 가능합니다. '현 인원 기준 정원 초안 생성'은 해당 연도에 아직 계획이 없는 부서만 현재 인원으로 추가합니다.</div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th class="right">계획 인원</th><th class="right">운영 인원</th><th class="right">부족 TO</th><th class="right">초과 TO</th><th>판정</th><th>관리</th></tr></thead><tbody>${a.sort((x,y)=>x.corporation.localeCompare(y.corporation,'ko')||x.department.localeCompare(y.department,'ko')).map(p=>{let n=unitCount(p),short=Math.max(0,p.target-n),extra=Math.max(0,n-p.target);return `<tr><td>${esc(p.corporation)}</td><td>${esc(p.headquarters)}</td><td><b>${esc(p.department)}</b></td><td class="right">${fmt(p.target)}</td><td class="right">${fmt(n)}</td><td class="right ${short?'negative':''}">${short||'-'}</td><td class="right ${extra?'warning':''}">${extra||'-'}</td><td><span class="pill ${short?'warn':'good'}">${short?'충원 필요':extra?'초과':'적정'}</span></td><td><button class="btn tiny" onclick="openPlan(${p.id})">계획 수정</button> <button class="btn tiny primary" onclick="openEmployee(null,'${encodeURIComponent(keyOf(p))}')">충원 등록</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">등록된 사업계획 정원이 없습니다.</td></tr>'}</tbody></table></div></section>`}
function organizationView(){let map=new Map();db.employees.filter(occupied).forEach(e=>{let k=keyOf(e);if(!map.has(k))map.set(k,{...e,total:0,male:0,female:0});let o=map.get(k);o.total++;if(e.gender==='남')o.male++;if(e.gender==='여')o.female++});return `<section class="panel"><h2>부서별 · 성별 운영 인원</h2><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부</th><th>부서</th><th class="right">총인원</th><th class="right">남</th><th class="right">여</th><th>구성</th></tr></thead><tbody>${[...map.values()].sort((a,b)=>b.total-a.total).map(v=>`<tr><td>${esc(v.corporation)}</td><td>${esc(v.headquarters)}</td><td>${esc(v.department)}</td><td class="right"><b>${v.total}</b></td><td class="right">${v.male}</td><td class="right">${v.female}</td><td style="width:18%"><div class="bar"><i style="width:${100*v.male/v.total}%"></i></div></td></tr>`).join('')}</tbody></table></div></section>`}
function historyView(){let e=db.employees.find(x=>String(x.id)===String(historyEmployee));return `<div class="panel"><div class="toolbar"><input id="historySearch" placeholder="사번 또는 성명 검색" value="${esc(search)}"><button class="btn" onclick="searchHistory()">조회</button></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>부서</th><th>상태</th><th>연혁</th></tr></thead><tbody>${db.employees.filter(x=>!search||[x.name,x.employee_no].some(t=>String(t).includes(search))).slice(0,60).map(x=>`<tr><td>${esc(x.employee_no)}</td><td>${esc(x.name)}</td><td>${esc(x.corporation)}</td><td>${esc(x.department)}</td><td>${esc(x.status)}</td><td><button class="btn tiny" onclick="openPersonal(${x.id})">연혁 보기</button></td></tr>`).join('')}</tbody></table></div></div>`}
function auditView(){return `<section class="panel"><h2>최근 변경 기록 (${fmt(db.audit.length)}건)</h2><div class="tablewrap"><table><thead><tr><th>일시</th><th>구분</th><th>내용</th></tr></thead><tbody>${db.audit.slice(0,300).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">변경 기록이 없습니다.</td></tr>'}</tbody></table></div></section>`}
function backupView(){return `<div class="panel"><h2>저장과 복원</h2><p>저장 버튼을 누르면 <b>공동 Supabase DB</b>에 저장합니다. 상단에 공유 저장 완료가 표시되는지 확인하세요.</p><div class="notice">주의: 승인된 3명은 동일한 공동 DB를 이용합니다. 연결이 끊긴 동안의 수정은 저장된 것으로 간주하지 마세요. <b>정기적으로 JSON 백업 파일을 저장</b>해 주세요. 민감한 내용이 포함된 백업 파일의 접근을 제한하세요.</div><div class="toolbar"><button class="btn primary" onclick="save()">현재 내용 저장</button><button class="btn" onclick="downloadJSON()">JSON 전체 백업 내려받기</button><button class="btn" onclick="downloadCSV()">현재 인원 CSV 내려받기</button><button class="btn" onclick="$('#restoreFile').click()">JSON 백업 복원</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreJSON(event)"></div><div class="hint">전체 백업에는 사업계획, 직원 명단, 개인별 연혁, 변경 기록이 모두 포함됩니다. CSV는 인원 명단만 담습니다.</div><p style="margin-top:25px" class="muted">최종 저장: ${esc(db.lastSaved||'최초 실행 상태')}</p></div>`}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalWrap').classList.add('open')}function closeModal(){$('#modalWrap').classList.remove('open')}function field(label,id,value='',type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function get(id){return $('#'+id)?.value.trim()||''}
function legacyOpenEmployee(id=null,encoded=''){let e=db.employees.find(x=>x.id===id)||{};if(encoded){let [corporation,headquarters,department]=decodeURIComponent(encoded).split('␟');e={...e,corporation,headquarters,department}}modal(id?'인원 수정':'신규 생산직 등록',`<div class="formgrid">${field('사번 *','eNo',e.employee_no,'text','required')}${field('성명 *','eName',e.name,'text','required')}${field('법인 *','eCorp',e.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','eHQ',e.headquarters,'text','list="dl-headquarters"')}${field('부서 *','eDept',e.department,'text','list="dl-department"')}${field('직위','ePosition',e.position)}${field('직급','eGrade',e.grade)}<label>성별${select('eGender',['남','여'],e.gender,'선택')}</label>${field('생년월일','eBirth',employeeBirthDate(e)==='—'?'':employeeBirthDate(e),'date')}${field('연령','eAge',e.age||'','number','min="0" max="110"')}${field('입사일','eHire',e.hire_date||today(),'date')}<label>현재 상태${select('eStatus',['재직','휴직','파견','대기','산재','육아휴직','퇴사'],e.status||'재직',null)}</label>${field('학력','eEducation',e.education||'')}${options('corporation')}${options('headquarters')}${options('department')}</div><div class="hint" style="margin-top:15px">부서명이 정원 계획과 완전히 동일해야 해당 TO에 반영됩니다. 상태를 '퇴사'로 변경하면 정원 대비 현재 인원에서 즉시 제외됩니다.</div><div class="modalactions">${id?`<button class="btn danger" onclick="deleteEmployee(${hrEmployeeIdArg(id)})">완전 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveEmployee(${id==null?'null':hrEmployeeIdArg(id)})">저장</button></div>`)}
function legacySaveEmployee(id){let no=get('eNo'),name=get('eName'),corp=get('eCorp'),hq=get('eHQ'),dept=get('eDept');if(!no||!name||!corp||!hq||!dept){alert('사번, 성명, 법인, 본부, 부서를 입력하세요.');return}if(db.employees.some(e=>e.employee_no===no&&e.id!==id)){alert('중복된 사번입니다.');return}let obj={employee_no:no,name,corporation:corp,headquarters:hq,department:dept,position:get('ePosition'),grade:get('eGrade'),gender:get('eGender'),age:get('eAge')?Number(get('eAge')):null,hire_date:get('eHire'),status:get('eStatus'),education:get('eEducation'),field_leader_role:get('eLeader')||'미지정',birth_date:document.getElementById('eBirth')?get('eBirth'):((id?db.employees.find(x=>x.id===id):null)?.birth_date||'')};if(id){let old=db.employees.find(e=>e.id===id);if(!old)return;let prev={...old};Object.assign(old,obj);if(prev.status!==obj.status){if(obj.status==='퇴사')old.exit_date=get('eExitDate')||old.exit_date||today();else if(prev.status==='퇴사')old.exit_date='';if(obj.status==='휴직')old.leave_date=get('eLeaveDate')||old.leave_date||today();else if(prev.status==='휴직')old.leave_date='';}if(prev.status!==obj.status)db.history.unshift({employee_id:id,event_date:obj.status==='퇴사'?(get('eExitDate')||today()):obj.status==='휴직'?(get('eLeaveDate')||today()):today(),event_type:obj.status==='퇴사'?'퇴사':'상태변경',title:obj.status,description:'상태 변경: '+prev.status+' → '+obj.status,department:dept,grade:obj.grade});if(keyOf(prev)!==keyOf(obj))db.history.unshift({employee_id:id,event_date:today(),event_type:'발령',title:'소속 변경',description:prev.department+' → '+dept,department:dept,grade:obj.grade});commit('인원 수정',no+' '+name); }else{let newid=uid();db.employees.push({id:newid,...obj,...(obj.status==='퇴사'?{exit_date:get('eExitDate')||today()}:{}),...(obj.status==='휴직'?{leave_date:get('eLeaveDate')||today()}:{})});db.history.unshift({employee_id:newid,event_date:obj.hire_date||today(),event_type:'입사',title:'입사',description:'인원 신규 등록',department:dept,grade:obj.grade});commit('인원 추가',no+' '+name+' / '+dept)}closeModal()}
function retire(id){let e=db.employees.find(e=>e.id===id);if(!e||!confirm(e.name+'님을 퇴사 처리하시겠습니까?\n개인 정보와 연혁은 보존되며 현재 인원에서는 제외됩니다.'))return;e.status='퇴사';e.exit_date=today();db.history.unshift({employee_id:id,event_date:today(),event_type:'퇴사',title:'퇴사',description:'퇴사 처리',department:e.department,grade:e.grade});commit('퇴사 처리',e.employee_no+' '+e.name)}function deleteEmployee(id){let e=db.employees.find(e=>e.id===id);if(!e||!confirm('완전 삭제 시 개인별 연혁도 사라집니다. 계속하시겠습니까?'))return;db.employees=db.employees.filter(x=>x.id!==id);db.history=db.history.filter(x=>x.employee_id!==id);closeModal();commit('인원 완전 삭제',e.employee_no+' '+e.name)}
function openPlan(id=null){let p=db.plans.find(x=>x.id===id)||{year:planYear};modal(id?'사업계획 정원 수정':'사업계획 정원 등록',`<div class="formgrid">${field('연도 *','pYear',p.year,'number','min="2000" max="2100"')}${field('법인 *','pCorp',p.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','pHQ',p.headquarters,'text','list="dl-headquarters"')}${field('부서 *','pDept',p.department,'text','list="dl-department"')}${field('계획 정원 (명) *','pTarget',p.target??0,'number','min="0" step="1"')}${options('corporation')}${options('headquarters')}${options('department')}</div><div class="modalactions">${id?`<button class="btn danger" onclick="deletePlan(${id})">계획 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="savePlan(${id||'null'})">저장</button></div>`)}
function savePlan(id){let yearValue=Number(get('pYear')),corporation=get('pCorp'),headquarters=get('pHQ'),department=get('pDept'),val=get('pTarget'),target=Number(val);if(!yearValue||!corporation||!headquarters||!department||val===''||!Number.isInteger(target)||target<0){alert('계획 정보를 정확히 입력해 주세요.');return}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yearValue&&p.corporation===corporation&&p.headquarters===headquarters&&p.department===department)){alert('해당 연도·조직의 계획이 이미 존재합니다. 기존 항목을 수정하세요.');return}let o={year:yearValue,corporation,headquarters,department,target};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yearValue;closeModal();commit(id?'정원 수정':'정원 추가',yearValue+' / '+department+' / '+target+'명')}
function deletePlan(id){let p=db.plans.find(p=>p.id===id);if(!p||!confirm('해당 사업계획 정원을 삭제하시겠습니까?'))return;db.plans=db.plans.filter(x=>x.id!==id);closeModal();commit('정원 삭제',p.year+' / '+p.department)}function fillPlanFromCurrent(){let m=new Map();db.employees.filter(occupied).forEach(e=>{let k=keyOf(e);if(!m.has(k))m.set(k,{corporation:e.corporation,headquarters:e.headquarters,department:e.department,n:0});m.get(k).n++});let added=0;for(let p of m.values()){if(!db.plans.some(x=>Number(x.year)===planYear&&keyOf(x)===keyOf(p))){db.plans.push({id:uid(),year:planYear,corporation:p.corporation,headquarters:p.headquarters,department:p.department,target:p.n});added++}}if(added)commit('정원 초안 생성',planYear+'년 / '+added+'개 부서');else alert('추가할 부서가 없습니다.')}
function openPersonal(id){let e=db.employees.find(x=>x.id===id);if(!e)return;let events=db.history.filter(x=>x.employee_id===id).sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date)));modal(e.name+' · 개인별 연혁',`<div class="kpirow"><span><b>사번</b> ${esc(e.employee_no)}</span><span><b>소속</b> ${esc(e.corporation)} / ${esc(e.department)}</span><span><b>상태</b> ${esc(e.status)}</span></div><div class="toolbar" style="margin-top:18px"><button class="btn primary" onclick="openHistoryForm(${id})">+ 연혁 추가</button></div><div class="timeline">${events.map(h=>`<div class="event"><span class="date">${esc(h.event_date)} · ${esc(h.event_type)}</span><b>${esc(h.title)}</b><div class="muted">${esc(h.description)}</div></div>`).join('')||'<p class="muted">등록된 연혁이 없습니다.</p>'}</div><div class="modalactions"><button class="btn" onclick="closeModal()">닫기</button></div>`)}
function openHistoryForm(id){let e=db.employees.find(x=>x.id===id);modal(e.name+' · 연혁 등록',`<div class="formgrid">${field('일자','hDate',today(),'date')}<label>유형${select('hType',['입사','발령','승급','직위변경','휴직','복직','퇴사','교육','포상','기타'],'기타',null)}</label>${field('제목 *','hTitle') }<label class="wide">내용<textarea id="hDesc" rows="4"></textarea></label></div><div class="hint">퇴사에 따라 TO까지 변경하려면 '인원관리 → 퇴사 처리'를 사용하세요. 이 메뉴에서 추가하는 것은 연혁 기록만 반영합니다.</div><div class="modalactions"><button class="btn" onclick="openPersonal(${id})">뒤로</button><button class="btn primary" onclick="saveHistory(${id})">저장</button></div>`)}
function saveHistory(id){let e=db.employees.find(x=>x.id===id),title=get('hTitle');if(!title){alert('제목을 입력하세요.');return}db.history.unshift({employee_id:id,event_date:get('hDate')||today(),event_type:get('hType'),title,description:get('hDesc'),department:e.department,grade:e.grade});commit('연혁 추가',e.employee_no+' '+e.name+' / '+title);openPersonal(id)}function resetFilters(){search='';filters={};render()}function searchHistory(){search=get('historySearch');render()}
function download(name,text,mime){let blob=new Blob(['\ufeff',text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadJSON(){save();download('생산직_인사TO_백업_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}function downloadCSV(){const cols=['employee_no','name','corporation','headquarters','department','position','grade','gender','age','hire_date','status','education'],names=['사번','성명','법인','본부','부서','직위','직급','성별','연령','입사일','상태','학력'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('생산직_인원_'+today()+'.csv',[names,...db.employees.map(e=>cols.map(c=>e[c]))].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function restoreJSON(ev){let f=ev.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.employees)||!Array.isArray(o.plans)||!Array.isArray(o.history)){throw Error('올바른 백업 파일이 아닙니다')}if(!confirm('현재 저장된 내용을 모두 백업 파일로 교체하시겠습니까?'))return;db={employees:o.employees,plans:o.plans,history:o.history,audit:Array.isArray(o.audit)?o.audit:[]};if(!save())return;render();alert('백업을 복원했습니다.')}catch(e){alert('복원 실패: '+e.message)}finally{ev.target.value=''}}

const _oldSaveEmployee=legacySaveEmployee, _oldOpenEmployee=legacyOpenEmployee;

function displayAge(e){if(e.age==null||e.age==='')return '-';return Number(e.age)+year()-Number(e.age_base_year??2026)}
function monthTarget(p,m=planMonth){let n=p.months?.[m-1];return n===undefined||n===null||n===''?Number(p.target||0):Number(n)}
function monthSummary(y=planYear,m=planMonth){let a=plansFor(y),target=0,actual=0,short=0,extra=0;for(const p of a){const t=monthTarget(p,m),n=unitCount(p);target+=t;actual+=n;short+=Math.max(0,t-n);extra+=Math.max(0,n-t)}return {target,actual,short,extra}}
function planSummary(){return monthSummary()}
function monthPicker(){return `<div class="toolbar"><label>기준 월</label><select id="planMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${planMonth===i+1?'selected':''}>${i+1}월</option>`).join('')}</select><span class="hint">현재 인원은 실시간 기준이며, 과거 월말 스냅샷은 제공하지 않습니다.</span></div>`}
const _oldYearPicker=legacyYearPicker;
function yearPicker(){return _oldYearPicker()+monthPicker()}
names.recruitment=['채용 진행관리','채용 요청부터 입사 완료까지 단계별로 기록하며, 실제 등록 시에만 TO가 감소합니다.'];

function plansView(){const a=plansFor(planYear),ps=monthSummary();return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('선택월 계획 정원',ps.target,planYear+'년 '+planMonth+'월')}${card('현재 운영 인원',ps.actual,'정원 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과 합계','warning')}</div><section class="panel"><div class="toolbar"><button class="btn primary" onclick="openPlan()">+ 사업계획 등록</button><button class="btn" onclick="fillPlanFromCurrent()">현재 인원 기준 초안</button><button class="btn" onclick="setView('executive')">경영진 보고</button></div><div class="notice">연간 기본 정원을 입력하고 월별로 조정할 수 있습니다. 월별 미입력 정원은 연간 기본 정원을 적용합니다. 과거 월 인원 실적이 아닌 <b>현재 재직 인원</b>과 비교합니다.</div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th class="right">선택월 계획</th><th class="right">현재 운영</th><th class="right">부족</th><th class="right">초과</th><th>충족률</th><th>관리</th></tr></thead><tbody>${a.sort((x,y)=>x.corporation.localeCompare(y.corporation,'ko')||x.department.localeCompare(y.department,'ko')).map(p=>{let t=monthTarget(p),n=unitCount(p),sh=Math.max(0,t-n),ex=Math.max(0,n-t);return `<tr><td>${esc(p.corporation)}</td><td>${esc(p.headquarters)}</td><td><b>${esc(p.department)}</b></td><td class="right">${fmt(t)}</td><td class="right">${fmt(n)}</td><td class="right negative">${sh||'-'}</td><td class="right warning">${ex||'-'}</td><td>${t?Math.round(n/t*100)+'%':n?'계획 없음':'-'}</td><td><button class="btn tiny" onclick="openPlan(${p.id})">월별 수정</button> <button class="btn tiny primary" onclick="openRecruitment(null,'${encodeURIComponent(keyOf(p))}')">채용 요청</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">해당 연도 정원이 없습니다.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>월별 사업계획 정원 추이</h2><div class="tablewrap"><table><thead><tr><th>월</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}</tr></thead><tbody><tr><td><b>총 계획</b></td>${Array.from({length:12},(_,i)=>`<td>${fmt(a.reduce((v,p)=>v+monthTarget(p,i+1),0))}</td>`).join('')}</tr><tr><td><b>현재 인원 대비 부족</b></td>${Array.from({length:12},(_,i)=>`<td class="negative">${a.reduce((v,p)=>v+Math.max(0,monthTarget(p,i+1)-unitCount(p)),0)}</td>`).join('')}</tr></tbody></table></div></section>`}
function openPlan(id=null){let p=db.plans.find(x=>x.id===id)||{year:planYear,target:0};modal(id?'월별 사업계획 수정':'월별 사업계획 등록',`<div class="formgrid">${field('사업계획 연도 *','pYear',p.year,'number','min="2000" max="2100"')}${field('법인 *','pCorp',p.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','pHQ',p.headquarters,'text','list="dl-headquarters"')}${field('부서 *','pDept',p.department,'text','list="dl-department"')}${field('연간 기본 정원 *','pTarget',p.target??0,'number','min="0" step="1"')}${options('corporation')}${options('headquarters')}${options('department')}</div><h3 style="margin-top:24px">1~12월 계획 인원</h3><div class="month-grid">${Array.from({length:12},(_,i)=>`<label>${i+1}월<input id="pm${i}" type="number" min="0" step="1" placeholder="기본 정원" value="${p.months?.[i]??''}"></label>`).join('')}</div><p class="hint">빈칸은 기본 정원이 자동 적용됩니다. 0을 입력하면 해당 월 계획 인원은 0명입니다.</p><div class="modalactions">${id?`<button class="btn danger" onclick="deletePlan(${id})">계획 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="savePlan(${id||'null'})">저장</button></div>`)}
function savePlan(id){let yr=Number(get('pYear')),corp=get('pCorp'),hq=get('pHQ'),dept=get('pDept'),v=get('pTarget'),t=Number(v);if(!Number.isInteger(yr)||yr<2000||yr>2100||!corp||!hq||!dept||v===''||!Number.isInteger(t)||t<0){alert('연도·조직·기본 정원을 확인하세요.');return}const months=[];for(let i=0;i<12;i++){const x=get('pm'+i);if(x!==''&&(!Number.isInteger(Number(x))||Number(x)<0)){alert(i+1+'월 계획을 확인하세요.');return}months.push(x===''?null:Number(x))}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yr&&keyOf(p)===keyOf({corporation:corp,headquarters:hq,department:dept}))){alert('동일 연도·조직의 계획이 있습니다.');return}const o={year:yr,corporation:corp,headquarters:hq,department:dept,target:t,months};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yr;closeModal();commit('월별 정원 '+(id?'수정':'등록'),yr+' / '+dept)}
function recruitmentView(){const list=db.recruitment.filter(r=>!recruitmentSearch||[r.name,r.department,r.request_no,r.stage].some(x=>String(x||'').includes(recruitmentSearch)));const stages=['채용 요청','공고·모집','서류 검토','면접','합격·입사예정','입사 완료','취소'];const counts=Object.fromEntries(stages.map(x=>[x,db.recruitment.filter(r=>r.stage===x).length]));return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('채용 요청',counts['채용 요청'],'진행 대기')}${card('전형 진행',counts['공고·모집']+counts['서류 검토']+counts['면접'],'모집~면접')}${card('입사 예정',counts['합격·입사예정'],'아직 TO 차감 안 됨')}${card('입사 완료',counts['입사 완료'],'인원 등록 여부 확인')}</div><div class="panel"><div class="toolbar"><input id="recruitSearch" placeholder="지원자·부서·요청번호 검색" value="${esc(recruitmentSearch)}"><button class="btn primary" onclick="openRecruitment()">+ 채용 건 등록</button></div><div class="notice">채용 단계만 변경하면 부족 TO는 바뀌지 않습니다. <b>입사 완료 후 직원으로 등록</b>해야 해당 조직 운영 인원이 증가하면서 부족 TO가 줄어듭니다.</div><div class="tablewrap"><table><thead><tr><th>접수일</th><th>요청번호</th><th>법인 / 부서</th><th>대상자</th><th>진행 단계</th><th>입사 예정일</th><th>메모</th><th>관리</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.request_no)}</td><td>${esc(r.corporation)}<br><b>${esc(r.department)}</b></td><td>${esc(r.name||'미정')}</td><td><span class="status-chip">${esc(r.stage)}</span></td><td>${esc(r.start_date)}</td><td>${esc(r.memo)}</td><td><button class="btn tiny" onclick="openRecruitment(${r.id})">수정</button> ${r.stage!=='입사 완료'?`<button class="btn tiny primary" onclick="hireRecruitment(${r.id})">직원 등록</button>`:''} <button class="btn tiny danger" onclick="deleteRecruitment(${r.id})">삭제</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">등록된 채용 건이 없습니다.</td></tr>'}</tbody></table></div></div>`}
function openRecruitment(id=null,encoded=''){let r=db.recruitment.find(x=>x.id===id)||{stage:'채용 요청',date:today()};if(encoded){let [corporation,headquarters,department]=decodeURIComponent(encoded).split('␟');r={...r,corporation,headquarters,department}}modal(id?'채용 진행 수정':'채용 요청 등록',`<div class="formgrid">${field('채용 요청번호','rNo',r.request_no||'')}${field('접수일','rDate',r.date,'date')}${field('대상자 성명 (미정 가능)','rName',r.name||'')}${field('법인 *','rCorp',r.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','rHQ',r.headquarters,'text','list="dl-headquarters"')}${field('부서 *','rDept',r.department,'text','list="dl-department"')}<label>진행 단계${select('rStage',['채용 요청','공고·모집','서류 검토','면접','합격·입사예정','입사 완료','취소'],r.stage,null)}</label>${field('입사 예정일','rStart',r.start_date||'','date')}<label class="wide">메모<textarea id="rMemo" rows="3">${esc(r.memo||'')}</textarea></label>${options('corporation')}${options('headquarters')}${options('department')}</div><div class="modalactions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveRecruitment(${id||'null'})">저장</button></div>`)}
function saveRecruitment(id){if(!get('rCorp')||!get('rHQ')||!get('rDept')){alert('법인·본부·부서를 입력하세요.');return}const o={request_no:get('rNo'),date:get('rDate'),name:get('rName'),corporation:get('rCorp'),headquarters:get('rHQ'),department:get('rDept'),stage:get('rStage'),start_date:get('rStart'),memo:get('rMemo')};if(id)Object.assign(db.recruitment.find(x=>x.id===id),o);else db.recruitment.unshift({id:uid(),...o});closeModal();commit('채용 진행 '+(id?'수정':'등록'),o.department+' / '+o.stage)}
function deleteRecruitment(id){if(!confirm('해당 채용 건을 삭제할까요?'))return;db.recruitment=db.recruitment.filter(x=>x.id!==id);commit('채용 건 삭제',String(id))}
let currentRecruitId=null;
function hireRecruitment(id){const r=db.recruitment.find(x=>x.id===id);if(!r)return;currentRecruitId=id;openEmployee(null,encodeURIComponent(keyOf(r)));const el=$('#eName');if(el)el.value=r.name||'';if($('#eHire'))$('#eHire').value=r.start_date||today()}

<script>/* Field leader register and organization analytics */

const EXTRA_KEYS=['position','grade','gender','decade','hireYear','education','union_status','field_leader_role','salary_type','employment_type'];
const empExtra={};let empSelected=new Set();
const cleanVal=v=>String(v??'').trim();
function employeeMatches(e){
 const txt=cleanVal(search).toLocaleLowerCase('ko');
 if(txt&&![e.employee_no,e.name,e.corporation,e.headquarters,e.department,e.position,e.grade].some(v=>cleanVal(v).toLocaleLowerCase('ko').includes(txt)))return false;
 if(filters.corporation&&e.corporation!==filters.corporation)return false;
 if(filters.department&&e.department!==filters.department)return false;
 if(filters.status&&e.status!==filters.status)return false;
 for(const k of EXTRA_KEYS){const wanted=empExtra[k];if(!wanted)continue;
  const actual=k==='decade'?(Number.parseInt(displayAge(e),10)>=0?String(Math.floor(Number(displayAge(e))/10)*10):''):k==='hireYear'?String(e.hire_date||'').slice(0,4):k==='employment_type'?String(e.employment_type||((e.position==='사원'||e.grade==='사원')?'계약직':'미확인')):k==='salary_type'?String(e.salary_type||'미지정'):cleanVal(e[k]|| (k==='union_status'?'미확인':k==='field_leader_role'?'미지정':''));
  if(String(actual)!==String(wanted))return false;
 }return true;
}
const EMP_CORP_ORDER=['진합','제이앤드에프','지노스','진우정공'];
const EMP_HQ_ORDER=['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'];
const FASTENER_TEAM_ORDER=['생산1팀(단조)','생산1팀(전조)','생산2팀(열처리)','생산2팀(GEO)'];
function fastenerTeamRank(e){return String(e.headquarters||'').trim()==='화스너생산실'?empRank(String(e.department||'').replace(/\s+/g,''),FASTENER_TEAM_ORDER):0;}
function empRank(value,items){const n=items.indexOf(String(value||'').trim());return n<0?items.length:n;}
function employeePrioritySort(a,b){
 return empRank(a.corporation,EMP_CORP_ORDER)-empRank(b.corporation,EMP_CORP_ORDER)
 ||empRank(a.headquarters,EMP_HQ_ORDER)-empRank(b.headquarters,EMP_HQ_ORDER)
 ||String(a.corporation||'').localeCompare(String(b.corporation||''),'ko')
 ||String(a.headquarters||'').localeCompare(String(b.headquarters||''),'ko')
 ||fastenerTeamRank(a)-fastenerTeamRank(b) ||String(a.name||'').localeCompare(String(b.name||''),'ko',{sensitivity:'base'})
 ||String(a.employee_no||'').localeCompare(String(b.employee_no||''),'ko',{numeric:true});
}
// Date ascending; ties follow the existing corporation, headquarters, fastener team and name ranking.
// Missing/invalid dates appear after dated records in the former-worker directory.
function dateFirstEmployeeSort(a,b,kind){
 const raw=x=>kind==='exit'?exitDate(x):String(x.hire_date||'');
 const norm=x=>/^\d{4}-\d{2}-\d{2}$/.test(raw(x))?raw(x):'9999-99-99';
 return norm(a).localeCompare(norm(b))||employeePrioritySort(a,b);
}
function filteredEmployees(){return db.employees.filter(employeeMatches).sort(employeePrioritySort)}

function extraChoices(key){if(key==='decade')return ['10','20','30','40','50','60','70','80'];if(key==='hireYear')return [...new Set(db.employees.map(e=>String(e.hire_date||'').slice(0,4)).filter(v=>/^\d{4}$/.test(v)))].sort((a,b)=>b.localeCompare(a));if(key==='union_status')return ['가입','미가입','미확인'];if(key==='field_leader_role')return ['그룹장','파트장','라인장','미지정'];if(key==='gender')return ['남','여'];if(key==='salary_type')return ['월급','시급','미지정'];if(key==='employment_type')return ['정규직','계약직','미확인'];return [...new Set(db.employees.map(e=>cleanVal(e[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}
const empLabels={position:'직위',grade:'직급',gender:'성별',decade:'연령대',hireYear:'입사연도',education:'학력',union_status:'노조 가입 여부',field_leader_role:'현장관리자',salary_type:'급여 형태',employment_type:'고용형태'};
// Display only date of birth, never the underlying national identity number.
function hrEmployeeIdArg(id){return JSON.stringify(id).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function employeeBirthDate(employee){
 const e=employee||{};
 const direct=[e.birth_date,e.birthdate,e.date_of_birth,e.dob,e.birthDate,e['생년월일']];
 for(const item of direct){
  const str=String(item??'').trim();
  const match=str.match(/^(\d{4})[-./]?(\d{2})[-./]?(\d{2})$/);
  if(match){const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]);
   const dt=new Date(Date.UTC(y,m-1,d));
   if(y>=1900&&y<=new Date().getFullYear()&&dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d)return `${match[1]}-${match[2]}-${match[3]}`;
  }
 }
 const sources=[e.rrn,e.resident_no,e.resident_number,e.resident_registration_number,e.residentRegistrationNumber,e.jumin,e.jumin_no,e.ssn,e['주민등록번호'],e['주민번호']];
 for(const raw of sources){
  const value=String(raw??'').replace(/[^0-9]/g,'');
  if(value.length<7)continue;
  const prefix=value.slice(0,6),code=value[6];
  const century=({'1':1900,'2':1900,'5':1900,'6':1900,'3':2000,'4':2000,'7':2000,'8':2000,'9':1800,'0':1800})[code];
  if(century==null)continue;
  const yy=Number(prefix.slice(0,2)),m=Number(prefix.slice(2,4)),d=Number(prefix.slice(4,6)),y=century+yy;
  const dt=new Date(Date.UTC(y,m-1,d));
  if(y>new Date().getFullYear()||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)continue;
  return `${y}-${prefix.slice(2,4)}-${prefix.slice(4,6)}`;
 }
 return '—';
}

(function(){
 const priorOpenEmployee=openEmployee;

  wrap.id='employmentStatusDates';
  wrap.style.cssText='grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px';
  wrap.innerHTML='<label id="exitDateLabel"><span><span style="color:#c2410c">* </span>퇴사일</span><input id="eExitDate" type="date" style="width:100%"></label><label id="leaveDateLabel">휴직 시작일 <span style="color:#c2410c">*</span><input id="eLeaveDate" type="date" style="width:100%"></label>';
  status.closest('label').insertAdjacentElement('afterend',wrap);
  document.getElementById('eExitDate').value=person?.exit_date||'';
  document.getElementById('eLeaveDate').value=person?.leave_date||'';
  const refresh=()=>{const st=status.value;document.getElementById('exitDateLabel').style.display=st==='퇴사'?'flex':'none';document.getElementById('leaveDateLabel').style.display=st==='휴직'?'block':'none';};
  status.addEventListener('change',refresh);refresh();
 };
 const priorSaveEmployee=saveEmployee;
 saveEmployee=function(id){
  const st=document.getElementById('eStatus')?.value;
  const dateId=st==='퇴사'?'eExitDate':st==='휴직'?'eLeaveDate':null;
  const effective=dateId?document.getElementById(dateId)?.value:'';
  if(dateId&&!effective){alert(st==='퇴사'?'퇴사일을 선택한 후 저장해 주세요.':'휴직 시작일을 선택한 후 저장해 주세요.');document.getElementById(dateId)?.focus();return;}
  const employee=id?db.employees.find(e=>String(e.id)===String(id)):null;
  const oldStatus=employee?.status;
  const oldDate=employee?(st==='퇴사'?employee.exit_date:st==='휴직'?employee.leave_date:''):'';
  const before=db.employees.length;
  priorSaveEmployee(id);
  const target=id?db.employees.find(e=>String(e.id)===String(id)):(db.employees.length>before?db.employees.at(-1):null);
  if(!target||!dateId)return;
  const attr=st==='퇴사'?'exit_date':'leave_date';
  const changed=target[attr]!==effective;
  target[attr]=effective;
  // Previous wrappers may already have persisted the record, so persist effective date explicitly.

   const h=(db.history||[]).find(x=>String(x.employee_id)===String(target.id)&&((st==='퇴사'&&x.event_type==='퇴사')||(st==='휴직'&&x.title==='휴직')));
   if(h&&oldStatus!==st)h.event_date=effective;

   save();render();
  }
 };
})();

<script>
/* Parental leave period is separate from general leave and exit dates. */
(function(){
 const previousOpen=openEmployee;
 openEmployee=function(id=null,encoded=''){
   previousOpen(id,encoded);
   const status=document.getElementById('eStatus');
   const dateRow=document.getElementById('employmentStatusDates');
   if(!status||!dateRow)return;
   let parental=document.getElementById('parentalLeavePeriod');
   if(!parental){
     parental=document.createElement('div');
     parental.id='parentalLeavePeriod';
     parental.style.cssText='grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;min-width:0';
     parental.innerHTML='<label style="display:flex;flex-direction:column;gap:6px;min-width:0"><span><span style="color:#c2410c">* </span>육아휴직 시작일</span><input type="date" id="eParentalStart" style="width:100%;min-width:0;box-sizing:border-box" /></label><label style="display:flex;flex-direction:column;gap:6px;min-width:0"><span><span style="color:#c2410c">* </span>육아휴직 종료일</span><input type="date" id="eParentalEnd" style="width:100%;min-width:0;box-sizing:border-box" /></label>';
     dateRow.insertAdjacentElement('afterend',parental);
   }
   const person=id?(db.employees||[]).find(x=>String(x.id)===String(id)):null;
   document.getElementById('eParentalStart').value=person?.parental_leave_start_date||'';
   document.getElementById('eParentalEnd').value=person?.parental_leave_end_date||'';
   function showPeriod(){
     const isParental=status.value==='육아휴직';
     parental.style.display=isParental?'grid':'none';
     if(isParental)dateRow.style.display='none';
   }
   status.addEventListener('change',showPeriod);
   showPeriod();
 };
 const previousSave=saveEmployee;
 saveEmployee=function(id){
   const st=document.getElementById('eStatus')?.value;
   if(st!=='육아휴직')return previousSave(id);
   const start=document.getElementById('eParentalStart')?.value||'';
   const end=document.getElementById('eParentalEnd')?.value||'';
   if(!start||!end){alert('육아휴직 시작일과 종료일을 모두 선택해 주세요.');return;}
   if(start>end){alert('육아휴직 종료일은 시작일 이후여야 합니다.');return;}
   const beforeCount=(db.employees||[]).length;
   const old=id?(db.employees||[]).find(x=>String(x.id)===String(id)):null;

   target.parental_leave_end_date=end;

<script>
/* Cascading organization selectors: company -> headquarters -> department.
   Uses existing employee / plan / recruitment organizations; no DB schema change. */
(function(){
 'use strict';
 const extra = [{corporation:'지노스',headquarters:'표면처리사업부',department:'(표면)연구개발팀'},
                {corporation:'지노스',headquarters:'표면처리사업부',department:'생산/기술팀'}];
 const corpOrder=['진합','제이앤드에프','지노스','진우정공'];
 const hqOrder=['화스너생산실','정밀부품생산실','생산운영실','생산기술실','품질본부','연구개발본부','통합구매실','사업개발실','상생안전본부','상생안전본부 부','노동조합','표면처리사업부','대화공장','옥천공장','U볼트사업부문'];
 const sortBy=(values,order)=>[...new Set(values.filter(Boolean))].sort((a,b)=>{
   const ia=order.indexOf(a),ib=order.indexOf(b);
   return (ia<0?999:ia)-(ib<0?999:ib)||String(a).localeCompare(String(b),'ko');
 });
 function orgRows(){
   const rows=[...(db.employees||[]),...(db.plans||[]),...(db.recruitment||[]),...extra];
   for(const r of (db.reference_master||[])){if(r.active===false)continue;if(r.type==='department'&&r.corporation&&r.headquarters)rows.push({corporation:r.corporation,headquarters:r.headquarters,department:r.value});}
   return rows.filter(r=>r&&r.corporation&&r.headquarters&&r.department);
 }
 function listCorps(){return sortBy([...orgRows().map(x=>x.corporation),...(window.__hrMasterCandidates?.('corporation')||[])],corpOrder)}
 function listHq(c){return sortBy([...orgRows().filter(x=>x.corporation===c).map(x=>x.headquarters),...(window.__hrMasterCandidates?.('headquarters',c)||[])],hqOrder)}
 function listDept(c,h){return sortBy([...orgRows().filter(x=>x.corporation===c&&x.headquarters===h).map(x=>x.department),...(window.__hrMasterCandidates?.('department',c,h)||[])],[])}
 function populate(el,choices,value,placeholder){
   el.replaceChildren();
   const opt=document.createElement('option');opt.value='';opt.textContent=placeholder;el.append(opt);
   for(const choice of choices){const item=document.createElement('option');item.value=choice;item.textContent=choice;el.append(item)}
   el.value=choices.includes(value)?value:'';
 }
 function linked(c,h,d,settings={}){
   if(!c||!h||!d)return;
   const original={c:c.value,h:h.value,d:d.value};
   for(const el of [c,h,d]){
     // datalist free text is replaced with exact organization selectors in recruitment only.
     if(settings.convert && el.tagName==='INPUT'){
       const replacement=document.createElement('select');replacement.id=el.id;
       replacement.className=el.className;
       replacement.required=true;
       el.replaceWith(replacement);
       if(el===c)c=replacement;else if(el===h)h=replacement;else d=replacement;
     }
   }
   const corp=()=>c.value;
   const head=()=>h.value;
   function updateHQ(reset){populate(h,listHq(corp()),reset?'':original.h,'본부/실 선택');updateDept(reset)}
   function updateDept(reset){populate(d,listDept(corp(),head()),reset?'':original.d,'부서 선택')}
   populate(c,listCorps(),original.c,'법인 선택');
   updateHQ(false);
   c.addEventListener('change',()=>{original.h='';original.d='';updateHQ(true)});
   h.addEventListener('change',()=>{original.d='';updateDept(true)});
   return {valid:()=>!!corp()&&listHq(corp()).includes(head())&&listDept(corp(),head()).includes(d.value)};
 }
 const originalOpen=window.openRecruitment;
 if(typeof originalOpen==='function'){
   window.openRecruitment=function(...args){
     originalOpen(...args);
     const c=document.getElementById('rCorp'),h=document.getElementById('rHQ'),d=document.getElementById('rDept');
     if(!c||!h||!d)return;
     window.__recruitOrgCascade=linked(c,h,d,{convert:true});
   };
 }
 const originalSave=window.saveRecruitment;
 if(typeof originalSave==='function'){
   window.saveRecruitment=function(...args){
     if(window.__recruitOrgCascade&&!window.__recruitOrgCascade.valid()){
       alert('선택한 법인에 속한 본부/실과 부서를 순서대로 선택하세요.');return;
     }
     return originalSave(...args);
   };
 }
 // Other linked filters should follow the same corporation -> organizational hierarchy.
 // Existing employee and bulk transfer filters already scope their options by corporation.
 window.__hrOrgOptions={corporations:listCorps,headquarters:listHq,departments:listDept};
})();
</script>
