<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생산직 인사 · TO 관리</title>
<style>
:root{--navy:#101d38;--blue:#2563eb;--light:#f3f6fa;--line:#e1e7ef;--muted:#64748b;--good:#067647;--bad:#c24135}*{box-sizing:border-box}body{margin:0;background:var(--light);font-family: 'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;color:#17243b;font-size:14px}.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:var(--navy);color:#e5edf9;padding:28px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:19px;font-weight:800;margin:0 8px 7px}.subtitle{color:#91a3c1;font-size:12px;margin:0 8px 33px}.nav{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#aabbd5;border-radius:10px;padding:14px 15px;text-align:left;width:100%;font:inherit;cursor:pointer;margin:4px 0}.nav.active,.nav:hover{background:#263e68;color:white}.sidefoot{position:absolute;bottom:24px;left:25px;color:#aabbd5;line-height:1.7;font-size:11px}.main{flex:1;min-width:0;padding:29px 36px 60px;max-width:1700px;margin:auto}.top{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:27px;letter-spacing:-1px}.desc{color:var(--muted);margin:8px 0 0}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{border:1px solid #cbd5e1;background:white;color:#243451;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--bad);border-color:#f5c5c0}.btn.tiny{padding:6px 9px;font-size:12px}.btn:hover{filter:brightness(.95)}.pill{border-radius:50px;background:#e8f0ff;color:#1d4ed8;padding:5px 10px;font-size:12px;font-weight:700}.pill.warn{background:#fff0e5;color:#b45309}.pill.good{background:#dcfce7;color:#166534}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:18px 0 22px}.card,.panel{border:1px solid var(--line);background:white;border-radius:14px;box-shadow:0 2px 8px #12233d08}.card{padding:20px}.card .label{font-size:13px;color:var(--muted)}.card .num{font-size:32px;font-weight:800;margin:11px 0 6px;letter-spacing:-1px}.card .note{font-size:12px;color:var(--muted)}.panel{padding:21px;margin-bottom:17px}.panel h2{font-size:18px;margin:0 0 15px}.section{display:grid;grid-template-columns:1.2fr .8fr;gap:17px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 15px}.field,input,select,textarea{font:inherit}input,select,textarea{min-width:0;padding:10px 11px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e293b}input:focus,select:focus,textarea:focus{outline:2px solid #a5c3ff;border-color:#2563eb}.toolbar input{width:220px}.toolbar select{max-width:190px}.tablewrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;min-width:630px;text-align:left}th{background:#f7f9fc;color:#65758b;font-size:12px;font-weight:800;white-space:nowrap}td,th{padding:12px 11px;border-bottom:1px solid #edf0f5}td{font-size:13px}tr:last-child td{border-bottom:0}tr:hover td{background:#f9fbfe}.right{text-align:right}.bar{height:9px;background:#e9eef7;border-radius:20px;overflow:hidden;min-width:75px}.bar i{display:block;background:#4580e9;height:100%;border-radius:20px}.muted{color:var(--muted)}.positive{color:var(--good);font-weight:800}.negative{color:var(--bad);font-weight:800}.warning{color:#ba6a07;font-weight:800}.empty{padding:25px;color:var(--muted);text-align:center}.hint{font-size:12px;color:var(--muted);line-height:1.65}.notice{background:#eff6ff;padding:12px 15px;border:1px solid #cfe0ff;border-radius:10px;color:#234b7f;line-height:1.7;margin:12px 0}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.formgrid label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#586982;font-weight:700}.formgrid label.wide{grid-column:span 3}.modalwrap{position:fixed;inset:0;background:#12203ba8;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modalwrap.open{display:flex}.modal{background:white;border-radius:16px;padding:25px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #07182c50}.modal h2{margin:0 0 18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.small{font-size:12px}.timeline{border-left:2px solid #dce8fb;margin:20px 0 20px 9px;padding-left:19px}.event{position:relative;margin-bottom:21px}.event:before{content:"";width:10px;height:10px;border-radius:50%;background:#3576e8;position:absolute;left:-25px;top:3px}.event .date{font-size:12px;color:var(--muted)}.event b{display:block;margin:5px 0}.summaryline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.kpirow{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.kpirow strong{font-size:20px}.hidden{display:none!important}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.section{grid-template-columns:1fr}.main{padding:24px}}@media(max-width:720px){.shell{display:block}.sidebar{width:100%;height:auto;position:static;padding:14px}.brand{font-size:16px}.subtitle,.sidefoot{display:none}.navs{display:flex;overflow:auto}.nav{white-space:nowrap;padding:9px 10px;font-size:12px}.main{padding:18px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid label.wide{grid-column:span 1}.toolbar input{width:100%}}
@media print{.sidebar,.top .actions,.navs,.toolbar,.btn,.modalwrap,.no-print{display:none!important}.main{padding:0!important;max-width:none!important}.panel,.card{box-shadow:none!important;break-inside:avoid}.shell{display:block}.top{margin-bottom:12px}body{background:white}@page{size:A4 landscape;margin:12mm}}.month-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.month-grid label{font-size:12px;display:flex;flex-direction:column;gap:5px}.month-grid input{width:100%}.report-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.smallcaps{font-size:11px;letter-spacing:1.4px;color:#64748b;font-weight:800}.status-chip{display:inline-block;border-radius:20px;padding:4px 9px;background:#edf2fb;color:#244876;font-weight:700;font-size:12px}@media(max-width:840px){.month-grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">생산직 인사관리</div><div class="subtitle">WORKFORCE · TO CONTROL</div><div class="navs"><button class="nav active" data-view="dashboard">▣ 대시보드</button><button class="nav" data-view="employees">♙ 생산직 인원관리</button><button class="nav" data-view="plans">▤ 사업계획 정원 · TO</button><button class="nav" data-view="recruitment">▦ 채용 진행관리</button><button class="nav" data-view="executive">▣ 경영진 보고서</button><button class="nav" data-view="organization">◫ 부서별 · 성별</button><button class="nav" data-view="history">◷ 개인별 연혁</button><button class="nav" data-view="audit">≡ 변경 기록</button><button class="nav" data-view="backup">⇩ 저장 · 백업</button></div><div class="sidefoot">개인용 · 단일 HTML<br>현재 브라우저 저장소에 보관</div></aside><main class="main"><div class="top"><div><h1 id="heading">대시보드</h1><div class="desc" id="subheading">생산직 인력 운영 현황을 한눈에 확인하세요.</div></div><div class="actions"><span class="pill" id="saveBadge">저장 상태 확인 중</span><button class="btn primary" id="saveNow">현재 내용 저장</button></div></div><div id="content"></div></main></div><div class="modalwrap" id="modalWrap"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>const SEED={employees:[],plans:[],history:[],audit:[],recruitment:[],snapshots:[],settings:{retirementAge:60}};
const KEY='production-hr-single-html-v1';const today=()=>new Date().toISOString().slice(0,10);const year=()=>new Date().getFullYear();const $=s=>document.querySelector(s);const fmt=n=>Number(n||0).toLocaleString('ko-KR');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.floor(Date.now()*1000+Math.random()*1000);const occupied=e=>e.status!=='퇴사';const keyOf=x=>[x.corporation||'',x.headquarters||'',x.department||''].join('␟');
let db=structuredClone(SEED),view='dashboard',search='',filters={},planYear=year(),historyEmployee='';for(const k of ['employees','plans','history','audit'])db[k]??=[]; db.plans.forEach(p=>p.year=Number(p.year));
function save(){db.lastSaved=new Date().toLocaleString('ko-KR');$('#saveBadge').textContent='공유 저장 확인 중';$('#saveBadge').className='pill warn';return true}
function commit(action,detail){db.audit.unshift({id:uid(),date:new Date().toLocaleString('ko-KR'),action,detail});db.audit=db.audit.slice(0,2000);save();render()}
function plansFor(y){return db.plans.filter(p=>Number(p.year)===Number(y))}function unitCount(p){return db.employees.filter(e=>occupied(e)&&e.corporation===p.corporation&&e.headquarters===p.headquarters&&e.department===p.department).length}function planSummary(){let a=plansFor(planYear);return {target:a.reduce((s,p)=>s+Number(p.target||0),0),actual:a.reduce((s,p)=>s+unitCount(p),0),short:a.reduce((s,p)=>s+Math.max(0,Number(p.target||0)-unitCount(p)),0),extra:a.reduce((s,p)=>s+Math.max(0,unitCount(p)-Number(p.target||0)),0)}}
function card(label,num,note,cl=''){return `<div class="card"><div class="label">${label}</div><div class="num ${cl}">${fmt(num)}</div><div class="note">${note}</div></div>`}function summaryCards(){const active=db.employees.filter(occupied),ret=db.employees.length-active.length,ps=planSummary();return `<div class="cards">${card('현재 운영 인원',active.length,'재직·휴직 포함')}${card('사업계획 정원',ps.target,planYear+'년 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족분의 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과분의 합계','warning')}${card('퇴사 누계',ret,'등록된 전체 퇴사 인원')}</div>`}
function select(name,opts,val='',empty='전체'){return `<select id="${name}">${empty!==null?`<option value="">${empty}</option>`:''}${opts.map(x=>`<option value="${esc(x)}" ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function unique(field){return [...new Set(db.employees.map(e=>e[field]||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}function options(field,val=''){return `<datalist id="dl-${field}">${unique(field).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`}function heading(s){return `<div class="summaryline"><strong>${s}</strong></div>`}
const names={dashboard:['대시보드','전체 인원과 사업계획 대비 TO를 즉시 확인합니다.'],employees:['생산직 인원관리','인원 추가·수정·퇴사 처리 시 정원 현황이 함께 갱신됩니다.'],plans:['사업계획 정원 · TO','연도·법인·본부·부서별 정원을 지정하고 충원 현황을 관리합니다.'],organization:['부서별 · 성별','생산직 운영 인원 구성 및 부서 현황을 조회합니다.'],history:['개인별 연혁','직원별 입사·이동·승급·퇴사 등을 누적 관리합니다.'],audit:['변경 기록','인원 및 사업계획 변경 내역을 확인합니다.'],backup:['저장 · 백업','현재 내용은 이 브라우저에 저장됩니다. 정기적인 백업을 권장합니다.']};
function setView(v){view=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render()}
function render(){const [h,d]=names[view];$('#heading').textContent=h;$('#subheading').textContent=d;$('#saveBadge').textContent=db.lastSaved?'저장됨 · '+db.lastSaved:'초기 명단 · 아직 변경 없음';$('#content').innerHTML=({dashboard:dashboard,employees:employeesView,plans:plansView,organization:organizationView,history:historyView,audit:auditView,backup:backupView}[view])()}
function legacyYearPicker(){return `<div class="toolbar"><label>사업계획 연도</label><input id="planYear" type="number" min="2000" max="2100" value="${planYear}" style="width:115px"><span class="hint">연도별 정원은 별도로 관리됩니다.</span></div>`}
function dashboard(){let a=plansFor(planYear).map(p=>({...p,actual:unitCount(p)})).sort((a,b)=>(monthTarget(b)-b.actual)-(monthTarget(a)-a.actual));let corps={};db.employees.filter(occupied).forEach(e=>{let k=e.corporation||'미지정';corps[k]=(corps[k]||0)+1});const max=Math.max(1,...Object.values(corps));return yearPicker()+summaryCards()+`<div class="notice"><b>TO 산정 기준</b> · 현재 운영 인원은 '재직'과 '휴직'을 포함하며, '퇴사'는 제외합니다. 부족 TO는 <b>부서별 max(사업계획 정원 − 운영 인원, 0)</b>을 합산합니다. 계획 미등록 부서는 부족 TO에 포함되지 않습니다.</div><div class="section"><section class="panel"><h2>부족 TO 우선 확인</h2>${a.length?`<div class="tablewrap"><table><thead><tr><th>법인 / 본부 / 부서</th><th class="right">계획</th><th class="right">현재</th><th class="right">부족 / 초과</th><th>충원</th></tr></thead><tbody>${a.slice(0,12).map(p=>`<tr><td>${esc(p.corporation)} · ${esc(p.headquarters)}<br><b>${esc(p.department)}</b></td><td class="right">${fmt(monthTarget(p))}</td><td class="right">${fmt(p.actual)}</td><td class="right ${monthTarget(p)>p.actual?'negative':monthTarget(p)<p.actual?'warning':'positive'}">${monthTarget(p)>p.actual?'-'+(monthTarget(p)-p.actual):monthTarget(p)<p.actual?'+'+(p.actual-monthTarget(p)):'일치'}</td><td><button class="btn tiny primary" onclick="openEmployee(null,'${encodeURIComponent(keyOf(p))}')">인원 등록</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">아직 ${planYear}년 사업계획 인원이 없습니다.<br><br><button class="btn primary" onclick="setView('plans')">사업계획 정원 입력하기</button></div>`}</section><section class="panel"><h2>법인별 운영 인원</h2>${Object.entries(corps).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="margin:17px 0"><div class="summaryline" style="justify-content:space-between;margin-bottom:7px"><b>${esc(n)}</b><b>${fmt(v)}명</b></div><div class="bar"><i style="width:${100*v/max}%"></i></div></div>`).join('')}<div class="hint">※ 최초 데이터에는 사업계획 정원이 없으므로 직접 입력해야 합니다.</div></section></div>`}
function employeesView(){let list=db.employees.filter(e=>(!search||[e.name,e.employee_no,e.corporation,e.headquarters,e.department].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())))&&(!filters.corporation||e.corporation===filters.corporation)&&(!filters.department||e.department===filters.department)&&(!filters.status||e.status===filters.status));return `<div class="panel"><div class="toolbar"><input id="employeeSearch" placeholder="성명, 사번, 부서 검색" value="${esc(search)}">${select('fCorp',unique('corporation'),filters.corporation)}${select('fDept',unique('department'),filters.department)}${select('fStatus',['재직','휴직','퇴사'],filters.status)}<button class="btn" onclick="resetFilters()">초기화</button><button class="btn primary" onclick="openEmployee()">+ 신규 인원 등록</button></div><div class="summaryline"><span class="muted">조회 결과 <b>${fmt(list.length)}</b>명 · 전체 ${fmt(db.employees.length)}명</span></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부 / 부서</th><th>직급</th><th>성별</th><th>연령</th><th>입사일</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.slice(0,300).map(e=>`<tr><td>${esc(e.employee_no)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.corporation)}</td><td>${esc(e.headquarters)}<br>${esc(e.department)}</td><td>${esc(e.grade)}</td><td>${esc(e.gender)}</td><td>${displayAge(e)}</td><td>${esc(e.hire_date)}</td><td><span class="pill ${e.status==='퇴사'?'warn':'good'}">${esc(e.status)}</span></td><td><button class="btn tiny" onclick="openEmployee(${e.id})">수정</button> <button class="btn tiny" onclick="openPersonal(${e.id})">연혁</button> ${e.status!=='퇴사'?`<button class="btn tiny danger" onclick="retire(${e.id})">퇴사</button>`:''}</td></tr>`).join('')}</tbody></table></div>${list.length>300?`<div class="hint">조회 결과 중 300명만 표시됩니다. 검색·필터로 좁혀주세요.</div>`:''}</div>`}
function plansView(){let a=plansFor(planYear),ps=planSummary();return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('사업계획 정원',ps.target,'등록 조직 합계')}${card('현재 운영 인원',ps.actual,'등록 조직에 속한 인원')}${card('부족 TO',ps.short,'충원 필요 인원','negative')}${card('초과 TO',ps.extra,'계획 초과 인원','warning')}</div><section class="panel"><div class="toolbar"><button class="btn primary" onclick="openPlan()">+ 사업계획 정원 등록</button><button class="btn" onclick="fillPlanFromCurrent()">현 인원 기준 정원 초안 생성</button></div><div class="hint">같은 연도·법인·본부·부서는 1개의 계획만 등록 가능합니다. '현 인원 기준 정원 초안 생성'은 해당 연도에 아직 계획이 없는 부서만 현재 인원으로 추가합니다.</div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th class="right">계획 인원</th><th class="right">운영 인원</th><th class="right">부족 TO</th><th class="right">초과 TO</th><th>판정</th><th>관리</th></tr></thead><tbody>${a.sort((x,y)=>x.corporation.localeCompare(y.corporation,'ko')||x.department.localeCompare(y.department,'ko')).map(p=>{let n=unitCount(p),short=Math.max(0,p.target-n),extra=Math.max(0,n-p.target);return `<tr><td>${esc(p.corporation)}</td><td>${esc(p.headquarters)}</td><td><b>${esc(p.department)}</b></td><td class="right">${fmt(p.target)}</td><td class="right">${fmt(n)}</td><td class="right ${short?'negative':''}">${short||'-'}</td><td class="right ${extra?'warning':''}">${extra||'-'}</td><td><span class="pill ${short?'warn':'good'}">${short?'충원 필요':extra?'초과':'적정'}</span></td><td><button class="btn tiny" onclick="openPlan(${p.id})">계획 수정</button> <button class="btn tiny primary" onclick="openEmployee(null,'${encodeURIComponent(keyOf(p))}')">충원 등록</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">등록된 사업계획 정원이 없습니다.</td></tr>'}</tbody></table></div></section>`}
function organizationView(){let map=new Map();db.employees.filter(occupied).forEach(e=>{let k=keyOf(e);if(!map.has(k))map.set(k,{...e,total:0,male:0,female:0});let o=map.get(k);o.total++;if(e.gender==='남')o.male++;if(e.gender==='여')o.female++});return `<section class="panel"><h2>부서별 · 성별 운영 인원</h2><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부</th><th>부서</th><th class="right">총인원</th><th class="right">남</th><th class="right">여</th><th>구성</th></tr></thead><tbody>${[...map.values()].sort((a,b)=>b.total-a.total).map(v=>`<tr><td>${esc(v.corporation)}</td><td>${esc(v.headquarters)}</td><td>${esc(v.department)}</td><td class="right"><b>${v.total}</b></td><td class="right">${v.male}</td><td class="right">${v.female}</td><td style="width:18%"><div class="bar"><i style="width:${100*v.male/v.total}%"></i></div></td></tr>`).join('')}</tbody></table></div></section>`}
function historyView(){let e=db.employees.find(x=>String(x.id)===String(historyEmployee));return `<div class="panel"><div class="toolbar"><input id="historySearch" placeholder="사번 또는 성명 검색" value="${esc(search)}"><button class="btn" onclick="searchHistory()">조회</button></div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>부서</th><th>상태</th><th>연혁</th></tr></thead><tbody>${db.employees.filter(x=>!search||[x.name,x.employee_no].some(t=>String(t).includes(search))).slice(0,60).map(x=>`<tr><td>${esc(x.employee_no)}</td><td>${esc(x.name)}</td><td>${esc(x.corporation)}</td><td>${esc(x.department)}</td><td>${esc(x.status)}</td><td><button class="btn tiny" onclick="openPersonal(${x.id})">연혁 보기</button></td></tr>`).join('')}</tbody></table></div></div>`}

function backupView(){return `<div class="panel"><h2>저장과 복원</h2><p>저장 버튼을 누르면 <b>공동 Supabase DB</b>에 저장합니다. 상단에 공유 저장 완료가 표시되는지 확인하세요.</p><div class="notice">주의: 승인된 3명은 동일한 공동 DB를 이용합니다. 연결이 끊긴 동안의 수정은 저장된 것으로 간주하지 마세요. <b>정기적으로 JSON 백업 파일을 저장</b>해 주세요. 민감한 내용이 포함된 백업 파일의 접근을 제한하세요.</div><div class="toolbar"><button class="btn primary" onclick="save()">현재 내용 저장</button><button class="btn" onclick="downloadJSON()">JSON 전체 백업 내려받기</button><button class="btn" onclick="downloadCSV()">현재 인원 CSV 내려받기</button><button class="btn" onclick="$('#restoreFile').click()">JSON 백업 복원</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreJSON(event)"></div><div class="hint">전체 백업에는 사업계획, 직원 명단, 개인별 연혁, 변경 기록이 모두 포함됩니다. CSV는 인원 명단만 담습니다.</div><p style="margin-top:25px" class="muted">최종 저장: ${esc(db.lastSaved||'최초 실행 상태')}</p></div>`}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalWrap').classList.add('open')}function closeModal(){$('#modalWrap').classList.remove('open')}function field(label,id,value='',type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function get(id){return $('#'+id)?.value.trim()||''}
function legacyOpenEmployee(id=null,encoded=''){let e=db.employees.find(x=>x.id===id)||{};if(encoded){let [corporation,headquarters,department]=decodeURIComponent(encoded).split('␟');e={...e,corporation,headquarters,department}}modal(id?'인원 수정':'신규 생산직 등록',`<div class="formgrid">${field('사번 *','eNo',e.employee_no,'text','required')}${field('성명 *','eName',e.name,'text','required')}${field('법인 *','eCorp',e.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','eHQ',e.headquarters,'text','list="dl-headquarters"')}${field('부서 *','eDept',e.department,'text','list="dl-department"')}${field('직위','ePosition',e.position)}${field('직급','eGrade',e.grade)}<label>성별${select('eGender',['남','여'],e.gender,'선택')}</label>${field('연령','eAge',e.age||'','number','min="0" max="110"')}${field('입사일','eHire',e.hire_date||today(),'date')}<label>현재 상태${select('eStatus',['재직','휴직','퇴사'],e.status||'재직',null)}</label>${field('학력','eEducation',e.education||'')}${options('corporation')}${options('headquarters')}${options('department')}</div><div class="hint" style="margin-top:15px">부서명이 정원 계획과 완전히 동일해야 해당 TO에 반영됩니다. 상태를 '퇴사'로 변경하면 정원 대비 현재 인원에서 즉시 제외됩니다.</div><div class="modalactions">${id?`<button class="btn danger" onclick="deleteEmployee(${id})">완전 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveEmployee(${id||'null'})">저장</button></div>`)}
function legacySaveEmployee(id){let no=get('eNo'),name=get('eName'),corp=get('eCorp'),hq=get('eHQ'),dept=get('eDept');if(!no||!name||!corp||!hq||!dept){alert('사번, 성명, 법인, 본부, 부서를 입력하세요.');return}if(db.employees.some(e=>e.employee_no===no&&e.id!==id)){alert('중복된 사번입니다.');return}let obj={employee_no:no,name,corporation:corp,headquarters:hq,department:dept,position:get('ePosition'),grade:get('eGrade'),gender:get('eGender'),age:get('eAge')?Number(get('eAge')):null,hire_date:get('eHire'),status:get('eStatus'),education:get('eEducation'),field_leader_role:get('eLeader')||'미지정'};if(id){let old=db.employees.find(e=>e.id===id);if(!old)return;let prev={...old};Object.assign(old,obj);if(prev.status!==obj.status){if(obj.status==='퇴사')old.exit_date=get('eExitDate')||old.exit_date||today();else if(prev.status==='퇴사')old.exit_date='';if(obj.status==='휴직')old.leave_date=get('eLeaveDate')||old.leave_date||today();else if(prev.status==='휴직')old.leave_date='';}if(prev.status!==obj.status)db.history.unshift({employee_id:id,event_date:obj.status==='퇴사'?(get('eExitDate')||today()):obj.status==='휴직'?(get('eLeaveDate')||today()):today(),event_type:obj.status==='퇴사'?'퇴사':'상태변경',title:obj.status,description:'상태 변경: '+prev.status+' → '+obj.status,department:dept,grade:obj.grade});if(keyOf(prev)!==keyOf(obj))db.history.unshift({employee_id:id,event_date:today(),event_type:'발령',title:'소속 변경',description:prev.department+' → '+dept,department:dept,grade:obj.grade});commit('인원 수정',no+' '+name); }else{let newid=uid();db.employees.push({id:newid,...obj,...(obj.status==='퇴사'?{exit_date:get('eExitDate')||today()}:{}),...(obj.status==='휴직'?{leave_date:get('eLeaveDate')||today()}:{})});db.history.unshift({employee_id:newid,event_date:obj.hire_date||today(),event_type:'입사',title:'입사',description:'인원 신규 등록',department:dept,grade:obj.grade});commit('인원 추가',no+' '+name+' / '+dept)}closeModal()}
function retire(id){let e=db.employees.find(e=>e.id===id);if(!e||!confirm(e.name+'님을 퇴사 처리하시겠습니까?\n개인 정보와 연혁은 보존되며 현재 인원에서는 제외됩니다.'))return;e.status='퇴사';e.exit_date=today();db.history.unshift({employee_id:id,event_date:today(),event_type:'퇴사',title:'퇴사',description:'퇴사 처리',department:e.department,grade:e.grade});commit('퇴사 처리',e.employee_no+' '+e.name)}function deleteEmployee(id){let e=db.employees.find(e=>e.id===id);if(!e||!confirm('완전 삭제 시 개인별 연혁도 사라집니다. 계속하시겠습니까?'))return;db.employees=db.employees.filter(x=>x.id!==id);db.history=db.history.filter(x=>x.employee_id!==id);closeModal();commit('인원 완전 삭제',e.employee_no+' '+e.name)}
function openPlan(id=null){let p=db.plans.find(x=>x.id===id)||{year:planYear};modal(id?'사업계획 정원 수정':'사업계획 정원 등록',`<div class="formgrid">${field('연도 *','pYear',p.year,'number','min="2000" max="2100"')}${field('법인 *','pCorp',p.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','pHQ',p.headquarters,'text','list="dl-headquarters"')}${field('부서 *','pDept',p.department,'text','list="dl-department"')}${field('계획 정원 (명) *','pTarget',p.target??0,'number','min="0" step="1"')}${options('corporation')}${options('headquarters')}${options('department')}</div><div class="modalactions">${id?`<button class="btn danger" onclick="deletePlan(${id})">계획 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="savePlan(${id||'null'})">저장</button></div>`)}
function savePlan(id){let yearValue=Number(get('pYear')),corporation=get('pCorp'),headquarters=get('pHQ'),department=get('pDept'),val=get('pTarget'),target=Number(val);if(!yearValue||!corporation||!headquarters||!department||val===''||!Number.isInteger(target)||target<0){alert('계획 정보를 정확히 입력해 주세요.');return}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yearValue&&p.corporation===corporation&&p.headquarters===headquarters&&p.department===department)){alert('해당 연도·조직의 계획이 이미 존재합니다. 기존 항목을 수정하세요.');return}let o={year:yearValue,corporation,headquarters,department,target};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yearValue;closeModal();commit(id?'정원 수정':'정원 추가',yearValue+' / '+department+' / '+target+'명')}
function deletePlan(id){let p=db.plans.find(p=>p.id===id);if(!p||!confirm('해당 사업계획 정원을 삭제하시겠습니까?'))return;db.plans=db.plans.filter(x=>x.id!==id);closeModal();commit('정원 삭제',p.year+' / '+p.department)}function fillPlanFromCurrent(){let m=new Map();db.employees.filter(occupied).forEach(e=>{let k=keyOf(e);if(!m.has(k))m.set(k,{corporation:e.corporation,headquarters:e.headquarters,department:e.department,n:0});m.get(k).n++});let added=0;for(let p of m.values()){if(!db.plans.some(x=>Number(x.year)===planYear&&keyOf(x)===keyOf(p))){db.plans.push({id:uid(),year:planYear,corporation:p.corporation,headquarters:p.headquarters,department:p.department,target:p.n});added++}}if(added)commit('정원 초안 생성',planYear+'년 / '+added+'개 부서');else alert('추가할 부서가 없습니다.')}
function openPersonal(id){let e=db.employees.find(x=>x.id===id);if(!e)return;let events=db.history.filter(x=>x.employee_id===id).sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date)));modal(e.name+' · 개인별 연혁',`<div class="kpirow"><span><b>사번</b> ${esc(e.employee_no)}</span><span><b>소속</b> ${esc(e.corporation)} / ${esc(e.department)}</span><span><b>상태</b> ${esc(e.status)}</span></div><div class="toolbar" style="margin-top:18px"><button class="btn primary" onclick="openHistoryForm(${id})">+ 연혁 추가</button></div><div class="timeline">${events.map(h=>`<div class="event"><span class="date">${esc(h.event_date)} · ${esc(h.event_type)}</span><b>${esc(h.title)}</b><div class="muted">${esc(h.description)}</div></div>`).join('')||'<p class="muted">등록된 연혁이 없습니다.</p>'}</div><div class="modalactions"><button class="btn" onclick="closeModal()">닫기</button></div>`)}
function openHistoryForm(id){let e=db.employees.find(x=>x.id===id);modal(e.name+' · 연혁 등록',`<div class="formgrid">${field('일자','hDate',today(),'date')}<label>유형${select('hType',['입사','발령','승급','직위변경','휴직','복직','퇴사','교육','포상','기타'],'기타',null)}</label>${field('제목 *','hTitle') }<label class="wide">내용<textarea id="hDesc" rows="4"></textarea></label></div><div class="hint">퇴사에 따라 TO까지 변경하려면 '인원관리 → 퇴사 처리'를 사용하세요. 이 메뉴에서 추가하는 것은 연혁 기록만 반영합니다.</div><div class="modalactions"><button class="btn" onclick="openPersonal(${id})">뒤로</button><button class="btn primary" onclick="saveHistory(${id})">저장</button></div>`)}
function saveHistory(id){let e=db.employees.find(x=>x.id===id),title=get('hTitle');if(!title){alert('제목을 입력하세요.');return}db.history.unshift({employee_id:id,event_date:get('hDate')||today(),event_type:get('hType'),title,description:get('hDesc'),department:e.department,grade:e.grade});commit('연혁 추가',e.employee_no+' '+e.name+' / '+title);openPersonal(id)}function resetFilters(){search='';filters={};render()}function searchHistory(){search=get('historySearch');render()}
function download(name,text,mime){let blob=new Blob(['\ufeff',text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadJSON(){save();download('생산직_인사TO_백업_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}function downloadCSV(){const cols=['employee_no','name','corporation','headquarters','department','position','grade','gender','age','hire_date','status','education'],names=['사번','성명','법인','본부','부서','직위','직급','성별','연령','입사일','상태','학력'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('생산직_인원_'+today()+'.csv',[names,...db.employees.map(e=>cols.map(c=>e[c]))].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function restoreJSON(ev){let f=ev.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.employees)||!Array.isArray(o.plans)||!Array.isArray(o.history)){throw Error('올바른 백업 파일이 아닙니다')}if(!confirm('현재 저장된 내용을 모두 백업 파일로 교체하시겠습니까?'))return;db={employees:o.employees,plans:o.plans,history:o.history,audit:Array.isArray(o.audit)?o.audit:[]};if(!save())return;render();alert('백업을 복원했습니다.')}catch(e){alert('복원 실패: '+e.message)}finally{ev.target.value=''}}

function plansView(){const a=plansFor(planYear),ps=monthSummary();return yearPicker()+`<div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('선택월 계획 정원',ps.target,planYear+'년 '+planMonth+'월')}${card('현재 운영 인원',ps.actual,'정원 등록 조직 기준')}${card('부족 TO',ps.short,'조직별 부족 합계','negative')}${card('초과 TO',ps.extra,'조직별 초과 합계','warning')}</div><section class="panel"><div class="toolbar"><button class="btn primary" onclick="openPlan()">+ 사업계획 등록</button><button class="btn" onclick="fillPlanFromCurrent()">현재 인원 기준 초안</button><button class="btn" onclick="setView('executive')">경영진 보고</button></div><div class="notice">연간 기본 정원을 입력하고 월별로 조정할 수 있습니다. 월별 미입력 정원은 연간 기본 정원을 적용합니다. 과거 월 인원 실적이 아닌 <b>현재 재직 인원</b>과 비교합니다.</div><div class="tablewrap"><table><thead><tr><th>법인</th><th>본부/실</th><th>부서</th><th class="right">선택월 계획</th><th class="right">현재 운영</th><th class="right">부족</th><th class="right">초과</th><th>충족률</th><th>관리</th></tr></thead><tbody>${a.sort((x,y)=>x.corporation.localeCompare(y.corporation,'ko')||x.department.localeCompare(y.department,'ko')).map(p=>{let t=monthTarget(p),n=unitCount(p),sh=Math.max(0,t-n),ex=Math.max(0,n-t);return `<tr><td>${esc(p.corporation)}</td><td>${esc(p.headquarters)}</td><td><b>${esc(p.department)}</b></td><td class="right">${fmt(t)}</td><td class="right">${fmt(n)}</td><td class="right negative">${sh||'-'}</td><td class="right warning">${ex||'-'}</td><td>${t?Math.round(n/t*100)+'%':n?'계획 없음':'-'}</td><td><button class="btn tiny" onclick="openPlan(${p.id})">월별 수정</button> <button class="btn tiny primary" onclick="openRecruitment(null,'${encodeURIComponent(keyOf(p))}')">채용 요청</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">해당 연도 정원이 없습니다.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>월별 사업계획 정원 추이</h2><div class="tablewrap"><table><thead><tr><th>월</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}</tr></thead><tbody><tr><td><b>총 계획</b></td>${Array.from({length:12},(_,i function openPlan(id=null){let p=db.plans.find(x=>x.id===id)||{year:planYear,target:0};modal(id?'월별 사업계획 수정':'월별 사업계획 등록',`<div class="formgrid">${field('사업계획 연도 *','pYear',p.year,'number','min="2000" max="2100"')}${field('법인 *','pCorp',p.corporation,'text','list="dl-corporation"')}${field('본부 / 실 *','pHQ',p.headquarters,'text','list="dl-headquarters"')}${field('부서 *','pDept',p.department,'text','list="dl-department"')}${field('연간 기본 정원 *','pTarget',p.target??0,'number','min="0" step="1"')}${options('corporation')}${options('headquarters')}${options('department')}</div><h3 style="margin-top:24px">1~12월 계획 인원</h3><div class="month-grid">${Array.from({length:12},(_,i)=>`<label>${i+1}월<input id="pm${i}" type="number" min="0" step="1" placeholder="기본 정원" value="${p.months?.[i]??''}"></label>`).join('')}</div><p class="hint">빈칸은 기본 정원이 자동 적용됩니다. 0을 입력하면 해당 월 계획 인원은 0명입니다.</p><div class="modalactions">${id?`<button class="btn danger" onclick="deletePlan(${id})">계획 삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="savePlan(${id||'null'})">저장</button></div>`)}
function savePlan(id){let yr=Number(get('pYear')),corp=get('pCorp'),hq=get('pHQ'),dept=get('pDept'),v=get('pTarget'),t=Number(v);if(!Number.isInteger(yr)||yr<2000||yr>2100||!corp||!hq||!dept||v===''||!Number.isInteger(t)||t<0){alert('연도·조직·기본 정원을 확인하세요.');return}const months=[];for(let i=0;i<12;i++){const x=get('pm'+i);if(x!==''&&(!Number.isInteger(Number(x))||Number(x)<0)){alert(i+1+'월 계획을 확인하세요.');return}months.push(x===''?null:Number(x))}if(db.plans.some(p=>p.id!==id&&Number(p.year)===yr&&keyOf(p)===keyOf({corporation:corp,headquarters:hq,department:dept}))){alert('동일 연도·조직의 계획이 있습니다.');return}const o={year:yr,corporation:corp,headquarters:hq,department:dept,target:t,months};if(id)Object.assign(db.plans.find(p=>p.id===id),o);else db.plans.push({id:uid(),...o});planYear=yr;closeModal();commit('월별 정원 '+(id?'수정':'등록'),yr+' / '+dept)}

function saveRecruitment(id){if(!get('rCorp')||!get('rHQ')||!get('rDept')){alert('법인·본부·부서를 입력하세요.');return}const o={request_no:get('rNo'),date:get('rDate'),name:get('rName'),corporation:get('rCorp'),headquarters:get('rHQ'),department:get('rDept'),stage:get('rStage'),start_date:get('rStart'),memo:get('rMemo')};if(id)Object.assign(db.recruitment.find(x=>x.id===id),o);else db.recruitment.unshift({id:uid(),...o});closeModal();commit('채용 진행 '+(id?'수정':'등록'),o.department+' / '+o.stage)}
function deleteRecruitment(id){if(!confirm('해당 채용 건을 삭제할까요?'))return;db.recruitment=db.recruitment.filter(x=>x.id!==id);commit('채용 건 삭제',String(id))}

function openEmployee(id=null,encoded=''){if(id||!currentRecruitId)currentRecruitId=null;_oldOpenEmployee(id,encoded);let el=$('#eAge');if(el&&id){let e=db.employees.find(x=>x.id===id);if(e)el.value=displayAge(e)}let hint=$('#modalBody .hint');if(hint)hint.insertAdjacentHTML('beforeend','<br>연령은 입력한 해를 기준으로 매년 1월 1일 +1세 표시됩니다. 생일 기준 만 나이는 아닙니다.')}

function executiveView(){const ps=monthSummary(),a=plansFor(planYear),groups=new Map();for(const p of a){let k=p.corporation+' / '+p.headquarters;let o=groups.get(k)||{name:k,target:0,actual:0,short:0,extra:0};let t=monthTarget(p),n=unitCount(p);o.target+=t;o.actual+=n;o.short+=Math.max(0,t-n);o.extra+=Math.max(0,n-t);groups.set(k,o)}const percent=ps.target?(ps.actual/ps.target*100).toFixed(1)+'%':'미산정';return yearPicker()+`<div class="report-head panel"><div><div class="smallcaps">PRODUCTION WORKFORCE · MANAGEMENT REPORT</div><h2 style="margin:10px 0 4px">${planYear}년 ${planMonth}월 생산직 정원 운영 보고</h2><span class="muted">작성일 ${today()} · 현재 인원 기준 집계</span></div><button class="btn primary no-print" onclick="window.print()">인쇄 / PDF 저장</button></div><div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('계획 정원',ps.target,'선택 월')}${card('현재 운영',ps.actual,'등록 조직 한정')}${card('부족 TO',ps.short,'부서별 부족 합계','negative')}${card('충족률',percent,'운영 인원 ÷ 계획 정원')}</div><section class="panel"><h2>법인 · 본부별 정원 운영 현황</h2><div class="tablewrap"><table><thead><tr><th>법인 / 본부</th><th class="right">계획</th><th class="right">현재</th><th class="right">부족 TO</th><th class="right">초과 TO</th><th class="right">충족률</th></tr></thead><tbody>${[...groups.values()].sort((a,b)=>b.short-a.short).map(g=>`<tr><td>${esc(g.name)}</td><td class="right">${g.target}</td><td class="right">${g.actual}</td><td class="right negative">${g.short}</td><td class="right warning">${g.extra}</td><td class="right">${g.target?(g.actual/g.target*100).toFixed(1)+'%':'-'}</td></tr>`).join('')||'<tr><td colspan="6">계획 데이터 없음</td></tr>'}</tbody></table></div></section><section class="panel"><h2>부족 TO 중점 관리 부서</h2><div class="tablewrap"><table><thead><tr><th>법인</th><th>부서</th><th class="right">계획</th><th class="right">현재</th><th class="right">부족</th><th>관리 방향</th></tr></thead><tbody>${a.filter(p=>monthTarget(p)>unitCount(p)).sort((x,y)=>(monthTarget(y)-unitCount(y))-(monthTarget(x)-unitCount(x))).map(p=>`<t restoreJSON = async function(ev){let f=ev.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.employees)||!Array.isArray(o.plans)||!Array.isArray(o.history))throw Error('올바른 백업 파일이 아닙니다');if(!confirm('현재 저장된 내용을 모두 백업 파일로 교체하시겠습니까?'))return;db={employees:o.employees,plans:o.plans,history:o.history,audit:Array.isArray(o.audit)?o.audit:[],recruitment:Array.isArray(o.recruitment)?o.recruitment:[]};for(const e of db.employees)if(e.age!=null&&e.age_base_year==null)e.age_base_year=2026;if(!save())return;render();alert('백업을 복원했습니다.')}catch(e){alert('복원 실패: '+e.message)}finally{ev.target.value=''}}

function actualFor(p,m=planMonth,y=planYear){const snapshot=db.snapshots.find(s=>s.year===Number(y)&&s.month===Number(m));if(!snapshot)return null;return Number(snapshot.units?.[keyOf(p)]||0)}
function takeSnapshot(){const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;const units={},employees={};for(const e of db.employees.filter(occupied)){units[keyOf(e)]=(units[keyOf(e)]||0)+1;employees[e.id]=true}const snap={year:y,month:m,units,total:Object.keys(employees).length,captured:new Date().toLocaleString('ko-KR')};const ix=db.snapshots.findIndex(x=>x.year===y&&x.month===m);if(ix>=0){if(!confirm('이번 달 저장 실적을 현재 인원으로 덮어쓸까요?'))return;db.snapshots[ix]=snap}else db.snapshots.push(snap);commit('월별 인원 스냅샷',`${y}년 ${m}월 / ${snap.total}명`)}
function snapshotMonth(y,m){return db.snapshots.find(s=>s.year===Number(y)&&s.month===Number(m))}
function coveredRecruits(p){return db.recruitment.filter(r=>keyOf(r)===keyOf(p)&&r.stage==='합격·입사예정'&&!r.employee_id).length}
function forecastMetrics(p){const t=monthTarget(p),n=unitCount(p),pending=coveredRecruits(p);return {t,n,pending,short:Math.max(0,t-n),remaining:Math.max(0,t-n-pending)}}

let leaderCorp='',leaderDept='',leaderRole='',leaderSearch='';
function roleOf(e){return roles.includes(e.field_leader_role)?e.field_leader_role:'미지정'}
function leadersView(){
 const active=db.employees.filter(e=>occupied(e));

 for(const e of active){const key=keyOf(e);if(!totals.has(key))totals.set(key,{corporation:e.corporation||'',headquarters:e.headquarters||'',department:e.department||'',total:0,counts:Object.fromEntries(roles.map(r=>[r,0]))});let p=totals.get(key);p.total++;if(roleOf(e)!=='미지정')p.counts[roleOf(e)]++}

 const sels=(id,opts,val,placeholder)=>`<select id="${id}"><option value="">${placeholder}</option>${opts.map(x=>`<option value="${esc(x)}" ${val===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;

 <div class="panel"><h2>조직별 현장관리자 배치 현황</h2><div class="toolbar">${sels('leaderCorp',[...new Set(active.map(x=>x.corporation).filter(Boolean))].sort(),leaderCorp,'전체 법인')}${sels('leaderDept',[...new Set(active.filter(e=>!leaderCorp||e.corporation===leaderCorp).map(x=>x.department).filter(Boolean))].sort(),leaderDept,'전체 부서')}<button class="btn" onclick="window.resetLeaderFilters()">초기화</button><button class="btn" onclick="window.downloadExcel('현장관리자집계')">조직별 Excel</button><button class="btn" onclick="window.downloadExcel('현장관리자명부')">관리자 명부 Excel</button></div>
 <div class="tablewrap"><table><thead><tr><th>법인</th><th>본부</th><th>부서</th><th class="right">총인원</th><th class="right">그룹장</th><th class="right">파트장</th><th class="right">라인장</th><th class="right">관리자 합계</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.corporation)}</td><td>${esc(g.headquarters)}</td><td>${esc(g.department)}</td><td class="right">${g.total}</td>${roles.map(r=>`<td class="right">${g.counts[r]}</td>`).join('')}<td class="right"><b>${roles.reduce((n,r)=>n+g.counts[r],0)}</b></td></tr>`).join('')||'<tr><td colspan="8" class="empty">조회 결과 없음</td></tr>'}</tbody></table></div></div>
 <div class="panel"><h2>현장관리자 개인 명부 <span class="muted">${list.length}명</span></h2><div class="toolbar"><input id="leaderSearch" placeholder="사번·성명·부서 검색" value="${esc(leaderSearch)}">${sels('leaderRole',roles,leaderRole,'전체 직책')}</div><div class="tablewrap"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부/부서</th><th>관리자 직책</th><th>상태</th><th>수정</th></tr></thead><tbody>${list.map(e=>`<tr><td>${esc(e.employee_no)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.corporation)}</td><td>${esc(e.headquarters)} / ${esc(e.department)}</td><td><span class="pill">${esc(roleOf(e))}</span></td><td>${esc(e.status)}</td><td><button class="btn tiny" onclick="openEmployee(${e.id})">직책 수정</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">배정된 현장관리자가 없습니다. 인원관리에서 직책을 선택하세요.</td></tr>'}</tbody></table></div></div>`;
}

document.addEventListener('change',ev=>{if(view!=='leaders')return;const ids={leaderCorp:'corp',leaderDept:'dept',leaderRole:'role'};if(!ids[ev.target.id])return;if(ev.target.id==='leaderCorp'){leaderCorp=ev.target.value;leaderDept=''}if(ev.target.id==='leaderDept')leaderDept=ev.target.value;if(ev.target.id==='leaderRole')leaderRole=ev.target.value;render()});

})();
</script><script>

(function(){

 let list=db.employees.filter(e=>(!search||[e.name,e.employee_no,e.corporation,e.headquarters,e.department].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())))&&(!filters.corporation||e.corporation===filters.corporation)&&(!filters.department||e.department===filters.department)&&(!filters.status||e.status===filters.status)).slice(0,300);
 // Add a position column and selection checkbox directly to rendered rows.
 html=html.replace('<th>사번</th>','<th><input type="checkbox" id="allBulk" title="화면에 표시된 인원 전체 선택"></th><th>사번</th>');
 let idx=0;
 html=html.replace(/<tr><td>([^<]*)<\/td><td><b>/g,(match,no)=>{if(idx>=list.length)return match;const e=list[idx++];return `<tr><td><input type="checkbox" class="bulkEmp" value="${e.id}"></td><td>${no}</td><td><b>`});
 idx=0;
 html=html.replace(/<td>([^<]*)<\/td><td>(남|여|)<\/td><td>([^<]*)<\/td><td>([^<]*)<\/td><td><span class="pill /g,(m,grade,gender,age,hire)=>{const e=list[idx++];return e?`<td>${esc(e.position||'')}</td><td>${grade}</td><td>${gender}</td><td>${age}</td><td>${hire}</td><td><span class="pill `:m});
 html=html.replace(/(<button class="btn primary" onclick="openEmployee\(\)">\+ 신규 인원 등록<\/button>)/,'$1<button class="btn" onclick="setView(\'bulk\')">⇄ 일괄 인사발령</button>');
 return html;
};
const oldOpen=openEmployee;
openEmployee=function(id=null,encoded=''){oldOpen(id,encoded);prepareOrgFields();};
function prepareOrgFields(){const corp=document.getElementById('eCorp'),hq=document.getElementById('eHQ'),dep=document.getElementById('eDept');if(!corp||!hq||!dep)return;
 const host=corp.closest('label');if(host){const hint=document.createElement('div');hint.className='hint';hint.textContent='본부/실 · 부서는 선택 법인에 등록된 조직만 추천됩니다. 제조본부 소속 4개 실은 상위 조직으로 표시됩니다.';host.append(hint)}
 const refresh=()=>{const hs=hqFor(corp.value),ds=deptFor(corp.value,hq.value);const hlist=document.getElementById('dl-headquarters'),dlist=document.getElementById('dl-department');if(hlist)hlist.innerHTML=hs.map(h=>`<option value="${esc(h)}" label="${esc(orgLabel(h))}"></option>`).join('');if(dlist)dlist.innerHTML=ds.map(d=>`<option value="${esc(d)}"></option>`).join('');};
 corp.addEventListener('input',()=>{hq.value='';dep.value='';refresh()});hq.addEventListener('input',()=>{dep.value='';refresh()});refresh();
}
// Bulk transfer form: explicit selection, preview, one commit and per-person history.

const nav=document.querySelector('.navs');const empNav=nav.querySelector('[data-view="employees"]');empNav.insertAdjacentHTML('afterend','<button class="nav" data-view="bulk">⇄ 일괄 인사발령</button>');nav.querySelector('[data-view="bulk"]').addEventListener('click',()=>setView('bulk'));
let selection=new Set(),bulkCorp='',bulkHq='',bulkSearch='';
function candidates(){return db.employees.filter(e=>(!bulkCorp||e.corporation===bulkCorp)&&(!bulkHq||e.headquarters===bulkHq)&&(!bulkSearch||[e.name,e.employee_no,e.department].some(v=>String(v||'').includes(bulkSearch)))).sort(cmp)}
function opt(id,items,value,blank){return select(id,items,value,blank)}
function bulkView(){const items=candidates();return `<section class="panel"><h2>대상 인원 선택 <span class="muted">${selection.size}명 선택됨</span></h2><div class="notice">선택한 직원만 변경됩니다. 사업계획 TO는 변경하지 않고 기존 정원을 유지하며, 변경 직후 부서별 실제 인원과 TO를 재계산합니다.</div><div class="toolbar">${opt('bulkCorp',[...CORPS,...new Set(db.employees.map(e=>e.corporation).filter(c=>!CORPS.includes(c)&&c))],bulkCorp,'전체 법인')}${opt('bulkHq',hqFor(bulkCorp).length?hqFor(bulkCorp):[...new Set(db.employees.map(e=>e.headquarters).filter(Boolean))],bulkHq,'전체 본부/실')}<input id="bulkSearch" placeholder="사번·성명·부서 검색" value="${esc(bulkSearch)}"><button class="btn" id="bulkSelectAll">조회 결과 전체 선택</button><button class="btn" id="bulkClear">선택 해제</button></div><div class="tablewrap" style="max-height:310px;overflow:auto"><table><thead><tr><th>선택</th><th>사번</th><th>성명</th><th>법인</th><th>상위본부 / 실</th><th>부서</th><th>직위</th><th>직급</th></tr></thead><tbody>${items.map(e=>`<tr><td><input type="checkbox" class="bulkCheck" value="${e.id}" ${selection.has(String(e.id))?'checked':''}></td><td>${esc(e.employee_no)}</td><td>${esc(e.name)}</td><td>${esc(e.corporation)}</td><td>${esc(orgLabel(e.headquarters))}</td><td>${esc(e.department)}</td><td>${esc(e.position)}</td><td>${esc(e.grade)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>발령 사항 입력</h2><p class="hint">변경하지 않을 항목은 비워 두세요. 직위·직급은 직접 입력하고, 부서는 선택 법인과 본부/실에 등록된 목록에서 선택할 수 있습니다.</p><div class="formgrid"><label>발령일<input id="bulkDate" type="date" value="${today()}"></label><label>변경 법인${opt('bulkTargetCorp',CORPS,'','변경 안 함')}</label><label>변경 본부/실<input id="bulkTargetHQ" list="bulkHqList" placeholder="변경 안 함"><datalist id="bulkHqList"></datalist></label><label>변경 부서<input id="bulkTargetDept" list="bulkDeptList" placeholder="변경 안 함"><datalist id="bulkDeptList"></datalist></label><label>변경 직위<input id="bulkTargetPosition" placeholder="변경 안 함"></label><label>변경 직급<input id="bulkTargetGrade" placeholder="변경 안 함"></label><label>발령 사유<input id="bulkReason" placeholder="예: 조직 개편"></label></div><div class="modalactions"><button class="btn primary" onclick="window.applyBulkTransfer()">선택 인원 일괄 변경 및 저장</button></div></section>`}
function bindBulk(){const corp=document.getElementById('bulkTargetCorp'),hq=document.getElementById('bulkTargetHQ'),dept=document.getElementById('bulkTargetDept');if(!corp)return;const change=()=>{document.getElementById('bulkHqList').innerHTML=hqFor(corp.value).map(s=>`<option value="${esc(s)}" label="${esc(orgLabel(s))}"></option>`).join('');document.getElementById('bulkDeptList').innerHTML=deptFor(corp.value,hq.value).map(s=>`<option value="${esc(s)}"></option>`).join('')};corp.onchange=()=>{hq.value='';dept.value='';change()};hq.oninput=()=>{dept.value='';change()};change();}
const priorRender=render;
render=function(){if(view==='bulk'){document.getElementById('heading').textContent=names.bulk[0];document.getElementById('subheading').textContent=names.bulk[1];document.getElementById('content').innerHTML=bulkView();bindBulk();}else{priorRender();if(view==='organization'||view==='leaders'){const cont=document.getElementById('content');for(const cell of cont.querySelectorAll('td'))if(MFG.has(cell.textContent.trim()))cell.textContent=orgLabel(cell.textContent.trim());}}};
window.applyBulkTransfer=function(){const ids=[...selection];if(!ids.length)return alert('발령 대상자를 먼저 선택하세요.');const el=id=>document.getElementById(id)?.value.trim()||'';const changes={corporation:el('bulkTargetCorp'),headquarters:el('bulkTargetHQ'),department:el('bulkTargetDept'),position:el('bulkTargetPosition'),grade:el('bulkTargetGrade')};const entries=Object.entries(changes).filter(([,v])=>v);if(!entries.length)return alert('변경할 항목을 한 개 이상 입력하세요.');const dt=el('bulkDate')||today(),reason=el('bulkReason');const edits=ids.map(id=>db.employees.find(e=>String(e.id)===String(id))).filter(Boolean);if(!confirm(`${edits.length}명의 인사정보를 일괄 변경합니다. 개인별 발령 연혁에 기록됩니다. 계속할까요?`))return;let changed=0;for(const e of edits){const diffs=[];for(const [key,val] of entries){if(String(e[key]||'')!==val){diffs.push(`${key}: ${e[key]||'-'} → ${val}`);e[key]=val}}if(!diffs.length)continue;changed++;db.history.unshift({employee_id:e.id,event_date:dt,event_type:'발령',title:'일괄 인사발령',description:[reason,...diffs].filter(Boolean).join(' / '),department:e.department,grade:e.grade});}if(changed){selection.clear();commit('일괄 인사발령',`${changed}명 / ${reason||'조직·직위·직급 변경'}`);alert(`${changed}명 변경 완료. 공동 DB 저장 완료 상태를 확인하세요.`)}else alert('변경된 인원이 없습니다.')};

// Employee management: stable Korean IME search, extended filters, and safe mass edit.
const EXTRA_KEYS=['position','grade','gender','decade','hireYear','education','union_status','field_leader_role'];
const empExtra={};let empSelected=new Set();
const cleanVal=v=>String(v??'').trim();
function employeeMatches(e){

 if(filters.department&&e.department!==filters.department)return false;
 if(filters.status&&e.status!==filters.status)return false;
 for(const k of EXTRA_KEYS){const wanted=empExtra[k];if(!wanted)continue;
  const actual=k==='decade'?(Number.parseInt(displayAge(e),10)>=0?String(Math.floor(Number(displayAge(e))/10)*10):''):k==='hireYear'?String(e.hire_date||'').slice(0,4):cleanVal(e[k]|| (k==='union_status'?'미확인':k==='field_leader_role'?'미지정':''));
  if(String(actual)!==String(wanted))return false;
 }return true;
}
function filteredEmployees(){return db.employees.filter(employeeMatches).sort(cmp)}
function employeeFilterSelect(id,label,options,value){return `<label class="emp-filter-label">${esc(label)}${select(id,options,value,'전체')}</label>`}
function extraChoices(key){if(key==='decade')return ['10','20','30','40','50','60','70','80'];if(key==='hireYear')return [...new Set(db.employees.map(e=>String(e.hire_date||'').slice(0,4)).filter(v=>/^\d{4}$/.test(v)))].sort((a,b)=>b.localeCompare(a));if(key==='union_status')return ['가입','미가입','미확인'];if(key==='field_leader_role')return ['그룹장','파트장','라인장','미지정'];if(key==='gender')return ['남','여'];return [...new Set(db.employees.map(e=>cleanVal(e[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}
const empLabels={position:'직위',grade:'직급',gender:'성별',decade:'연령대',hireYear:'입사연도',education:'학력',union_status:'노조 가입 여부',field_leader_role:'현장관리자'};
employeesView=function(){
 const matched=filteredEmployees(),shown=matched.slice(0,300),depts=deptFor(filters.corporation,'');

window.applyEmployeeMassEdit=function(){

 const diffs=selected.map(e=>({e,props:changes.filter(([k,v])=>cleanVal(e[k]||((k==='union_status')?'미확인':k==='field_leader_role'?'미지정':''))!==v)})).filter(x=>x.props.length);
 if(!diffs.length)return alert('실제로 변경할 내용이 없습니다.');

function historicalDashboard(s){
 const plans=plansFor(planYear);
 const units=s.units||{};
 const byCorp={};
 for(const [key,count] of Object.entries(units)){
   const corp=key.split('␟')[0]||'미지정';byCorp[corp]=(byCorp[corp]||0)+Number(count||0);
 }
 const metrics=plans.map(p=>({p,n:Number(units[keyOf(p)]||0),target:monthTarget(p,planMonth)}));
 const total=Number(s.total ?? Object.values(byCorp).reduce((a,b)=>a+b,0));
 const target=metrics.reduce((v,x)=>v+x.target,0),short=metrics.reduce((v,x)=>v+Math.max(0,x.target-x.n),0),extra=metrics.reduce((v,x)=>v+Math.max(0,x.n-x.target),0);
 const months=yearPicker();
 const info=`<div class="notice"><b>${monthEndLabel(planYear,planMonth)} 저장 인원 기준</b> · 기록시각 ${esc(s.captured||'월말 자동기록')} · 재직·휴직 포함 · 과거 직원별 명부나 현장관리자 직책을 소급 계산하지 않습니다.</div>`;
 const orgrows=metrics.sort((a,b)=>Math.max(0,b.target-b.n)-Math.max(0,a.target-a.n)).map(({p,n,target})=>`<tr><td>${esc(p.corporation)} · ${esc(orgLabel(p.headquarters))}<br><b>${esc(p.department)}</b></td><td class="right">${fmt(target)}</td><td class="right">${fmt(n)}</td><td class="right ${target>n?'negative':target<n?'warning':'positive'}">${target>n?'-'+(target-n):target<n?'+'+(n-target):'일치'}</td></tr>`).join('');
 const max=Math.max(1,...Object.values(byCorp));
 return months+info+`<div class="cards">${card('선택월 말 운영 인원',total,'월말 저장 기록')}${card('사업계획 정원',target,'선택 연·월의 계획')}${card('부족 TO',short,'월말 기록과 계획 비교','negative')}${card('초과 TO',extra,'월말 기록과 계획 비교','warning')}</div><div class="section"><section class="panel"><h2>선택월 말 조직별 정원 비교</h2><div class="tablewrap"><table><thead><tr><th>법인 / 본부 / 부서</th><th class="right">계획</th><th class="right">월말 인원</th><th class="right">부족 / 초과</th></tr></thead><tbody>${orgrows||'<tr><td colspan="4">해당 월 계획 없음</td></tr>'}</tbody></table></div></section><section class="panel"><h2>선택월 말 법인별 인원</h2>${Object.entries(byCorp).sort((a,b)=>CORPS.indexOf(a[0])-CORPS.indexOf(b[0])).map(([corp,n])=>`<div style="margin:17px 0"><div class="summaryline" style="justify-content:space-between;margin-bottom:7px"><b>${esc(corp)}</b><b>${fmt(n)}명</b></div><div class="bar"><i style="width:${100*n/max}%"></i></div></div>`).join('')||'<p class="muted">등록된 인원이 없습니다.</p>'}</section></div>`;
}
dashboard=function(){

 }

/* Dashboard totals: net company-wide comparison, separate from department shortages. */
  function globalToMetrics(y=planYear,m=planMonth,totalOverride=null){
    const total=totalOverride===null?db.employees.filter(occupied).length:Number(totalOverride);

  function removeExcessKpi(html){ return html; }

    const start=html.indexOf('<div class="cards">');
    if(start>=0){const tags=/<\/?div\b[^>]*>/g;tags.lastIndex=start;let depth=0,match;while((match=tags.exec(html))){depth+=match[0].startsWith('</')?-1:1;if(depth===0){html=html.slice(0,start)+cards+html.slice(tags.lastIndex);break;}}}

    return removeExcessKpi(html);
  };

/* Union statistics: production workforce denominator, office members counted only in union membership. */
(function(){

window.importOfficeUnion=async function(ev){const f=ev.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const list=Array.isArray(obj)?obj:obj.office_union_members;if(!Array.isArray(list)||list.length!==4||list.some(x=>!x.employee_no||!x.name))throw Error('사무직 4명 명단 형식을 확인하세요.');if(!confirm('사무직 조합원 4명 명부를 공동 DB에 저장하시겠습니까? 생산직 인원에는 포함되지 않습니다.'))return;db.office_union_members=list.map(x=>({employee_no:String(x.employee_no),name:String(x.name),department:String(x.department||''),position:String(x.position||''),grade:String(x.grade||''),union_status:'가입',category:'사무직'}));commit('사무직 노조명부 등록','사무직 노조가입 4명 별도 명부 등록');}catch(e){alert('명부 등록 실패: '+e.message)}finally{ev.target.value=''}};
function unionSheets(){const data=window.__unionBaseSheets(),s=unionStats(),office=officeRoster();const report=(name,rows)=>({name,rows:[['구분','대상 근로자','가입 조합원','가입률'],...rows.map(r=>[r.label,r.total,r.members,r.rate]),['생산직 합계',rows.reduce((n,r)=>n+r.total,0),rows.reduce((n,r)=>n+r.members,0),s.total?(s.prodMember/s.total*100).toFixed(1)+'%':'-']]});data['노조법인별집계']=report('노조법인별집계',s.corp);data['노조직위별집계']=report('노조직위별집계',s.position);data['사무직노조명부']={name:'사무직노조명부',rows:[['사번','성명','부서','직위','직급','가입상태'],...office.map(x=>[x.employee_no,x.name,x.department,x.position,x.grade,'가입'])]};data['노조총괄']={name:'노조총괄',rows:[['구분','인원'],['생산직 대상 근로자',s.total],['생산직 조합원',s.prodMember],['생산직 가입률',s.total?(100*s.prodMember/s.total).toFixed(1)+'%':'-'],['사무직 가입 조합원',s.officeCount],['전체 가입 조합원',s.prodMember+s.officeCount]]};return data};

<script>
/* Status effective dates: date-aware editing, with existing Supabase schema retained. */
(function(){
 const priorOpenEmployee=openEmployee;
 openEmployee=function(id=null,encoded=''){
  priorOpenEmployee(id,encoded);
  const status=document.getElementById('eStatus');
  const grid=document.querySelector('#modalBody .formgrid');
  if(!status||!grid)return;
  const person=id?db.employees.find(e=>String(e.id)===String(id)):null;
  const wrap=document.createElement('div');
  wrap.id='employmentStatusDates';
  wrap.style.cssText='grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px';
  wrap.innerHTML='<label id="exitDateLabel">퇴사일 <span style="color:#c2410c">*</span><input id="eExitDate" type="date" style="width:100%"></label><label id="leaveDateLabel">휴직 시작일 <span style="color:#c2410c">*</span><input id="eLeaveDate" type="date" style="width:100%"></label>';
  status.closest('label').insertAdjacentElement('afterend',wrap);
  document.getElementById('eExitDate').value=person?.exit_date||'';
  document.getElementById('eLeaveDate').value=person?.leave_date||'';
  const refresh=()=>{const st=status.value;document.getElementById('exitDateLabel').style.display=st==='퇴사'?'block':'none';document.getElementById('leaveDateLabel').style.display=st==='휴직'?'block':'none';};
  status.addEventListener('change',refresh);refresh();
 };
 const priorSaveEmployee=saveEmployee;
 saveEmployee=function(id){
  const st=document.getElementById('eStatus')?.value;
  const dateId=st==='퇴사'?'eExitDate':st==='휴직'?'eLeaveDate':null;
  const effective=dateId?document.getElementById(dateId)?.value:'';
  if(dateId&&!effective){alert(st==='퇴사'?'퇴사일을 선택한 후 저장해 주세요.':'휴직 시작일을 선택한 후 저장해 주세요.');document.getElementById(dateId)?.focus();return;}
  const employee=id?db.employees.find(e=>String(e.id)===String(id)):null;
  const oldStatus=employee?.status;
  const oldDate=employee?(st==='퇴사'?employee.exit_date:st==='휴직'?employee.leave_date:''):'';
  const before=db.employees.length;
  priorSaveEmployee(id);
  const target=id?db.employees.find(e=>String(e.id)===String(id)):(db.employees.length>before?db.employees.at(-1):null);
  if(!target||!dateId)return;
  const attr=st==='퇴사'?'exit_date':'leave_date';
  const changed=target[attr]!==effective;
  target[attr]=effective;
  // Previous wrappers may already have persisted the record, so persist effective date explicitly.
  if(changed){
   const h=(db.history||[]).find(x=>String(x.employee_id)===String(target.id)&&((st==='퇴사'&&x.event_type==='퇴사')||(st==='휴직'&&x.title==='휴직')));
   if(h&&oldStatus!==st)h.event_date=effective;
   else if(oldStatus===st&&oldDate!==effective)db.history.unshift({employee_id:target.id,event_date:effective,event_type:'상태변경',title:st+'일자 정정',description:(oldDate||'미기록')+' → '+effective,department:target.department,grade:target.grade});
   save();render();
  }
 };
})();
