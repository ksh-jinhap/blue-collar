 const metric=(label,value,note,cl='')=>'<div class="card"><div class="label">'+safe(label)+'</div><div class="num '+cl+'">'+safe(value)+'</div><div class="note">'+safe(note)+'</div></div>';
 const plansOf=y=>plansFor(y);
 const monthly=(p,m)=>{
   const raw=p?.months?.[m-1];
   return n(raw===undefined||raw===null||raw===''?p.target:raw);
 };
 const monthsIn=(y,m)=>plansOf(y).reduce((sum,p)=>sum+monthly(p,m),0);
 const table=(heads,rows,empty)=>'<div class="tablewrap"><table class="exec-report-table"><thead><tr>'+heads.map((h,i)=>'<th'+(i?' class="right"':'')+'>'+safe(h)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(row=>'<tr>'+row.map((c,i)=>'<td'+(i?' class="right"':'')+'>'+safe(c)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+heads.length+'" class="empty">'+safe(empty||'조회 자료 없음')+'</td></tr>')+'</tbody></table></div>';
 const section=(title,body,note='')=>'<section class="panel exec-section"><h2>'+title+'</h2>'+body+(note?'<div class="exec-report-note">'+safe(note)+'</div>':'')+'</section>';
 executiveView=function(){
   const y=Number(planYear),m=Number(planMonth),current=new Date(),monthKey=String(y)+'-'+String(m).padStart(2,'0');
   const nowKey=current.getFullYear()+'-'+String(current.getMonth()+1).padStart(2,'0');
   const isCurrent=monthKey===nowKey;
   const snap=typeof snapshotMonth==='function'?snapshotMonth(y,m):null;
   const planRows=plansOf(y),target=monthsIn(y,m);
   const active=(db.employees||[]).filter(e=>e.status!=='퇴사');
   const recorded=snap&&snap.units&&typeof snap.units==='object'?snap.units:null;
   const actualFor=p=>recorded?n(recorded[keyOf(p)]):isCurrent?unitCount(p):null;
   const actual=recorded?planRows.reduce((s,p)=>s+actualFor(p),0):isCurrent?planRows.reduce((s,p)=>s+unitCount(p),0):null;
   const shortage=actual===null?null:planRows.reduce((s,p)=>s+Math.max(0,monthly(p,m)-actualFor(p)),0);
   const excess=actual===null?null:planRows.reduce((s,p)=>s+Math.max(0,actualFor(p)-monthly(p,m)),0);
   const toRows=actual===null?[]:planRows.map(p=>({p,diff:actualFor(p)-monthly(p,m)}));
   const groups=new Map();
   for(const p of planRows){
     const key=[p.corporation||'미지정',p.headquarters||'미지정',p.department||'미지정'].join(' / ');

   const groupRows=[...groups.values()].sort((a,b)=>window.__hrExecOrgCompare(a.name,b.name)).map(g=>[g.name,val(g.target),g.actual===null?'미기록':val(g.actual),g.actual===null?'—':val(g.actual-g.target),g.actual===null?'—':rate(g.actual,g.target)]);
   const nextMonth=m===12?1:m+1,nextMonthYear=m===12?y+1:y,nextYear=y+1;
   const nextMonthPlans=plansOf(nextMonthYear),nextYearPlans=plansOf(nextYear);
   const annualBudget=nextYearPlans.length?nextYearPlans.reduce((s,p)=>s+n(p.target),0):null;
   const planRowsFuture=[['다음 달',nextMonthYear+'년 '+nextMonth+'월',nextMonthPlans.length?val(monthsIn(nextMonthYear,nextMonth))+'명':'계획 미등록'],['다음 연도',nextYear+'년',annualBudget===null?'계획 미등록':val(annualBudget)+'명']];
   const all=(db.employees||[]),hireInMonth=all.filter(e=>String(e.hire_date||'').slice(0,7)===monthKey).length;
   const isExited=e=>e.status==='퇴사';
   const exited=all.filter(isExited);
   const exitOn=e=>String(e.exit_date||e.retirement_date||'').slice(0,10);
   const monthExits=exited.filter(e=>exitOn(e).slice(0,7)===monthKey).length;

   const historicalDetails=Array.isArray(snap?.employee_details)?snap.employee_details:null;
   const historicalMonthHires=typeof snap?.hire_count==='number'?snap.hire_count:null;
   const historicalMonthExits=typeof snap?.exit_count==='number'?snap.exit_count:null;
   const hiresDisplay=isCurrent?hireInMonth:historicalMonthHires;
   const exitsDisplay=isCurrent?monthExits:historicalMonthExits;
   const hiresText=hiresDisplay===null?'미기록':val(hiresDisplay)+'명';
   const exitsText=exitsDisplay===null?'미기록':val(exitsDisplay)+'명';
   const yearlyText=isCurrent?val(yearExits)+'명':'기록 확인 필요';
   const leaderNames=['그룹장','파트장','라인장'];
   const leaderSource=isCurrent?active:historicalDetails?.filter(e=>e.status!=='퇴사');
   const leaderCounts=leaderSource?leaderNames.map(role=>leaderSource.filter(e=>e.field_leader_role===role).length):null;
   const membersSource=(isCurrent?active:historicalDetails?.filter(e=>e.status!=='퇴사'))?.filter(e=>String(e.position||'').trim()!=='계약직');
   const enrolled=membersSource?membersSource.filter(e=>e.union_status==='가입').length:null;
   const eligible=membersSource?membersSource.length:null;
   const office=isCurrent?(Array.isArray(db.office_union_members)?db.office_union_members.length:0):n(snap?.office_union_count);
   const officeKnown=isCurrent||snap?.office_union_count!=null;
   const header='<div class="report-head panel"><div><div class="smallcaps">WORKFORCE · EXECUTIVE SUMMARY</div><h2>'+safe(y+'년 '+m+'월 인력 운영 보고')+'</h2><span class="muted">작성일 '+safe(today())+' · '+(recorded?'월말 확정 인원':isCurrent?'현재 운영인원':'월말 기록 없음')+'</span></div><div class="no-print"><button type="button" class="btn" id="returnToDashboard">대시보드로 돌아가기</button> <button type="button" class="btn primary" onclick="window.print()">인쇄 / PDF 저장</button></div></div>';
   const summary='<div class="cards exec-five-metrics">'+metric('계획 정원',val(target),'선택월 사업계획')+metric('현재 운영인원',actual===null?'미기록':val(actual),recorded?'월말 확정':isCurrent?'계획 등록 조직 기준':'월말 기록 없음')+metric('부족 TO',shortage===null?'미기록':val(shortage),'부족 조직 아래 표시','negative')+metric('초과 TO',excess===null?'미기록':val(excess),'초과 조직 아래 표시','warning')+metric('충족률',actual===null?'미산정':rate(actual,target),'현재 운영 ÷ 계획 정원')+'</div>'+window.__hrExecToLists(toRows,actual!==null);
   const body=[
     section('01 · 인력 현황 요약',summary,'계획 미등록 조직의 운영 인원은 정원 충족률에 포함되지 않습니다. 계획 정원이 0명일 경우 충족률은 미산정으로 표시합니다.'),
     section('02 · 공정별 정/현원 및 변동현황',table(['법인 / 본부 / 부서','계획 정원','운영인원','차이(운영-계획)','충족률'],groupRows,'해당 연도에 등록된 사업계획이 없습니다.'),'조직별 계획과 실제 운영을 비교합니다. 양수(+)는 계획 초과, 음수(−)는 계획 대비 부족입니다.'),
     section('03 · 월간 입퇴사 현황','<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+metric('당월 입사자',hiresText,'입사일 기준')+metric('당월 퇴사자',exitsText,'퇴사일 기준')+metric('당해년도 누적 퇴사자',yearlyText,'연초~선택월 누적')+'</div>'+window.__hrExecFlowPanel(y,m),'왼쪽은 월별 그래프, 오른쪽은 월별 현황표입니다. 월말 확정 입퇴사 수가 없는 달은 미기록으로 표시하며 직원 등록기록에 따른 참고 수치는 별도로 구분합니다.'),
     section('04 · 향후 인력 운영 계획',table(['구분','기준 기간','사업계획 정원'],planRowsFuture),'다음 달은 해당 월의 등록 정원, 다음 연도는 다음 연도에 등록된 연간 기본 정원을 사용합니다. 실제 예상 인원을 임의로 추정하지 않습니다.'),
     section('05 · 현장관리자 인원 현황',table(['직책','운영 인원'],leaderNames.map((r,i)=>[r,leaderCounts?val(leaderCounts[i])+'명':'미기록']).concat([['현장관리자 합계',leaderCounts?val(leaderCounts.reduce((s,v)=>s+v,0))+'명':'미기록']])),'그룹장·파트장·라인장 중 등록된 직책을 기준으로 중복 없이 집계합니다.'),
     section('06 · 노동조합 인원 현황',table(['구분','인원'],[['생산직 노조 가입자',enrolled===null?'미기록':val(enrolled)+'명'],['생산직 운영 인원',eligible===null?'미기록':val(eligible)+'명'],['생산직 가입률',enrolled===null?'미산정':rate(enrolled,eligible)],['사무직 조합원',officeKnown?val(office)+'명':'미기록'],['전체 조합원',enrolled===null||!officeKnown?'미기록':val(enrolled+office)+'명']]),'노동조합 집계는 명단을 포함하지 않으며, 생산직은 직위가 계약직인 인원을 제외하고 가입 상태가 확인된 인원만 조합원으로 계산합니다.')
   ];
   return yearPicker()+header+body.join('');
 };
 document.addEventListener('click',ev=>{if(ev.target.closest('#returnToDashboard')){ev.preventDefault();setView('dashboard');}});

<script id="navFoldersScript">
/* Sidebar folder organization. Reuses existing menu buttons and their handlers; no data changes. */
(function(){
 'use strict';
 const sidebar=document.querySelector('.sidebar');
 const navs=sidebar?.querySelector('.navs');
 if(!sidebar||!navs||navs.dataset.folderized==='yes')return;
 const plan=[
  {title:'인원관리',icon:'▣',items:[['employees','생산직'],['recruitment','채용진행관리'],['forecast','정년예정자'],['bulk','일괄 인사발령'],['history','개인별 연혁']]},
  {title:'명부/현황',icon:'▣',items:[['organization','부서별 · 성별'],['hires','입사자'],['exits','퇴사자'],['conversion','정규직 전환 대상자'],['union','노동조합'],['leaders','현장관리자']]},
  {title:'OJT 관리',icon:'▣',items:[['interviews','면담기록'],['ojt','OJT 계획 및 이수']]},
  {title:'사업계획인원',icon:'▣',items:[['plans','사업계획 정원 · TO']]},
  {title:'시스템 관리',icon:'▣',items:[['master','기준정보 관리'],['audit','변경 기록'],['backup','저장 · 백업'],['cloud','3인 공유 설정']]}
 ];
 // Some versions used a different internal name for the same page.
 const aliases={leaders:['leader','supervisors','managers','siteleaders'],conversion:['conversions'],interviews:['interview'],hires:['hiresList']};
 const allButtons=Array.from(sidebar.querySelectorAll('button.nav[data-view]'));
 const byView=new Map(allButtons.map(b=>[b.dataset.view,b]));
 const dashboard=byView.get('dashboard');
 if(!dashboard)return;
 navs.dataset.folderized='yes';
 dashboard.textContent='▣ 대시보드';
 dashboard.style.fontWeight='800';
 navs.appendChild(dashboard);
 for(const item of plan){
   const group=document.createElement('div');group.className='nav-folder';
   const head=document.createElement('button');head.type='button';head.className='folder-head';
   head.setAttribute('aria-expanded','false');head.innerHTML='<span>▣ '+item.title+'</span><span class="folder-chevron" aria-hidden="true">▸</span>';
   const contents=document.createElement('div');contents.className='folder-items';contents.hidden=true;
   for(const [id,label] of item.items){
     const btn=byView.get(id)||aliases[id]?.map(k=>byView.get(k)).find(Boolean);
     if(!btn)continue;
     btn.textContent=label;contents.appendChild(btn);
   }
   if(!contents.children.length)continue;
   group.append(head,contents);navs.appendChild(group);
   head.addEventListener('click',()=>{
     const opening=contents.hidden;
     for(const other of navs.querySelectorAll('.folder-items'))other.hidden=true;
     for(const other of navs.querySelectorAll('.folder-head'))other.setAttribute('aria-expanded','false');
     contents.hidden=!opening;head.setAttribute('aria-expanded',String(opening));
   });
 }
 // Retain any menus from older/newer builds, rather than silently hiding them.
 const left=allButtons.filter(b=>b!==dashboard&&!b.closest('.folder-items'));
 if(left.length){
   const sys=Array.from(navs.querySelectorAll('.nav-folder')).find(g=>g.querySelector('.folder-head')?.textContent.includes('시스템 관리'));
   const target=sys?.querySelector('.folder-items');
   for(const b of left)(target||navs).appendChild(b);
 }
 // Remove decorative symbols from every submenu, including legacy entries.
 for(const button of navs.querySelectorAll('.folder-items button.nav')){
   button.textContent=button.textContent.replace(/^[^\p{L}\p{N}]+/u,'').trim();
 }
 // Expand the active group and keep selected items visible.
 function sync(){

<script id="employmentBreakdownScript">
/* Read-only headcount breakdown. Never modifies or saves employee records. */
(function(){
 'use strict';
 function active(e){return e&&e.status!=='퇴사';}
 function counts(rows){
  const out={regular:0,contract:0,unknown:0,total:0};
  for(const e of rows){if(!active(e))continue;out.total++;
   const isContract=String(e.position??'').trim()==='계약직';
   if(isContract)out.contract++;else out.regular++;
  }
  return out;
 }
 function badges(c){return '<div class="employment-split" aria-label="직위 기준 정규직·계약직 인원">'+
  '<span>정규직 '+c.regular.toLocaleString('ko-KR')+'명</span>'+
  '<span>계약직 '+c.contract.toLocaleString('ko-KR')+'명</span>'+
  (c.unknown?'<span class="unknown">미확인 '+c.unknown.toLocaleString('ko-KR')+'명</span>':'')+'</div>';}
 function annotateCard(html,labels,c){
  if(!c)return html;
  return html.replace(/<div class="card">[\s\S]*?<\/div>\s*<\/div>/g,block=>{
    if(!labels.some(label=>block.includes('<div class="label">'+label+'</div>')))return block;
    return block.replace(/(<div class="note">[\s\S]*?<\/div>)(\s*<\/div>)$/,(_,note,end)=>note+badges(c)+end);
  });
 }
 function allEmployees(){return Array.isArray(db?.employees)?db.employees:[];}
 function plannedEmployees(){
  if(typeof plansFor!=='function'||typeof keyOf!=='function')return [];
  const keys=new Set(plansFor(planYear).map(keyOf));
  return allEmployees().filter(e=>keys.has(keyOf(e)));
 }
 const originalDashboard=dashboard;
 dashboard=function(){const html=originalDashboard.apply(this,arguments);const now=new Date();const historical=typeof snapshotMonth==='function'&&typeof planMonth!=='undefined'&&(Number(planYear)!==now.getFullYear()||Number(planMonth)!==now.getMonth()+1)&&snapshotMonth(planYear,planMonth);if(historical)return html;return annotateCard(html,['현재 인원','현재 운영 인원','현재 운영인원'],counts(allEmployees()));};
 const originalPlans=plansView;

<script id="currentYearRetirementRoster">
/* Current-year retirement candidate roster. Read-only; does not alter saved HR data. */
(function(){
 'use strict';
 const previousForecastView=forecastView;
 function currentSeoulYear(){
   return Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric'}).format(new Date()));
 }
 function retirementCandidate(e, yearValue, ageLimit){
   if(!occupied(e)||e.position==='촉탁직'||e.reemployment_type==='정년 후 촉탁직')return null;
   const birthday=typeof employeeBirthDate==='function'?employeeBirthDate(e):'';
   const m=String(birthday||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
   if(m){
     const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);
     const at= y+ageLimit;
     if(at!==yearValue)return null;
     return {employee:e,date:`${at}-${m[2]}-${m[3]}`,basis:'생년월일 기준'};
   }
   const fromAge=retirementYear(e);
   if(fromAge!==yearValue)return null;
   return {employee:e,date:'확인 필요',basis:'연령자료 기준 추정'};
 }
 forecastView=function(){
   const base=previousForecastView.apply(this,arguments);
   const yearValue=currentSeoulYear();
   const ageLimit=Number(db.settings?.retirementAge??60);
   const limit=Number.isInteger(ageLimit)?ageLimit:60;
   const list=(Array.isArray(db.employees)?db.employees:[])
      .map(e=>retirementCandidate(e,yearValue,limit)).filter(Boolean)
      .sort((a,b)=>((a.date==='확인 필요'?'9999':a.date).localeCompare(b.date==='확인 필요'?'9999':b.date))||
        String(a.employee.corporation||'').localeCompare(String(b.employee.corporation||''),'ko')||
        String(a.employee.name||'').localeCompare(String(b.employee.name||''),'ko'));
   const rows=list.map(({employee:e,date,basis})=>`<tr>
     <td>${esc(e.employee_no)}</td><td><button type="button" class="btn tiny" onclick="openRetirementContractConversion(${hrEmployeeIdArg(e.id)})">${esc(e.name)} · 촉탁직 전환</button></td>
     <td>${esc(e.corporation)}</td><td>${esc(e.headquarters)}</td><td>${esc(e.department)}</td>
     <td>${esc(e.position)}</td><td>${esc(e.grade)}</td><td>${esc(employeeBirthDate(e))}</td>
     <td>${esc(date)}</td><td>${esc(basis)}</td>
   </tr>`).join('');
   const section=`<section class="panel" id="currentYearRetirementList">
     <div class="toolbar" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
       <h2 style="margin:0">${yearValue}년 정년 도래 예상자 명단</h2>
       <span class="pill good">총 ${fmt(list.length)}명</span>
     </div>
     <div class="notice">기준: 현재 퇴사하지 않은 직원 중 만 ${limit}세 도달 연도가 ${yearValue}년인 직원. 생년월일이 있으면 만 ${limit}세 생일을 <b>예상 도래일</b>로 표시하고, 생년월일이 없는 경우 기존 연령 자료로 연도만 추정합니다. 실제 정년퇴직일은 취업규칙과 인사발령에 따라 다를 수 있습니다.</div>
     <div class="tablewrap" style="max-height:460px;overflow:auto"><table><thead><tr>
       <th>사번</th><th>성명</th><th>법인</th><th>본부/실</th><th>부서/팀</th><th>직위</th><th>직급</th><th>생년월일</th><th>정년 도래 예상일</th><th>산정 기준</th>
     </tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">올해 정년 도래 예상자가 없습니다.</td></tr>'}</tbody></table></div>
   </section>`;
   // The list is displayed immediately after the existing year picker / KPI cards.
   const marker='<section class="panel">';
   const idx=base.indexOf(marker);
   return idx>=0?base.slice(0,idx)+section+base.slice(idx):section+base;
 };
})();
</script>
<script>

  const notice=matching.length?`${year}년 ${month}월 월말 확정 명단에도 추가됩니다. 확정 당시의 운영인원·부서별 운영인원은 변경하지 않습니다.`:`${year}년 ${month}월의 월말 상세 기록이 없어 현재 퇴사자 명단에만 추가됩니다.`;

 const oldRender=render;
 render=function(){oldRender();if(view!=='exits'||!window.__hrCloudConnected?.())return;const root=$id('content');if(!root)return;

<script id="monthlyRecruitmentAndRetirementContractFix">
(function(){

 originalRecruitmentOpen(id,encoded);

saveRecruitment=function(id){
 const corp=get('rCorp'),hq=get('rHQ'),dept=get('rDept'),stage=get('rStage');
 const completed=document.getElementById('rCompleted')?.value||'';
 if(!corp||!hq||!dept)return alert('법인·본부·부서를 입력하세요.');
 if(stage==='입사 완료'&&!dateValid(completed))return alert('입사 완료 단계에서는 실제 입사 완료일을 입력해야 합니다.');

 if(id){const r=db.recruitment.find(x=>String(x.id)===String(id));if(!r)return alert('채용 건을 찾지 못했습니다.');Object.assign(r,o)}

recruitmentView=function(){

 <section class="panel"><div class="toolbar"><input id="recruitSearch" placeholder="대상자·부서·요청번호 검색" value="${str(recruitmentSearch)}"><button class="btn primary" onclick="openRecruitment()">+ 채용 건 등록</button></div>

 <div class="tablewrap"><table><thead><tr><th>접수일</th><th>요청번호</th><th>법인 / 부서</th><th>대상자</th><th>진행 단계</th><th>입사 예정일</th><th>실제 입사 완료일</th><th>메모</th><th>관리</th></tr></thead><tbody>

};
// Conversion retains the original employment spell as a former employee and creates a new, linked employment spell.
window.openRetirementContractConversion=function(id){

 if(e.status==='퇴사')return alert('이미 퇴사한 직원입니다. 기존 기록을 확인하세요.');
 if((db.employees||[]).some(x=>String(x.previous_employee_id)===String(e.id)))return alert('이미 이 직원의 촉탁직 전환 기록이 존재합니다.');
 modal('정년 후 촉탁직 전환 · '+str(e.name),`<div class="notice">기존 사번 <b>${str(e.employee_no)}</b>의 근속 이력은 보존하며, 전환일 전날 기존 근무기록을 종료합니다. 새 사번과 새 입사일로 촉탁직 근무기록을 만듭니다. 다른 직원 정보는 이어받습니다.</div><div class="formgrid">${field('새 사번 *','reContractNo','','text','required')}${field('촉탁직 재입사일 *','reContractDate',today(),'date','required')}${field('기존 근무 종료일 *','reContractExit','','date','required')}</div><div class="hint">기존 종료일은 새 입사일 전날을 기본으로 합니다. 실제 인사발령일과 일치하는지 확인하세요. 전환일이 오늘 이후인 경우 이 기능으로 미리 전환할 수 없습니다.</div><div class="modalactions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveRetirementContractConversion(${hrEmployeeIdArg(e.id)})">촉탁직 전환 저장</button></div>`);
 const input=document.getElementById('reContractDate'),exit=document.getElementById('reContractExit');
 const update=()=>{if(!dateValid(input.value))return;let d=new Date(input.value+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);exit.value=d.toISOString().slice(0,10);};
 input.addEventListener('change',update);update();
};
window.saveRetirementContractConversion=function(id){
 const old=(db.employees||[]).find(x=>String(x.id)===String(id));
 if(!old||old.status==='퇴사')return alert('기존 직원의 재직 상태를 확인하세요.');
 const no=document.getElementById('reContractNo')?.value.trim(),start=document.getElementById('reContractDate')?.value,exit=document.getElementById('reContractExit')?.value;
 if(!no||!dateValid(start)||!dateValid(exit)||exit>=start)return alert('새 사번, 새 입사일, 기존 근무 종료일을 정확하게 입력하세요.');
 if(start>today())return alert('미래 일자는 전환할 수 없습니다. 실제 전환일 이후에 처리하세요.');
 if(old.hire_date&&dateValid(old.hire_date)&&exit<old.hire_date)return alert('기존 근무 종료일이 과거 입사일보다 빠릅니다.');
 if((db.employees||[]).some(e=>String(e.employee_no||'').trim()===no))return alert('이미 사용 중이거나 과거에 사용된 사번입니다. 다른 사번을 입력하세요.');
 if((db.employees||[]).some(e=>String(e.previous_employee_id)===String(old.id)))return alert('이미 촉탁직 재입사 기록이 존재합니다.');
 if(!confirm(`${old.name} · 기존 사번 ${old.employee_no} 종료 ${exit}\n새 사번 ${no} · 촉탁직 입사 ${start}\n\n기존 기록을 보존하고 새 촉탁직 근무기록을 생성하시겠습니까?`))return;
 const newId=uid();
 const newer={...old,id:newId,employee_no:no,hire_date:start,position:'촉탁직',status:'재직',previous_employee_id:old.id,previous_employee_no:old.employee_no,reemployment_type:'정년 후 촉탁직',reemployment_date:start};
 for(const k of ['exit_date','retirement_date','scheduled_exit_date','exit_reason','leave_date','leave_start_date','leave_end_date','conversion_date','conversion_scheduled_date'])delete newer[k];
 old.status='퇴사';old.exit_date=exit;old.exit_reason='정년 후 촉탁직 재입사';old.next_employee_id=newId;
 db.employees.push(newer);
 db.history??=[];
 db.history.unshift({employee_id:old.id,event_date:exit,event_type:'퇴사',title:'정년 종료 · 촉탁직 재입사',description:`기존 사번 ${old.employee_no} 종료, 새 사번 ${no} 연계`,department:old.department,grade:old.grade});
 db.history.unshift({employee_id:newId,event_date:start,event_type:'입사',title:'촉탁직 재입사',description:`기존 사번 ${old.employee_no}에서 새 사번 ${no}로 전환`,department:newer.department,grade:newer.grade});
 closeModal();commit('정년 후 촉탁직 전환',old.name+' / '+old.employee_no+' → '+no+' / '+start);
 alert('촉탁직 전환 기록을 저장 요청했습니다. 공동 DB 저장 완료 상태와 신규 직원 정보를 확인하세요.');
};
})();
</script>

<script>
/* Regular-conversion history: actual dates are authoritative; bulk estimates live in a separate field. */
(function(){
 'use strict';
 const iso=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?String(s):'';
 const valid=s=>{if(!iso(s))return false;const [y,m,d]=s.split('-').map(Number);const v=new Date(Date.UTC(y,m-1,d));return v.getUTCFullYear()===y&&v.getUTCMonth()===m-1&&v.getUTCDate()===d;};
 function estimatedConversion(hire){
  if(!valid(hire))return '';
  const [y,m]=hire.split('-').map(Number);
  // The hire month is month 1; conversion follows the final day of month 3.
  return new Date(Date.UTC(y,m+2,1)).toISOString().slice(0,10);
 }
 function regular(e){return String(e?.employment_type||'').trim()==='정규직';}
 function actual(e){return valid(e?.conversion_date)?e.conversion_date:'';}
 function savedEstimate(e){
  if(!valid(e?.regular_conversion_estimated_date))return '';
  // A changed hire date invalidates an older derived value; recompute for display.
  return e.regular_conversion_estimated_date===estimatedConversion(e.hire_date)?e.regular_conversion_estimated_date:'';
 }
 window.hrRegularConversionLabel=function(e){
  if(actual(e))return actual(e);
  if(!regular(e))return '—';
  return savedEstimate(e)||estimatedConversion(e.hire_date)||'—';
 };
 window.hrRegularConversionSource=function(e){
  if(actual(e))return '실제 등록일';
  if(!regular(e))return '전환 기록 없음';
  const est=savedEstimate(e)||estimatedConversion(e.hire_date);
  return est?(savedEstimate(e)?'계산값 · 저장됨':'계산값 · 미저장'):'입사일 확인 필요';
 };
 window.hrBulkEstimateRegularDates=function(){
  const employees=Array.isArray(db.employees)?db.employees:[];
  const candidates=employees.filter(e=>regular(e)&&!actual(e)&&valid(e.hire_date));
  const changes=candidates.filter(e=>e.regular_conversion_estimated_date!==estimatedConversion(e.hire_date));
  const skipped=employees.filter(e=>regular(e)&&!actual(e)&&!valid(e.hire_date)).length;
  if(!changes.length){alert('새로 계산해 저장할 정규직 전환일이 없습니다.'+(skipped?'\n입사일 확인 필요: '+skipped+'명':''));return;}
  if(!confirm('정규직 전환일 미등록 직원 '+changes.length+'명의 계산값을 별도 저장하시겠습니까?\n\n입사월 포함 3개월째 말일의 다음 날로 계산합니다.\n이미 등록된 실제 전환일은 수정하지 않습니다.\n실제 확인된 전환일과 계산값은 상세정보에서 구분됩니다.'))return;
  changes.forEach(e=>{
   e.regular_conversion_estimated_date=estimatedConversion(e.hire_date);
   e.regular_conversion_estimate_rule='입사월 포함 3개월째 말일 다음 날';
  });
  if(typeof commit==='function')commit('정규직 전환일 계산값 일괄 등록',changes.length+'명 · 기존 실제 전환일 유지 · 입사일 확인 필요 '+skipped+'명');
  else if(typeof save==='function'){save();render();}
  alert('계산값 '+changes.length+'명의 저장을 요청했습니다. 상단의 공동 저장 상태를 확인하세요.'+(skipped?'\n입사일 확인 필요: '+skipped+'명':''));
 };
})();
</script>

<script>
(function(){
 'use strict';
 const groups=[
  {label:'휴직',list:'leave_periods',fields:['leave_start_date','leave_end_date'],input:['eLeaveDate','eLeaveEnd']},
  {label:'산재',list:'industrial_accident_periods',fields:['industrial_accident_start_date','industrial_accident_end_date'],input:['eAccidentStart','eAccidentEnd']},
  {label:'육아휴직',list:'parental_leave_periods',fields:['parental_leave_start_date','parental_leave_end_date'],input:['eParentalStart','eParentalEnd']}
 ];
 const el=id=>document.getElementById(id);
 const value=id=>el(id)?.value||'';
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const validDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d};
 const normalize=record=>({start_date:String(record?.start_date||record?.start||''),end_date:String(record?.end_date||record?.end||'')});
 function periods(e,g){
  const arr=e?.[g.list];
  if(Array.isArray(arr))return arr.map(normalize).filter(p=>p.start_date||p.end_date);
  const start=String(e?.[g.fields[0]]||(g.list==='leave_periods'?e?.leave_date:'')||'');
  const end=String(e?.[g.fields[1]]||'');
  return start||end?[{start_date:start,end_date:end}]:[];
 }
 window.hrEmployeeLeavePeriods=function(e){return groups.map(g=>({label:g.label,periods:periods(e,g)}));};
 const previousOpen=window.openEmployee;
 window.openEmployee=function(id=null,encoded=''){
  const result=previousOpen(id,encoded);
  const status=el('eStatus');const form=status?.closest('.formgrid');if(!form)return result;
  const employee=id==null?null:(db.employees||[]).find(e=>String(e.id)===String(id));
  const panel=document.createElement('section');panel.id='hrMultiPeriodPanel';panel.className='hr-multi-periods';
  panel.innerHTML='<h3>휴직 · 산재 · 육아휴직 회차별 관리</h3><p>각 유형별로 여러 기간을 추가할 수 있습니다. 기존 등록 기간은 자동으로 첫 회차에 표시됩니다. 삭제할 회차는 해당 줄의 삭제 버튼을 누르세요.</p>'+groups.map((g,i)=>'<div class="hr-period-section"><div class="hr-period-head"><b>'+g.label+'</b><button type="button" class="btn tiny" data-hr-add="'+i+'">+ 회차 추가</button></div><div id="hrPeriodGroup_'+i+'"></div></div>').join('');
  form.appendChild(panel);
  function redraw(i){
   const host=el('hrPeriodGroup_'+i);if(!host)return;
   const records=panel.__periods[i];
   host.innerHTML=records.length?records.map((rec,j)=>'<div class="hr-period-row" data-hr-round="'+j+'"><strong>'+ (j+1)+'회차</strong><label>시작일<input type="date" data-hr-field="start_date" data-hr-idx="'+i+'" data-hr-roundidx="'+j+'" value="'+safe(rec.start_date)+'"></label><label>종료일<input type="date" data-hr-field="end_date" data-hr-idx="'+i+'" data-hr-roundidx="'+j+'" value="'+safe(rec.end_date)+'"></label><button type="button" class="btn tiny danger" data-hr-delete="'+i+'" data-hr-roundidx="'+j+'">삭제</button></div>').join(''):'<p class="hint">등록된 기간 없음</p>';
  }
  panel.__periods=groups.map(g=>periods(employee,g));groups.forEach((g,i)=>redraw(i));
  panel.addEventListener('input',event=>{
   const node=event.target.closest('[data-hr-field]');if(!node)return;
   const i=Number(node.dataset.hrIdx),j=Number(node.dataset.hrRoundidx);
   if(panel.__periods[i]?.[j])panel.__periods[i][j][node.dataset.hrField]=node.value;
  });
  panel.addEventListener('click',event=>{
   const add=event.target.closest('[data-hr-add]');if(add){const i=Number(add.dataset.hrAdd);panel.__periods[i].push({start_date:'',end_date:''});redraw(i);return;}
   const del=event.target.closest('[data-hr-delete]');if(del){const i=Number(del.dataset.hrDelete),j=Number(del.dataset.hrRoundidx);panel.__periods[i].splice(j,1);redraw(i);}
  });
  // Hide previous single-period editors; keep input nodes for legacy save wrappers.
  const previousFields=[el('employmentStatusDates'),el('hrAdditionalLeaveDates'),el('parentalLeavePeriod')];
  function hide(){previousFields.forEach(node=>{if(node)node.style.setProperty('display','none','important')});}
  hide();status.addEventListener('change',hide);
  return result;
 };
 const previousSave=window.saveEmployee;
 window.saveEmployee=function(id){
  const panel=el('hrMultiPeriodPanel');if(!panel)return previousSave(id);
  // Pick up last edited value even when the date field has not blurred.
  panel.querySelectorAll('[data-hr-field]').forEach(node=>{const i=Number(node.dataset.hrIdx),j=Number(node.dataset.hrRoundidx);if(panel.__periods[i]?.[j])panel.__periods[i][j][node.dataset.hrField]=node.value;});
  const newLists=panel.__periods.map(rows=>rows.map(normalize));
  for(let i=0;i<groups.length;i++){
   let lastEnd='';
   const sorted=[...newLists[i]].sort((a,b)=>a.start_date.localeCompare(b.start_date));
   for(const record of sorted){
    const {start_date:start,end_date:end}=record;
    if(!start||!end||!validDate(start)||!validDate(end)||end<start){alert(groups[i].label+'의 모든 회차에 올바른 시작일과 종료일을 입력해 주세요.');return;}
    if(lastEnd&&start<=lastEnd){alert(groups[i].label+'의 회차 간 기간이 겹칩니다. 날짜를 확인해 주세요.');return;}
    lastEnd=end;
   }
   newLists[i]=sorted;
  }
  const status=value('eStatus');const required={'휴직':0,'산재':1,'육아휴직':2}[status];
  if(required!==undefined&&!newLists[required].length){alert(status+' 상태에서는 해당 기간을 1회차 이상 등록해 주세요.');return;}
  // Legacy single-period fields represent only the most recent round.
  const latest=newLists.map(rows=>rows.length?rows[rows.length-1]:{start_date:'',end_date:''});
  groups.forEach((g,i)=>g.input.forEach((input,j)=>{const node=el(input);if(node)node.value=j===0?latest[i].start_date:latest[i].end_date;}));
  const beforeCount=(db.employees||[]).length;
  const old=id==null?null:(db.employees||[]).find(e=>String(e.id)===String(id));
  const priorLists=groups.map(g=>periods(old,g));
  const result=previousSave(id);
  const target=id==null?((db.employees||[]).length>beforeCount?db.employees.at(-1):null):(db.employees||[]).find(e=>String(e.id)===String(id));
  if(!target||target.status!==status)return result;
  let changed=false;
  groups.forEach((g,i)=>{
   const oldRecords=priorLists[i],rows=newLists[i];
   if(JSON.stringify(oldRecords)!==JSON.stringify(rows)){
    target[g.list]=rows.map(p=>({...p}));
    changed=true;
    const oldSet=new Set(oldRecords.map(p=>p.start_date+'|'+p.end_date));
    const newSet=new Set(rows.map(p=>p.start_date+'|'+p.end_date));
    db.history??=[];
    rows.filter(p=>!oldSet.has(p.start_date+'|'+p.end_date)).forEach(p=>db.history.unshift({employee_id:target.id,event_date:p.start_date,event_type:'상태변경',title:g.label+' 회차 등록·수정',description:p.start_date+' ~ '+p.end_date,department:target.department,grade:target.grade}));
    oldRecords.filter(p=>!newSet.has(p.start_date+'|'+p.end_date)).forEach(p=>db.history.unshift({employee_id:target.id,event_date:new Date().toISOString().slice(0,10),event_type:'상태변경',title:g.label+' 회차 삭제·정정',description:p.start_date+' ~ '+p.end_date,department:target.department,grade:target.grade}));
   }
   for(let j=0;j<2;j++){
    const key=g.fields[j],newVal=j===0?latest[i].start_date:latest[i].end_date;
    if(String(target[key]||'')!==newVal){target[key]=newVal;changed=true;}
   }
  });
  if(String(target.leave_date||'')!==latest[0].start_date){target.leave_date=latest[0].start_date;changed=true;}
  if(changed){
   if(typeof commit==='function')commit('휴직·산재 회차별 기간 변경',target.employee_no+' '+target.name+' · 기간 정보 갱신');
   else {save();render();}
  }
  return result;
 };
})();
</script>
<script id="sameNameRosterScript">
/* Read-only same-name roster. Identical names are not proof of different identities. */
(function(){
 'use strict';
 const navGroup=Array.from(document.querySelectorAll('.nav-folder')).find(g=>g.querySelector('.folder-head')?.textContent.includes('명부/현황'));
 const menu=navGroup?.querySelector('.folder-items');
 if(!menu || menu.querySelector('[data-view="same-names"]'))return;
 const button=document.createElement('button');
 button.type='button';button.className='nav';button.dataset.view='same-names';button.textContent='동명이인';
 menu.appendChild(button);
 button.addEventListener('click',()=>setView('same-names'));
 names['same-names']=['동명이인 명부','성명이 같은 직원의 사번·소속·상태를 비교합니다.'];
 const normalizeName=value=>String(value??'').normalize('NFC').trim().replace(/\s+/g,' ');
 const safe=value=>typeof esc==='function'?esc(String(value??'')):String(value??'');
 function sameNameGroups(){
  const byName=new Map();
  for(const person of Array.isArray(db?.employees)?db.employees:[]){
   const name=normalizeName(person.name);
   if(!name)continue;
   if(!byName.has(name))byName.set(name,[]);
   byName.get(name).push(person);
  }
  return [...byName.entries()].filter(([,rows])=>rows.length>=2)
   .sort((a,b)=>a[0].localeCompare(b[0],'ko-KR'))
   .map(([name,rows])=>({name,rows:rows.slice().sort((a,b)=>String(a.employee_no??'').localeCompare(String(b.employee_no??''),'ko-KR'))}));
 }
 function viewSameNames(){
  const groups=sameNameGroups();
  const people=groups.reduce((count,g)=>count+g.rows.length,0);
  return `<div class="cards">${card('동일 성명 그룹',groups.length,'2건 이상 등록된 성명')}${card('해당 직원 기록',people,'퇴사자 포함 · 등록 기록 기준')}</div>`+

<script id="unionRosterSearchEnhancement">
/* Member lookup in the Labor Union view. Read-only; shares the existing IME-safe unionSearch state. */
(function(){
 'use strict';
 const priorUnionView=unionView;
 const safe=v=>esc(String(v??''));
 const normalize=v=>String(v??'').normalize('NFC').trim().toLocaleLowerCase('ko-KR');
 unionView=function(){
   const base=priorUnionView();
   const term=normalize(unionSearch);
   const prod=(Array.isArray(db.employees)?db.employees:[])
     .filter(e=>e.union_status==='가입'&&e.status!=='퇴사'&&String(e.position||'').trim()!=='계약직')

     .sort((a,b)=>String(a.name??'').localeCompare(String(b.name??''),'ko-KR')||String(a.employee_no??'').localeCompare(String(b.employee_no??'')));

   const insertAfter=base.indexOf('</div>');

<script id="unionActualRosterLookup">
/* Search the actual monthly/current union roster, not only the legacy unionView. */
(function(){
  'use strict';
  let query='';
  const normalize=v=>String(v||'').normalize('NFC').toLocaleLowerCase('ko-KR').trim();
  const earlierRender=render;
  function applyFilter(){
    const field=document.getElementById('unionActualSearch');
    if(!field)return;
    query=field.value;
    const term=normalize(query);
    let visible=0;
    document.querySelectorAll('[data-union-roster-table]').forEach(table=>{
      let count=0;
      table.querySelectorAll('tbody tr').forEach(tr=>{
        const cells=tr.querySelectorAll('td');
        if(cells.length<2)return;
        const match=!term||normalize(cells[0].textContent).includes(term)||normalize(cells[1].textContent).includes(term);
        tr.hidden=!match;
        tr.style.display=match?'':'none';
        if(match)count++;
      });
      visible+=count;
    });
    const countEl=document.getElementById('unionActualResultCount');
    if(countEl)countEl.textContent=`검색 결과 ${visible}명`;
  }
  function mountSearch(){
    if(view!=='union')return;
    const content=document.getElementById('content');
    if(!content||content.querySelector('#unionActualSearch'))return;
    const panels=[...content.querySelectorAll('section.panel')].filter(panel=>{
      const heading=panel.querySelector('h2');
      return heading&&/^(생산직 조합원 명단|사무직 조합원 명단)/.test(heading.textContent.trim())&&panel.querySelector('table');
    });
    if(!panels.length)return;
    for(const panel of panels)panel.querySelector('table').setAttribute('data-union-roster-table','');
    const bar=document.createElement('section');
    bar.className='panel no-print';
    bar.innerHTML='<h2>조합원 검색</h2><div class="toolbar"><input id="unionActualSearch" type="search" autocomplete="off" placeholder="사번 또는 이름 검색" aria-label="조합원 사번 또는 성명 검색" style="min-width:220px;flex:1"><span class="hint" id="unionActualResultCount"></span></div><p class="hint">아래 생산직·사무직 조합원 명단에서 일치하는 인원만 표시합니다.</p>';
    panels[0].parentNode.insertBefore(bar,panels[0]);
    const field=bar.querySelector('#unionActualSearch');
    field.value=query;
    field.addEventListener('input',applyFilter);
    field.addEventListener('search',applyFilter);
    applyFilter();
  }
  render=function(){
    const result=earlierRender.apply(this,arguments);
    mountSearch();
    return result;
  };
  // Leave the input mounted while entering Korean; no render() call on keystrokes.
})();
</script>

<script>
/* Standalone UI extension for per-employee photo upload and read-only detail preview.
   Photos are stored outside the hr_shared_state JSON, so they never inflate saves/backups. */
(function(){
 'use strict';
 const MAX_INPUT=10*1024*1024,MAX_OUTPUT=450*1024;
 const photoUrls=new WeakMap();
 function panel(id,editable){
  const box=document.createElement('section');box.className='hr-photo-card';box.dataset.photoEmployee=String(id);
  box.innerHTML='<div class="hr-photo-placeholder" role="img" aria-label="등록된 사진 없음">사진 없음</div><div class="hr-photo-controls"><strong>직원 사진</strong><p class="hr-photo-status" aria-live="polite">비공개 저장소에서 사진 확인 중…</p>'+
   (editable?'<input type="file" accept="image/jpeg,image/png,image/webp" aria-label="직원 사진 선택"><div><button type="button" class="btn tiny primary" data-photo-upload>사진 등록·교체</button><button type="button" class="btn tiny danger" data-photo-remove>사진 삭제</button></div><p>JPG·PNG·WEBP, 최대 10MB · 자동 축소 저장. 직원 정보를 먼저 등록해야 사진을 추가할 수 있습니다.</p>':'')+'</div>';
  if(editable){box.querySelector('[data-photo-upload]').addEventListener('click',()=>uploadPhoto(box,id));box.querySelector('[data-photo-remove]').addEventListener('click',()=>removePhoto(box,id));}
  showPhoto(box,id);return box;
 }
 function status(box,text){const el=box.querySelector('.hr-photo-status');if(el)el.textContent=text;}
 function replacePreview(box,blob){
  const previous=photoUrls.get(box);if(previous)URL.revokeObjectURL(previous);
  const old=box.querySelector('.hr-photo-image,.hr-photo-placeholder');if(!old)return;
  if(blob){const url=URL.createObjectURL(blob);photoUrls.set(box,url);const img=document.createElement('img');img.className='hr-photo-image';img.alt='직원 등록 사진';img.src=url;old.replaceWith(img);}
  else{photoUrls.delete(box);const placeholder=document.createElement('div');placeholder.className='hr-photo-placeholder';placeholder.textContent='사진 없음';old.replaceWith(placeholder);}
 }
 async function showPhoto(box,id){
  const api=window.__hrPhotoStorage;if(!api?.ready()){status(box,'공동 DB 로그인 후 사진을 조회할 수 있습니다.');return;}
  try{const blob=await api.load(id);if(!box.isConnected)return;replacePreview(box,blob);status(box,blob?'등록된 사진':'등록된 사진 없음');}
  catch(error){if(box.isConnected)status(box,'사진 조회 오류: '+error.message);}
 }
 async function compress(file){
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG·PNG·WEBP 파일을 선택해 주세요.');
  if(file.size>MAX_INPUT)throw Error('원본 사진은 10MB 이하만 등록할 수 있습니다.');
  const bitmap=await createImageBitmap(file);try{
   const scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('사진을 처리할 수 없습니다.');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
   const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.78));
   if(!blob||blob.size>MAX_OUTPUT)throw Error('사진 용량이 너무 큽니다. 다른 사진을 사용해 주세요.');
   return blob;
  }finally{bitmap.close();}
 }
 function busy(box,yes){box.querySelectorAll('button,input').forEach(el=>el.disabled=yes);}
 async function uploadPhoto(box,id){
  const file=box.querySelector('input[type=file]')?.files?.[0];if(!file){alert('등록할 사진을 먼저 선택해 주세요.');return;}
  const api=window.__hrPhotoStorage;if(!api?.ready()){alert('공동 DB 로그인 후 등록할 수 있습니다.');return;}
  busy(box,true);status(box,'사진 축소 및 업로드 중…');
  try{const blob=await compress(file);await api.replace(id,blob);if(box.isConnected){replacePreview(box,blob);status(box,'사진 저장 완료 · '+Math.ceil(blob.size/1024)+'KB');box.querySelector('input[type=file]').value='';}}
  catch(error){if(box.isConnected)status(box,'사진 저장 실패: '+error.message);alert('사진 등록 실패: '+error.message);}
  finally{if(box.isConnected)busy(box,false);}
 }
 async function removePhoto(box,id){
  if(!confirm('이 직원의 등록된 사진을 삭제하시겠습니까? 직원 인사정보는 변경되지 않습니다.'))return;
  const api=window.__hrPhotoStorage;if(!api?.ready()){alert('공동 DB 로그인이 필요합니다.');return;}
  busy(box,true);status(box,'사진 삭제 중…');
  try{await api.remove(id);if(box.isConnected){replacePreview(box,null);status(box,'사진 삭제 완료');}}
  catch(error){if(box.isConnected)status(box,'사진 삭제 실패: '+error.message);alert('사진 삭제 실패: '+error.message);}
  finally{if(box.isConnected)busy(box,false);}
 }
 // Wrap final openEmployee implementation, without changing saveEmployee / shared JSON.
 const existingOpen=openEmployee;
 openEmployee=function(id=null,encoded=''){
  const result=existingOpen.apply(this,arguments);
  const e=id==null?null:(db.employees||[]).find(x=>String(x.id)===String(id));
  const body=document.querySelector('#modalBody');if(body&&!body.querySelector('.hr-photo-card')){
   if(e){body.insertBefore(panel(e.id,true),body.firstChild);}
   else{const note=document.createElement('div');note.className='notice';note.textContent='직원 사진은 신규 직원 정보를 저장한 다음 수정 화면에서 등록할 수 있습니다.';body.insertBefore(note,body.firstChild);}
  }
  return result;
 };
 // The detail view is opened by an existing document click listener. Inject the
 // photo after that listener has produced its read-only modal (no DOM re-render).
 document.addEventListener('click',event=>{
  const link=event.target.closest('[data-employee-detail]');if(!link)return;
  const id=link.getAttribute('data-employee-detail');
  const body=document.querySelector('#modalBody');
  if(body&&document.querySelector('#modalWrap.open')&&body.querySelector('.hr-detail-summary')&&!body.querySelector('.hr-photo-card'))body.insertBefore(panel(id,false),body.firstChild);
 });
})();
</script>

 function rowStatus(i,v){rows[i].status=v;const cell=el('hrBulkPhotoStatus'+i);if(cell)cell.textContent=v;}
 function stage(files){
  if(running)return;
  rows=[];progress('');
  if(files.length>MAX_FILES){progress('최대 1,000개까지만 선택할 수 있습니다. 파일을 나누어 선택해 주세요.');renderRows();return;}
  const employeeMap=new Map();
  for(const e of db.employees||[]){const n=cleanedNo(e.employee_no);if(!n)continue;if(!employeeMap.has(n))employeeMap.set(n,[]);employeeMap.get(n).push(e);}
  const namesCount=new Map();
  for(const file of files){const item=basename(file.name);if(item)namesCount.set(item.no,(namesCount.get(item.no)||0)+1);}
  for(const file of files){
   const item=basename(file.name),no=item?.no||'', matches=employeeMap.get(no)||[];
   const row={file,no,employee:matches.length===1?matches[0]:null,status:'',valid:false};
   if(!item)row.status='지원하지 않는 파일명/확장자';
   else if(!no)row.status='사번이 비어 있음';
   else if(file.size>MAX_FILE)row.status='원본 파일 10MB 초과';
   else if(file.size===0)row.status='빈 파일';
   else if(namesCount.get(no)>1)row.status='같은 사번의 사진 여러 장 (제외)';
   else if(matches.length===0)row.status='일치하는 사번 없음';
   else if(matches.length>1)row.status='동일 사번 직원 여러 명 (제외)';
   else if(!/^[0-9]{1,20}$/.test(String(row.employee.id)))row.status='직원 식별값 오류';
   else {row.valid=true;row.status='등록 가능';}
   rows.push(row);
  }
  renderRows();
  progress(rows.length?'매칭 결과를 확인한 다음 등록 시작을 눌러 주세요.':'사진 파일을 선택해 주세요.');
 }
 async function compress(file){
  const extension=basename(file.name)?.ext;
  if(!extension||!MIME[extension])throw Error('지원하지 않는 이미지 형식');
  if(file.size>MAX_FILE)throw Error('10MB 초과');
  // Actual decoding detects invalid or disguised image files; always output JPEG.
  const bitmap=await createImageBitmap(file);
  try{
   const scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
   const context=canvas.getContext('2d');if(!context)throw Error('이미지 변환 실패');
   context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);
   const data=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.78));
   if(!data||data.size>MAX_OUTPUT)throw Error('사진 압축 결과가 450KB를 초과합니다.');
   return data;
  }finally{bitmap.close();}
 }
 async function uploadAll(){
  if(running||!window.__hrPhotoStorage?.ready())return;
  const candidates=rows.map((r,i)=>({...r,index:i})).filter(r=>r.valid);
  if(!candidates.length)return;
  const overwrite=el('hrBulkPhotoOverwrite')?.checked===true;
  if(!confirm(`매칭된 사진 ${candidates.length}장을 등록하시겠습니까?\n${overwrite?'기존에 등록된 사진도 교체됩니다.':'기존 사진이 있으면 건너뜁니다.'}\n저장 후 사진은 Supabase에 즉시 반영됩니다.`))return;
  running=true;cancelled=false;
  el('hrBulkPhotoStart').disabled=true;el('hrBulkPhotoFiles').disabled=true;el('hrBulkPhotoOverwrite').disabled=true;el('hrBulkPhotoCancel').disabled=false;
  const api=window.__hrPhotoStorage;
  let saved=0,skipped=0,failed=0,processed=0;
  try{
   for(const row of candidates){
    if(cancelled)break;
    const i=row.index;
    try{
     // Ensure a later employee roster change cannot silently remap a filename.
     const matches=(db.employees||[]).filter(e=>cleanedNo(e.employee_no)===row.no);
     if(matches.length!==1||String(matches[0].id)!==String(row.employee.id))throw Error('직원 명단이 바뀌었습니다. 파일을 다시 선택해 주세요.');
     rowStatus(i,'사진 저장 여부 확인 중…');
     if(!overwrite){const prior=await api.load(row.employee.id);if(prior){skipped++;rowStatus(i,'기존 사진 보존 · 건너뜀');processed++;progress(`처리 ${processed}/${candidates.length} · 저장 ${saved} · 건너뜀 ${skipped} · 실패 ${failed}`);continue;}}
     rowStatus(i,'이미지 변환 및 업로드 중…');
     const blob=await compress(row.file);
     // Single-photo upload uses the same authenticated Storage API and internal ID path.
     await api.replace(row.employee.id,blob);
     saved++;rowStatus(i,'저장 완료 ('+Math.ceil(blob.size/1024)+'KB)');
    }catch(error){failed++;rowStatus(i,'실패: '+String(error.message||error).slice(0,110));}
    processed++;progress(`처리 ${processed}/${candidates.length} · 저장 ${saved} · 건너뜀 ${skipped} · 실패 ${failed}`);
   }
  }finally{
   running=false;
   const remaining=candidates.length-processed;
   progress(`완료: 저장 ${saved}건 · 기존 사진 건너뜀 ${skipped}건 · 실패 ${failed}건${remaining?' · 미처리 '+remaining+'건':''}. 실패·미처리 파일을 다시 선택해 재시도할 수 있습니다.`);
   el('hrBulkPhotoFiles').disabled=false;el('hrBulkPhotoOverwrite').disabled=false;el('hrBulkPhotoCancel').disabled=true;
   // Prevent accidental repeat replacements when batch has finished.
   el('hrBulkPhotoStart').disabled=true;
   el('hrBulkPhotoFiles').value='';
  }
 }
})();
</script>

<script id="hrPhotoAdminScript">
(function(){
 'use strict';
 let latestIds=null,loading=false,scanToken=0,scope='active',query='';
 const byId=id=>document.getElementById(id);

 // Keep the existing employee data and photo Storage untouched: read-only report.
 window.__hrPhotoAdminView=()=>`<section class="panel">
  <h2>직원 사진 일괄 등록</h2>

  <div class="toolbar"><button type="button" class="btn primary" id="hrBulkPhotoOpen">직원 사진 일괄 등록 열기</button></div>
 </section>
 <section class="panel">
  <h2>사진 미등록 직원 조회</h2>

  <div class="hr-photo-admin-filters">

   <label>조회 범위 <select id="hrPhotoScope"><option value="active" ${scope==='active'?'selected':''}>퇴사자 제외</option><option value="all" ${scope==='all'?'selected':''}>퇴사자 포함 전체</option></select></label>
   <input type="search" id="hrPhotoMissingSearch" placeholder="사번, 성명, 법인, 부서 검색" aria-label="사진 미등록 직원 검색" autocomplete="off">
  </div>
  <div id="hrPhotoScanStatus" role="status" aria-live="polite" class="hint">사진 저장소 조회 전</div>
  <div id="hrPhotoMetrics" class="hr-photo-admin-metrics"></div>
  <div class="hr-photo-admin-scroll"><table><thead><tr><th>사번</th><th>성명</th><th>법인</th><th>본부 / 부서</th><th>상태</th></tr></thead><tbody id="hrPhotoMissingRows"><tr><td colspan="5">조회 버튼을 누르면 미등록 명단이 표시됩니다.</td></tr></tbody></table></div>
  <p class="hint" id="hrPhotoMissingCount"></p>
 </section>`;
 function listEmployees(){return (db.employees||[]).filter(e=>scope==='all'||e.status!=='퇴사');}
 function draw(){
  const tbody=byId('hrPhotoMissingRows');if(!tbody)return;
  const metrics=byId('hrPhotoMetrics');const note=byId('hrPhotoMissingCount');
  if(!latestIds){metrics.innerHTML='';tbody.innerHTML='<tr><td colspan="5">사진 저장소 조회 후 표시됩니다.</td></tr>';note.textContent='';return;}
  const employees=listEmployees();const complete=employees.filter(e=>latestIds.has(String(e.id)));
  const missing=employees.filter(e=>!latestIds.has(String(e.id)));
  const term=normalize(query).trim();const filtered=missing.filter(e=>!term||[e.employee_no,e.name,e.corporation,e.headquarters,e.department].some(v=>normalize(v).includes(term)));
  metrics.innerHTML=`<div class="hr-photo-admin-metric">조회 인원<strong>${employees.length.toLocaleString('ko-KR')}명</strong></div><div class="hr-photo-admin-metric">사진 등록<strong>${complete.length.toLocaleString('ko-KR')}명</strong></div><div class="hr-photo-admin-metric">사진 미등록<strong>${missing.length.toLocaleString('ko-KR')}명</strong></div>`;
  tbody.innerHTML=filtered.map(e=>`<tr><td>${html(e.employee_no)}</td><td>${html(e.name)}</td><td>${html(e.corporation)}</td><td>${html(e.headquarters)} / ${html(e.department)}</td><td>${html(e.status)}</td></tr>`).join('')||'<tr><td colspan="5">조건에 맞는 사진 미등록 직원이 없습니다.</td></tr>';
  note.textContent=`미등록 ${missing.length.toLocaleString('ko-KR')}명 중 ${filtered.length.toLocaleString('ko-KR')}명 표시 · 사진 조회 시각: ${new Date().toLocaleString('ko-KR')}`;
 }
 async function refresh(){
  if(loading)return;
  const status=byId('hrPhotoScanStatus');const api=window.__hrPhotoStorage;
  if(!api?.ready()){latestIds=null;draw();if(status)status.textContent='공동 DB 로그인 후 사진 저장소를 조회할 수 있습니다.';return;}
  loading=true;latestIds=null;draw();if(status)status.textContent='비공개 저장소의 사진 목록 조회 중…';
  const button=byId('hrPhotoRefresh');if(button)button.disabled=true;
  const token=++scanToken;
  try{
   const ids=await api.listRegisteredIds();
   if(token!==scanToken||view!=='photoAdmin')return;
   latestIds=ids;
   if(status)status.textContent='사진 저장소 조회 완료 · 최신 파일 기준';
   draw();
  }catch(err){
   if(token!==scanToken||view!=='photoAdmin')return;
   latestIds=null;draw();if(status)status.textContent='사진 등록 여부 확인 실패: '+String(err?.message||err)+' · 미등록 명단을 표시하지 않습니다.';
  }finally{loading=false;if(byId('hrPhotoRefresh'))byId('hrPhotoRefresh').disabled=false;}
 }
 function mount(){
  if(view!=='photoAdmin')return;
  byId('hrBulkPhotoOpen')?.addEventListener('click',()=>window.__hrOpenBulkPhoto?.());
  byId('hrPhotoRefresh')?.addEventListener('click',refresh);
  const select=byId('hrPhotoScope');if(select)select.onchange=()=>{scope=select.value;draw();};
  const search=byId('hrPhotoMissingSearch');if(search){search.value=query;search.addEventListener('input',()=>{query=search.value;draw();});}
  // Query once on entry; never claim a missing photo until list succeeds.
  refresh();
 }
 // Route this new view before the legacy render chain. Earlier render overrides
 // only know the old views and would otherwise call an undefined renderer.
 const previousRender=render;
 render=function(){
  if(view==='photoAdmin'){
   // Central setView already applies the login guard. Do not silently
   // redirect from this renderer: a transient refresh failure should not
   // make an already displayed photo-management screen jump to login.
   if(!window.__hrCloudConnected?.()){
    byId('heading').textContent='직원 사진 관리';
    byId('subheading').textContent='로그인 상태 확인';
    byId('content').innerHTML='<section class="panel"><h2>공동 DB 연결 확인 필요</h2><p class="hint">현재 로그인 상태를 확인할 수 없습니다. 다른 데이터를 변경하지 않았습니다.</p><button type="button" class="btn primary" id="hrPhotoGoLogin">공유 설정에서 다시 로그인</button></section>';
    byId('hrPhotoGoLogin')?.addEventListener('click',()=>setView('cloud'));
    return;
   }
   const title=names.photoAdmin;
   byId('heading').textContent=title[0];
   byId('subheading').textContent=title[1];
   byId('content').innerHTML=window.__hrPhotoAdminView();
   document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view==='photoAdmin'));
   mount();
   return;
  }
  return previousRender.apply(this,arguments);
 };
 // The folder navigation was built earlier; insert in System Management directly.
 const systemGroup=[...document.querySelectorAll('.nav-folder')].find(folder=>folder.querySelector('.folder-head')?.textContent.includes('시스템 관리'));
 const target=systemGroup?.querySelector('.folder-items');
 if(target&&!target.querySelector('[data-view="photoAdmin"]')){
  const button=document.createElement('button');button.type='button';button.className='nav';button.dataset.view='photoAdmin';button.textContent='직원 사진 관리';
  button.addEventListener('click',()=>{
   if(!window.__hrCloudConnected?.()){
    // Existing global guard routes to shared login. Explain why clearly.
    alert('현재 공동 DB 로그인 세션이 없습니다. [3인 공유 설정]에서 다시 로그인한 뒤 직원 사진 관리를 열어 주세요.');
    setView('cloud');

   }

<script id="currentScreenExcelFix">
/* Current-screen Excel: export what is actually rendered instead of falling back to Summary.
   Read-only: does not mutate db, Supabase or photo storage. */
(function(){
 'use strict';
 const outName=(value)=>String(value||'현재화면').replace(/[\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,35)||'현재화면';
 const tidy=(value)=>String(value||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n\s*\n/g,'\n').trim();
 const visible=(element)=>{
   if(!element||element.hidden||element.closest('[hidden],.hidden,[aria-hidden="true"]'))return false;
   const css=window.getComputedStyle(element);
   return css.display!=='none'&&css.visibility!=='hidden';
 };
 const getCell=(cell)=>{
   if(!visible(cell))return '';
   const clone=cell.cloneNode(true);
   // Buttons used to open employee profiles contain useful name text.
   // Remove action buttons, but retain buttons that represent a data value.
   clone.querySelectorAll('button,input[type="checkbox"],input[type="radio"],.no-print').forEach(el=>{
     if(el.matches('button')&&(el.matches('.hr-name-link,[data-employee-detail],[data-interview-id]')||(!el.classList.contains('btn')&&!el.hasAttribute('onclick')))){
       el.replaceWith(document.createTextNode(el.textContent||''));
     } else el.remove();
   });
   clone.querySelectorAll('input:not([type="checkbox"]),select,textarea').forEach(el=>{
     const original=cell.querySelector('#'+CSS.escape(el.id||'__no_id__'));
     el.replaceWith(document.createTextNode(original?.value||el.value||''));
   });
   return tidy(clone.innerText||clone.textContent||'');
 };
 function exportTable(table){
   const trs=Array.from(table.querySelectorAll('tr')).filter(visible);
   if(!trs.length)return [];
   // Exclude UI-only columns such as edit, delete, select and management.
   const header=trs.find(tr=>tr.querySelector('th'))||trs[0];
   const cells=Array.from(header.children).filter(el=>el.matches('th,td'));
   const ignored=new Set();
   cells.forEach((c,i)=>{const label=tidy(c.textContent);if(c.querySelector('input[type="checkbox"],input[type="radio"]')||/^(관리|수정|삭제|선택|처리|상세|사진관리|사진 관리)$/.test(label))ignored.add(i);});
   return trs.map(tr=>{
     const cols=Array.from(tr.children).filter(el=>el.matches('th,td'));
     return cols.filter((c,i)=>!ignored.has(i)&&visible(c)).map(c=>getCell(c));
   }).filter(row=>row.length&&row.some(v=>v!==''));
 }
 function panelTitle(table,idx){
   const root=table.closest('.panel,.exec-section,section')||table.parentElement;
   const heading=root?.querySelector('h2,h3,.report-head h2,.smallcaps');
   return tidy(heading?.textContent)||('표 '+idx);
 }
 function makeUniqueName(value,seen){
   const base=outName(value).slice(0,31);let name=base,n=2;
   while(seen.has(name)){const suffix='_'+n++;name=base.slice(0,31-suffix.length)+suffix;}
   seen.add(name);return name;
 }
 window.downloadCurrentScreenExcel=function(){
   const container=document.getElementById('content');
   if(!container){alert('현재 화면을 찾지 못했습니다.');return;}
   const isLogged=typeof window.__hrCloudConnected==='function'&&window.__hrCloudConnected();
   if(!isLogged){alert('공동 DB 로그인 후 다운로드할 수 있습니다.');return;}
   const sectionName=tidy(document.getElementById('heading')?.textContent||'현재화면');
   const sheets=[],seen=new Set();
   const cards=Array.from(container.querySelectorAll('.cards .card')).filter(visible).map(el=>{
      const label=tidy(el.querySelector('.label')?.textContent);
      const val=tidy(el.querySelector('.num')?.textContent);
      const note=tidy(el.querySelector('.note')?.textContent);
      return label?[label,val,note]:null;
   }).filter(Boolean);
   if(cards.length)sheets.push({name:makeUniqueName('화면 요약',seen),rows:[['항목','값','설명'],...cards]});
   const tables=Array.from(container.querySelectorAll('table')).filter(visible);
   tables.forEach((table,i)=>{
      const rows=exportTable(table);
      if(!rows.length)return;
      const title=panelTitle(table,i+1);
      sheets.push({name:makeUniqueName(title,seen),rows});
   });
   // Some views contain field cards or textual records without a table.
   if(!sheets.length){
      alert('현재 화면에 Excel로 내려받을 표 또는 집계가 없습니다. 다른 조회 화면에서 시도해 주세요.');
      return;
   }
   const filename='생산직_인사TO_현재화면_'+outName(sectionName);
   try{window.__unionMakeXlsx(filename,sheets)}
   catch(error){console.error('현재 화면 Excel 저장 실패',error);alert('Excel 생성 실패: '+String(error?.message||error));}
 };
})();
</script>

<script>
/* Match surrounding cells at default size; fit only overflowing school/major text. */
(function(){
 function fit(){
  const root=document.getElementById('hrRecordPrintArea');if(!root)return;
  root.querySelectorAll('.hr-record-school tbody tr').forEach(row=>{
   [3,4].forEach(index=>{
    const cell=row.cells[index];if(!cell)return;
    let span=cell.querySelector('.hr-education-fit');
    if(!span){span=document.createElement('span');span.className='hr-education-fit';span.textContent=cell.textContent;cell.replaceChildren(span);}
    span.style.fontSize='';span.style.transform='none';
    const available=Math.max(1,cell.clientWidth-6);
    const actual=span.getBoundingClientRect().width;
    if(actual<=available)return; // Ordinary names keep the same font size as other cells.
    const normal=parseFloat(getComputedStyle(cell).fontSize)||12;
    const proposed=Math.min(normal,normal*available/actual);
    const fitted=Math.max(8,proposed);
    span.style.fontSize=fitted+'px';
    const after=span.getBoundingClientRect().width;
    if(after>available)span.style.transform='scaleX('+Math.max(.1,available/after)+')';
   });
  });
 }
 window.__hrFitEducationCells=fit;
 window.addEventListener('beforeprint',fit);
 window.addEventListener('afterprint',fit);
 window.addEventListener('resize',()=>{if(document.getElementById('hrRecordPrintArea'))fit();});
})();
</script>

 function overlay(){let root=document.getElementById('hrRecordOverlay');if(root)return root;root=document.createElement('div');root.id='hrRecordOverlay';root.className='hr-record-overlay';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label','인사기록카드');document.body.append(root);return root;}
 function close(){const root=document.getElementById('hrRecordOverlay');if(root)root.remove();if(photoUrl){URL.revokeObjectURL(photoUrl);photoUrl=null;}currentId=null;}
 function renderCard(e){const x=extraOf(e),root=overlay();root.dataset.mode='view';

   <div class="hr-record-top${hasEducationCareer?'':' hr-record-top-no-right'}">

  content+=tableSection('인사변동사항',['발령구분','변동일자','현재부서','발령부서','발령직위','직책','변동사유'],evt.map(h=>h.hr_card_appointment?[
   h.appointment_category||'',h.event_date,h.previous_department||'',h.appointed_department||'',h.appointed_position||'',h.appointed_role||'',h.change_reason||''

  const pr=[];for(const g of periods)for(let i=0;i<g.periods.length;i++)pr.push([g.label,(i+1)+'회차',g.periods[i].start_date,g.periods[i].end_date]);

 function editCard(id){const e=getEmp(id);if(!e)return;const x=extraOf(e),root=overlay();root.dataset.mode='edit';
  root.innerHTML=`<div class="hr-record-editor"><div class="hr-record-actions"><b>${show(e.name)} · 인사기록카드 추가항목 수정</b><button type="button" class="btn" id="hrCardEditCancel">취소</button></div><div class="notice">기존 사번·입사일·소속 등은 직원 [수정]에서 관리합니다. 이 화면은 인사기록카드의 추가 항목과 가족·학력·경력·자격 내역만 저장합니다.</div><div class="hr-record-edit-grid">${fieldDefs.map(([key,label])=>`<label class="${key==='resident_address'?'hr-record-address-field':''}">${safe(label)}${key==='resident_address'?`<textarea data-card-field="${safe(key)}" rows="2">${safe(x[key]||'')}</textarea>`:`<input data-card-field="${safe(key)}" value="${safe(x[key]||'')}">`}</label>`).join('')}</div><div id="hrRecordListEditor"></div><div class="hr-record-actions"><button type="button" class="btn" id="hrCardCancelBottom">취소</button><button type="button" class="btn primary" id="hrCardSave">추가항목 저장</button></div></div>`;

  root.querySelector('#hrCardSave').onclick=()=>{
   const updated={...extraOf(e)};
   root.querySelectorAll('[data-card-field]').forEach(input=>updated[input.dataset.cardField]=input.value.trim());
   for(const item of lists){const rows=[];root.querySelectorAll(`[data-list="${item.key}"] .hr-record-edit-row`).forEach(row=>{const obj={};row.querySelectorAll('[data-column]').forEach(input=>obj[input.dataset.column]=input.value.trim());if(Object.values(obj).some(Boolean))rows.push(obj)});updated[item.key]=rows;}
   e.hr_record_card=updated;
   close();commit('인사기록카드 추가항목 수정',String(e.employee_no||'')+' / 인사기록카드 보완');
   currentId=String(id);renderCard(e);
  };
 }
 function addRow(target,item,data){const row=document.createElement('div');row.className='hr-record-edit-row';
  row.innerHTML=item.columns.map(([key,label])=>`<label>${safe(label)}<input data-column="${safe(key)}" value="${safe(item.key==='school'&&key==='category'?(getEmp(currentId)?.education||''):(data[key]||''))}" ${item.key==='school'&&key==='category'?'readonly title="생산직 인원관리의 학력 항목에서 자동 반영"':''}></label>`).join('')+(item.key==='career'&&data.period?`<input type="hidden" data-column="period" value="${safe(data.period)}">`:'')+'<button type="button" class="btn tiny danger">삭제</button>';
  row.querySelector('button').onclick=()=>row.remove();target.append(row);
 }
 window.__hrRecordCardOpen=function(id){if(typeof window.__hrCloudConnected==='function'&&!window.__hrCloudConnected()){alert('공동 DB 로그인 후 열 수 있습니다.');return;}
  const e=getEmp(id);if(!e){alert('직원을 찾을 수 없습니다.');return;}currentId=String(id);renderCard(e);
 };
 document.addEventListener('click',function(event){const btn=event.target.closest?.('[data-employee-detail]');if(!btn)return;
  event.preventDefault();event.stopImmediatePropagation();window.__hrRecordCardOpen(btn.getAttribute('data-employee-detail'));
 },true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('hrRecordOverlay'))close()});
})();

</script>

<script>
/* Record card 5-category, employee-number-matched XLSX importer.

(function(){

let current=null,preview=null,source='';

function modalFor(type){

 current=type;preview=null;source='';
 let root=document.getElementById('hrBulkCardOverlay');if(root)root.remove();
 const cfg=configs[type];root=document.createElement('div');root.id='hrBulkCardOverlay';root.className='hr-bulk-backdrop';
 root.innerHTML=`<div class="hr-bulk-modal" role="dialog" aria-modal="true" aria-label="${html(cfg.title)}"><div class="hr-record-actions"><h2 style="margin:0">${html(cfg.title)}</h2><button class="btn" id="hrBulkClose">닫기</button></div>
 <div class="notice">엑셀 첫 시트의 <b>사번</b>을 직원 명단과 정확하게 대조합니다. 사번 불일치·중복 직원·값 충돌은 제외합니다. 기존 이력은 유지하고 새로운 행만 추가합니다. 빈 셀은 기존 내용을 지우지 않습니다.${type==='address'?' 주소 열의 값은 해당 직원 인사기록카드의 주민등록주소로 저장합니다. 같은 사번의 주소가 서로 다르면 등록을 제외합니다.':''}${type==='appointment'?' 같은 사번은 엑셀 맨 마지막 행이 최초 변동입니다. 아래 행부터 역순 등록하며, <b>현재 직원의 소속·직위·직책은 변경하지 않고 이력만 추가</b>합니다.':''}</div>
 <div class="hr-bulk-toolbar"><button class="btn" id="hrBulkTemplate">${html(cfg.title)} 엑셀 양식 다운로드</button><label class="btn" style="cursor:pointer">작성된 엑셀 선택<input id="hrBulkFile" type="file" accept=".xlsx" hidden></label><span id="hrBulkFilename" class="hr-bulk-status">선택된 파일 없음</span></div>
 <div id="hrBulkPreview"><div class="empty">작성한 엑셀을 선택하면 대상자와 제외 항목을 보여줍니다.</div></div>
 <div class="hr-record-actions"><span class="hint">검토 후 적용해 주세요. 적용 전 JSON 백업을 권장합니다.</span><button class="btn primary" id="hrBulkApply" disabled>검증된 항목 일괄 등록</button></div></div>`;
 document.body.append(root);
 root.querySelector('#hrBulkClose').onclick=()=>root.remove();

 root.querySelector('#hrBulkFile').onchange=async ev=>{

}
function template(type){const make=window.__unionMakeXlsx;if(typeof make!=='function'){alert('엑셀 양식 생성 기능을 찾을 수 없습니다.');return;}make('인사기록카드_'+configs[type].title+'_양식',[{name:'일괄등록',rows:[cols(configs[type])]}]);}
function getText(root,tag){return root.getElementsByTagName(tag)[0]?.textContent||'';}
async function inflate(data){if(typeof DecompressionStream==='undefined')throw Error('이 브라우저는 XLSX 압축 해제를 지원하지 않습니다. 최신 Chrome 또는 Edge를 사용하세요.');let stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));let buf=await new Response(stream).arrayBuffer();if(buf.byteLength>20*1024*1024)throw Error('엑셀 압축 해제 크기가 제한을 초과했습니다.');return new Uint8Array(buf);}
function u16(v,i){return v[i]|(v[i+1]<<8)}

function appointmentDate(value){
 let text=String(value??'').trim();
 if(/^\d{5}(?:\.0+)?$/.test(text)){
  const days=Number(text);if(days<1||days>150000)return '';
  const date=new Date(Date.UTC(1899,11,30)+days*86400000);
  text=date.toISOString().slice(0,10);
 }
 const m=/^(\d{4})[-./]?(\d{1,2})[-./]?(\d{1,2})$/.exec(text);
 if(!m)return '';
 const y=Number(m[1]),mon=Number(m[2]),day=Number(m[3]);
 const d=new Date(Date.UTC(y,mon-1,day));
 if(y<1900||y>2100||d.getUTCFullYear()!==y||d.getUTCMonth()!==mon-1||d.getUTCDate()!==day)return '';

}
function appointmentSignature(r){return ['appointment_category','event_date','previous_department','appointed_department','appointed_position','appointed_role','change_reason'].map(k=>String(r[k]??'').trim()).join('\u241f');}
function validateAppointments(rows,type){
 const cfg=configs[type],errors=[],groups=new Map(),records=[];
 for(const row of rows){
  const no=String(row['사번']||'').trim();
  if(!no){errors.push({row:row.row,no:'-',reason:'사번 누락'});continue;}
  if(!/^[0-9A-Za-z_-]{1,40}$/.test(no)){errors.push({row:row.row,no,reason:'사번 형식 오류'});continue;}
  const candidates=employees(no);
  if(candidates.length!==1){errors.push({row:row.row,no,reason:candidates.length?'직원 명단에 동일 사번이 여러 건':'일치 직원 없음'});continue;}
  const val=Object.fromEntries(cfg.fields.map(([key,label])=>[key,String(row[label]||'').trim()]));
  const formatted=appointmentDate(val.event_date);
  if(!formatted){errors.push({row:row.row,no,reason:'변동일자 누락 또는 날짜 형식 오류'});continue;}
  val.event_date=formatted;
  if(!cfg.fields.filter(([key])=>key!=='event_date').some(([key])=>val[key])){errors.push({row:row.row,no,reason:'변동내용이 비어 있음'});continue;}
  let g=groups.get(no);
  if(!g){g={no,employee:candidates[0],rows:[],items:[],scalars:{},conflicts:[]};groups.set(no,g);}

 }
 for(const g of groups.values()){
  // The bottom-most Excel row is the earliest personnel change for each employee.
  const existingHistory=(db.history||[]).filter(h=>String(h.employee_id)===String(g.employee.id)&&h.hr_card_appointment===true);
  const seen=new Set(existingHistory.map(appointmentSignature));
  const additions=[];
  for(const item of [...g.items].reverse()){
   const sig=appointmentSignature(item);
   if(seen.has(sig)){errors.push({row:item.__excelRow,no:g.no,reason:'기존 또는 엑셀 내 동일 인사변동 기록'});continue;}
   seen.add(sig);additions.push(item);
  }
  if(additions.length)records.push({...g,additions,changes:{}});
 }

}
function careerDate(value){
 let v=String(value??'').trim();
 if(!v)return '';
 if(/^\d{5}(?:\.0+)?$/.test(v)){
  const serial=Number(v);if(serial<1||serial>150000)return null;
  v=new Date(Date.UTC(1899,11,30)+serial*86400000).toISOString().slice(0,10);
 }
 const m=/^(\d{4})[-./]?(\d{1,2})[-./]?(\d{1,2})$/.exec(v);
 if(!m)return null;
 const y=+m[1],mon=+m[2],day=+m[3],d=new Date(Date.UTC(y,mon-1,day));
 if(y<1900||y>2100||d.getUTCFullYear()!==y||d.getUTCMonth()!==mon-1||d.getUTCDate()!==day)return null;

function validate(rows,type){
 if(type==='appointment')return validateAppointments(rows,type);
 const cfg=configs[type],errors=[],groups=new Map(),records=[];
 for(const row of rows){
  const no=String(row['사번']||'').trim();
  if(!no){errors.push({row:row.row,no:'-',reason:'사번 누락'});continue;}
  if(!/^[0-9A-Za-z_-]{1,40}$/.test(no)){errors.push({row:row.row,no,reason:'사번 형식 오류'});continue;}
  const candidates=employees(no);
  if(candidates.length!==1){errors.push({row:row.row,no,reason:candidates.length?'등록된 동일 사번이 여러 건':'일치하는 직원 없음'});continue;}
  const val=Object.fromEntries(cfg.fields.map(([key,label])=>[key,String(row[label]||'').trim()]));
  if(type==='career'){
   const start=careerDate(val.start_date),end=careerDate(val.end_date);
   if(start===null||end===null){errors.push({row:row.row,no,reason:'경력시작일 또는 경력종료일 날짜 형식 오류'});continue;}
   if(start&&end&&start>end){errors.push({row:row.row,no,reason:'경력종료일이 경력시작일보다 빠름'});continue;}
   val.start_date=start;val.end_date=end;
  }
  const extra=Object.fromEntries((cfg.optional||[]).map(([key,label])=>[key,String(row[label]||'').trim()]));
  if(!Object.values(val).some(Boolean)&&!Object.values(extra).some(Boolean)){errors.push({row:row.row,no,reason:'입력 값 없음'});continue;}
  if(cfg.key&&Object.values(val).some(Boolean)&&!val[cfg.required]){errors.push({row:row.row,no,reason:'필수 내용 누락 ('+cfg.fields.find(x=>x[0]===cfg.required)[1]+')'});continue;}
  let g=groups.get(no);
  if(!g){g={no,employee:candidates[0],rows:[],items:[],scalars:{},conflicts:[]};groups.set(no,g);}
  g.rows.push(row.row);
  if(cfg.key&&Object.values(val).some(Boolean))g.items.push(val);
  if(!cfg.key){for(const [key,value] of Object.entries(val)){if(!value)continue;if(g.scalars[key]&&g.scalars[key]!==value)g.conflicts.push(key+' 값 충돌');else g.scalars[key]=value;}}
  for(const [key,value] of Object.entries(extra)){if(!value)continue;if(g.scalars[key]&&g.scalars[key]!==value)g.conflicts.push(key+' 값 충돌');else g.scalars[key]=value;}
 }
 for(const g of groups.values()){
  if(g.conflicts.length){for(const row of g.rows)errors.push({row,no:g.no,reason:[...new Set(g.conflicts)].join(', ')});continue;}
  const old=existing(g.employee),oldList=Array.isArray(old[cfg.key])?old[cfg.key]:[],seen=new Set(oldList.map(x=>signature(x,cfg.fields)));
  const additions=[];
  for(let i=0;i<g.items.length;i++){
   const item=g.items[i],sig=signature(item,cfg.fields);
   if(seen.has(sig)){
    errors.push({row:g.rows[i]??'-',no:g.no,reason:'기존 기록 또는 엑셀 내 완전 동일한 내용 (중복 제외)'});
    continue;
   }
   seen.add(sig);additions.push(item);
  }
  const changes={};for(const [key,value] of Object.entries(g.scalars))if(value!==String(old[key]||'').trim())changes[key]=value;
  if(!additions.length&&!Object.keys(changes).length){errors.push({row:g.rows.join(','),no:g.no,reason:'새로 반영할 내용 없음'});continue;}
  records.push({...g,additions,changes});
 }
 return {type,rows,records,errors};
}

<script>
/* Reference-master UI bridge (2026-11): changes in master data drive all current selectors.

(function(){
 'use strict';
 const supported=['corporation','headquarters','department','position','grade','education','field_leader_role','salary_type','employment_type'];
 const list=(type,corporation='',headquarters='')=>{
   const fn=window.__hrMasterCandidates;
   if(typeof fn!=='function')return [];
   const values=fn(type,corporation,headquarters).filter(Boolean);
   if(type==='field_leader_role'){
     // Keep employee filters identical to the values displayed in the roster/editor.

     const preferred=['라인장','미지정','팀원','파트장','그룹장'];
     return [...new Set(values)].sort((a,b)=>{const ai=preferred.indexOf(a),bi=preferred.indexOf(b);return (ai<0?preferred.length:ai)-(bi<0?preferred.length:bi)||a.localeCompare(b,'ko');});
   }
   return [...new Set(values)];
 };
 const currentValue=(employee,type)=>{
   if(type==='field_leader_role')return employee?.field_leader_role||'미지정';
   if(type==='salary_type')return employee?.salary_type||'미지정';
   if(type==='employment_type')return employee?.employment_type||'미확인';
   return employee?.[type]||'';
 };
 function choices(type,current='',allowBlank=false){
   const values=list(type);
   if(current&&!values.includes(current))values.push(current); // Retain legacy selections to avoid silent data loss.
   return [...new Set((allowBlank?['']:[]).concat(values))];
 }
 function updateSelect(node,values,selected,blankLabel){
   if(!node)return;
   const old=selected===undefined?node.value:selected;
   const all=[...new Set(values.concat(old&&!values.includes(old)?[old]:[]))];
   node.replaceChildren();
   if(blankLabel!==undefined){const option=new Option(blankLabel,'');node.add(option);}
   for(const name of all){if(!name)continue;node.add(new Option(name,name));}
   node.value=old??'';
 }
 function updateEmployeeModal(){

   ]){

 }

   if(view==='employees'){
     for(const [id,type] of [['ef_field_leader_role','field_leader_role'],['ef_salary_type','salary_type'],['ef_employment_type','employment_type'],['ef_position','position'],['ef_grade','grade'],['ef_education','education']]){

 };

 document.addEventListener('click',event=>{
   if(!event.target.closest('#empOpenMassEdit'))return;

   }
   for(const type of ['position','grade','education']){
     const dl=document.getElementById('mass-list-'+type);
     if(dl)dl.replaceChildren(...list(type).map(v=>{const op=document.createElement('option');op.value=v;return op;}));
   }
 });
 // Make an already-broken previous "미지정" -> "팀원" rename explicitly repairable.
 // No silent employee modifications on sign-in or load.
 const priorRenderForRepair=window.render;
 window.render=function(){const output=priorRenderForRepair.apply(this,arguments);
   if(view==='master'&&document.getElementById('masterType')?.value==='field_leader_role'){
     const old=(db.reference_master||[]).some(x=>x.type==='field_leader_role'&&x.value==='미지정'&&x.deleted===true);
     const newRole=list('field_leader_role').includes('팀원');
     const missing=(db.employees||[]).filter(x=>!x.field_leader_role||x.field_leader_role==='미지정').length;
     if(old&&newRole&&missing){
       const bar=document.querySelector('#content .report-head');
       if(bar&&!document.getElementById('repairFieldLeaderReference')){
         const btn=document.createElement('button');btn.id='repairFieldLeaderReference';btn.type='button';btn.className='btn';
         btn.textContent='이전 명칭 변경 누락 복구 ('+missing+'명)';bar.appendChild(btn);
       }
     }
   }
   return output;
 };
 document.addEventListener('click',ev=>{
   if(!ev.target.closest('#repairFieldLeaderReference'))return;
   if(!window.__hrCloudConnected?.()){alert('공유 DB에 로그인한 후 복구하세요.');return;}

   if(!obsolete||!list('field_leader_role').includes('팀원')||!entries.length){alert('복구 대상이 없습니다.');return;}
   if(!confirm('기존 기준정보 변경이 직원에게 적용되지 않은 '+entries.length+'명을 확인했습니다.\n현장관리자 구분을 미지정에서 팀원으로 변경하시겠습니까?\n과거 인사발령 이력과 월별 저장 실적은 유지합니다.'))return;
   for(const e of entries)e.field_leader_role='팀원';
   commit('기준정보 이전 변경 복구','현장관리자 구분 미지정 → 팀원 / '+entries.length+'명');
   alert(entries.length+'명의 화면 값 변경을 공동 DB에 저장 요청했습니다. 공유 저장 완료를 확인하세요.');
 });
 // Old employee editor saves the updated reference value already; this bridge only

})();
