<script>
/* HR quality, revision comparison, actionable alerts, monthly change analysis. */
(function(){
'use strict';
const TYPES={corporation:'법인',headquarters:'본부 / 실',department:'부서 / 팀',position:'직위',grade:'직급',education:'학력',field_leader_role:'현장관리자 구분',salary_type:'급여 형태',employment_type:'고용형태'};
const EDIT_FIELDS={corporation:'법인',headquarters:'본부 / 실',department:'부서',position:'직위',grade:'직급',education:'학력',field_leader_role:'현장관리자 구분',salary_type:'급여 형태',employment_type:'고용형태',status:'재직 상태',hire_date:'입사일',exit_date:'퇴사일',leave_date:'휴직 시작일'};
const REQUIRED={employee_no:'사번',name:'성명',corporation:'법인',headquarters:'본부 / 실',department:'부서',hire_date:'입사일',status:'재직 상태'};
const RECOMMENDED={position:'직위',grade:'직급',employment_type:'고용형태',field_leader_role:'현장관리자 구분'};
const label={quality:['인사 데이터 점검센터','누락·중복·날짜·기준정보 불일치를 확인하고 해당 직원을 바로 수정합니다.'],changes:['인사정보 변경 전후 비교','이번 기능 적용 이후 저장한 인사정보 변경을 변경일·변경항목별로 비교합니다.'],alerts:['인사 일정 알림센터','계약기간·정규직 전환·퇴사 예정·정년 예상·인사정보 누락을 확인합니다.'],trends:['생산직 인력 증감 분석','월별 입사·퇴사와 월말 확정 인원의 증감을 구분해 확인합니다.']};
const day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const validDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||'')))return false;const d=new Date(v+'T00:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===v;};
const daysUntil=v=>validDate(v)?Math.round((Date.parse(v+'T00:00:00Z')-Date.parse(day()+'T00:00:00Z'))/86400000):null;
const txt=v=>String(v??'').trim();
const live=()=>db.employees.filter(e=>e.status!=='퇴사');
let qualityMasterCache=null;function references(type){if(!qualityMasterCache){qualityMasterCache=new Map();const items=typeof window.__hrMasterRows==='function'?window.__hrMasterRows():[];for(const item of items){const key=item.type||'';if(!qualityMasterCache.has(key))qualityMasterCache.set(key,[]);qualityMasterCache.get(key).push(item);}}return qualityMasterCache.get(type)||[];}
function normalizeEmpValue(e,k){return txt(e[k]??(k==='field_leader_role'?'미지정':''));}
function referenceProblem(e,k){const value=normalizeEmpValue(e,k);if(!value)return false;const refs=references(k);if(!refs.length)return false;const relevant=refs.filter(r=>r.value===value&&(!r.corporation||r.corporation===e.corporation)&&(!r.headquarters||r.headquarters===e.headquarters));return relevant.length===0||relevant.every(r=>r.deleted===true||r.active===false);}
function missing(e,keys){return Object.entries(keys).filter(([k])=>!txt(e[k])).map(([,v])=>v);}
function completeness(e){
 // 계약직은 권장정보 누락 점검 대상에서 제외한다. 필수정보·중복·날짜·기준정보 검사는 유지한다.
 const required=missing(e,REQUIRED);
 const contract=txt(e.employment_type)==='계약직';
 const recommended=contract?[]:missing(e,RECOMMENDED);
 const expected=Object.keys(REQUIRED).length+(contract?0:Object.keys(RECOMMENDED).length);
 return {required,recommended,pct:Math.round(100*(expected-required.length-recommended.length)/expected)};
}
function problems(){qualityMasterCache=null;const out=[],seen=new Map();for(const e of db.employees){const no=txt(e.employee_no);if(no){seen.set(no,(seen.get(no)||0)+1);}}
 for(const e of db.employees){const m=completeness(e);for(const v of m.required)out.push({id:e.id,kind:'필수정보 누락',what:v});for(const v of m.recommended)out.push({id:e.id,kind:'권장정보 누락',what:v});if(txt(e.employee_no)&&seen.get(txt(e.employee_no))>1)out.push({id:e.id,kind:'중복 사번',what:'동일 사번 '+seen.get(txt(e.employee_no))+'건'});
 for(const [k,lab] of Object.entries(TYPES))if(referenceProblem(e,k))out.push({id:e.id,kind:'기준정보 불일치',what:lab+' · '+normalizeEmpValue(e,k)});
 for(const [k,lab] of Object.entries({hire_date:'입사일',exit_date:'퇴사일',leave_date:'휴직 시작일',scheduled_exit_date:'퇴사 예정일',conversion_date:'전환일'})){const v=txt(e[k]);if(v&&!validDate(v))out.push({id:e.id,kind:'날짜 오류',what:lab});}
 if(e.status==='퇴사'&&!validDate(e.exit_date))out.push({id:e.id,kind:'퇴사일 확인',what:'퇴사일 미등록 또는 형식 오류'});
 if(validDate(e.hire_date)&&validDate(e.exit_date)&&e.exit_date<e.hire_date)out.push({id:e.id,kind:'날짜 오류',what:'퇴사일이 입사일보다 빠름'});
 }
 return out;
}
const safe=esc;
function empButton(e,text='수정'){return `<button type="button" class="btn tiny" data-qa-edit="${safe(String(e.id))}">${safe(text)}</button>`;}
function btnView(v,caption){return `<button type="button" class="btn tiny" data-qa-view="${v}">${caption}</button>`;}
let qKind='전체',qDetail='전체',qText='',changeText='',alertKind='전체',alertLevel='전체',trendYear=new Date().getFullYear(),trendMonth=new Date().getMonth()+1,trendCorp='',trendHQ='',trendDept='';
// Keep the established issue-detection rules unchanged; enrich each detected issue
// for actionable inspection without changing any employee record or persistence path.
const QUALITY_FIELD_KEYS=Object.fromEntries([...Object.entries(REQUIRED),...Object.entries(RECOMMENDED),...Object.entries(TYPES),['퇴사 예정일','scheduled_exit_date'],['전환일','conversion_date'],['휴직 시작일','leave_date'],['퇴사일','exit_date']].map(([k,v])=>[v,k]));
function qualityIssueInfo(r,e){
 const name=txt(r.what),category=r.kind;
 const result={type:category,field:name,value:'—',reason:'',action:'직원 수정 화면에서 해당 항목을 확인하세요.'};
 if(category==='필수정보 누락'||category==='권장정보 누락'){
   const key=QUALITY_FIELD_KEYS[name];result.field=name;result.type=(category==='필수정보 누락'?'필수':'권장')+' · '+name+' 미입력';
   result.value='미입력';result.reason=name+' 항목이 비어 있습니다.';
   result.action=category==='필수정보 누락'?'직원 수정 화면에서 '+name+' 항목을 입력한 뒤 저장하세요.':'업무상 확인 가능한 경우 '+name+' 항목을 입력하세요.';
 }else if(category==='중복 사번'){
   result.type='동일 사번 중복';result.field='사번';result.value=txt(e.employee_no)||'미입력';result.reason=name+' · 여러 직원에 동일한 사번이 등록되어 있습니다.';
   result.action='동일 사번으로 등록된 직원이 실제 중복인지 확인하고 필요한 건만 정정하세요.';
 }else if(category==='기준정보 불일치'){
   const field=name.split(' · ')[0];const key=Object.keys(TYPES).find(k=>TYPES[k]===field);const value=key?normalizeEmpValue(e,key):name.split(' · ').slice(1).join(' · ');
   result.field=field;result.value=value||'미입력';
   const refs=key?references(key):[];
   const activeMatches=refs.filter(x=>x.value===value&&!x.deleted&&x.active!==false);
   const scoped=activeMatches.filter(x=>(!x.corporation||x.corporation===e.corporation)&&(!x.headquarters||x.headquarters===e.headquarters));

   (known?(items.length?'<div class="exec-to-tags">'+items.map(r=>'<span class="exec-to-tag">'+escapeText(r.p.corporation)+' / '+escapeText(r.p.headquarters)+' / '+escapeText(r.p.department)+' <strong>'+(kind==='short'?'−':'+')+fmt(Math.abs(r.diff))+'명</strong></span>').join('')+'</div>':'<div class="exec-to-empty">해당 조직 없음</div>'):'<div class="exec-to-empty">해당 월의 운영인원 기록 없음</div>')+'</div>';
  return '<div class="exec-to-lists">'+render('부족 TO 팀',rows.filter(r=>r.diff<0).sort((a,b)=>a.diff-b.diff),'short')+render('초과 TO 팀',rows.filter(r=>r.diff>0).sort((a,b)=>b.diff-a.diff),'extra')+'</div>';
 };
 // Month-level snapshot figures are authoritative. Where absent, show employee-record dates

 const monthFlow=(y,m,selectedMonth)=>{
  const snap=(db.snapshots||[]).find(s=>Number(s.year)===Number(y)&&Number(s.month)===m);
  if(snap){
   if(snap.flow_units&&typeof snap.flow_units==='object'){
    const entries=Object.values(snap.flow_units);return {hires:entries.reduce((sum,v)=>sum+numeric(v?.hires),0),exits:entries.reduce((sum,v)=>sum+numeric(v?.exits),0),source:'월별 확정'};
   }
   if(snap.hire_count!=null&&snap.exit_count!=null)return {hires:numeric(snap.hire_count),exits:numeric(snap.exit_count),source:'월별 확정'};
  }
  const now=new Date(),isCurrent=Number(y)===now.getFullYear()&&m===now.getMonth()+1;
  if(isCurrent){
   const key=monthKey(y,m),people=db.employees||[];
   return {hires:people.filter(e=>String(e.hire_date||'').slice(0,7)===key).length,exits:people.filter(e=>e.status==='퇴사'&&String(e.exit_date||e.retirement_date||'').slice(0,7)===key).length,source:'직원 등록기록(참고)'};
  }

 };
 window.__hrExecFlowPanel=(y,selectedMonth)=>{
  y=Number(y);selectedMonth=Number(selectedMonth);

<script id="hrRollingMonthAndSafeClose20261110">
/* Current-month auto-follow and guarded online month-end closing.
   A static GitHub Pages document cannot execute after all browser tabs close.
   Historical snapshots are never manufactured retrospectively. */
(function(){
 'use strict';
 const tz='Asia/Seoul';
 const parts=()=>{
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));
  return {y:p.year,m:p.month,d:p.day,h:p.hour,min:p.minute};
 };
 const current=parts();
 let observed=`${current.y}-${current.m}`;
 let followCurrent=Number(planYear)===current.y&&Number(planMonth)===current.m;
 let closeBusy=false;
 // Explicitly selected historical months stay selected until the user returns to the current month.
 document.addEventListener('change',event=>{
  if(event.target?.id!=='planYear'&&event.target?.id!=='planMonth')return;
  setTimeout(()=>{const now=parts();followCurrent=Number(planYear)===now.y&&Number(planMonth)===now.m;},0);
 },true);
 const hasSnapshot=(y,m)=>(db.snapshots||[]).some(s=>Number(s.year)===y&&Number(s.month)===m);
 function onlineReady(){return Boolean(window.__hrMonthCloud?.ready())&&!document.getElementById('modalWrap')?.classList.contains('open');}
 function monthEnd(now){return now.d===new Date(Date.UTC(now.y,now.m,0)).getUTCDate();}
 function updateViewDate(now){
  const key=`${now.y}-${now.m}`;
  if(key===observed)return;
  const [priorY,priorM]=observed.split('-').map(Number);
  observed=key;
  if(!followCurrent)return;
  planYear=now.y;planMonth=now.m;
  // Preserve a user-selected trend period if it differs from the previously followed period.
  if(typeof trendYear!=='undefined'&&typeof trendMonth!=='undefined'){
   try{if(Number(trendYear)===priorY&&Number(trendMonth)===priorM){trendYear=now.y;trendMonth=now.m;}}
   catch(_){/* independent trend controls */}
  }
  if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render();
 }
 async function closeAtMonthEnd(){
  const n=parts();
  if(!monthEnd(n)||n.h!==23||n.min!==59||closeBusy||!onlineReady()||hasSnapshot(n.y,n.m))return;
  closeBusy=true;
  try{
   // Pull latest shared state first; never replace unsaved changes or overwrite an existing month.
   if(!await window.__hrMonthCloud.refresh())return;
   const fresh=parts();
   if(fresh.y!==n.y||fresh.m!==n.m||!monthEnd(fresh)||fresh.h!==23||fresh.min!==59||!onlineReady()||hasSnapshot(n.y,n.m))return;
   const people=(db.employees||[]).filter(occupied);
   if(!(db.employees||[]).length)return; // No trustworthy roster to close.
   const units={};
   for(const e of people){const k=keyOf(e);units[k]=(units[k]||0)+1;}
   db.snapshots??=[];
   db.snapshots.push({year:n.y,month:n.m,units,total:people.length,captured:new Date().toLocaleString('ko-KR',{timeZone:tz}),source:'online-auto-month-end'});
   // Existing CAS/revision save mechanism prevents silent overwrites by another user.
   commit('월말 인원 자동 기록',`${n.y}년 ${n.m}월 / ${people.length}명 / 접속 중 자동기록`);
  }catch(e){console.warn('월말 자동 기록을 완료하지 못했습니다:',e);}
  finally{closeBusy=false;}
 }
 const oldForecast=forecastView;
 forecastView=function(){
  return oldForecast.apply(this,arguments).replace('월말마다 저장한 수치가 월말 실적이 됩니다.',
   '월말 마지막 날 23:59(한국시간)에 로그인된 화면이 열려 있고 공동 DB가 정상 연결되어 있으면 자동 저장을 시도합니다. 이미 기록된 월은 변경하지 않습니다. 화면이 닫혀 있으면 자동 저장되지 않으므로 월말에 기록 여부를 확인하세요.');
 };
 window.__hrMonthStatus=()=>({today:parts(),followCurrent,onlineReady:onlineReady(),snapshots:(db.snapshots||[]).length});
 function tick(){const now=parts();updateViewDate(now);void closeAtMonthEnd();}
 setInterval(tick,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
 // For tests and manual verification; it does not force a month-end capture.
 window.__hrMonthTick=tick;
})();
</script>
